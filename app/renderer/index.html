<!doctype html>
<!--
  Session Atlas desktop app UI. Shared here: data model, helpers, spring motion and the
  session/step drawer; the Neovim interface lives in nvim.js, the terminal dock in terminal.js.
  Data comes from the Electron main process (preload exposes window.SESSION_DATA and window.atlasApp).
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c11; --ink: #ece9f5; --ink-2: #a9a5ba; --ink-3: #6f6b82;
  --glass: rgba(255,255,255,.055); --glass-2: rgba(255,255,255,.1); --line: rgba(255,255,255,.12);
  --violet: #8b6cff; --teal: #2dd4bf; --amber: #fabd2f; --rose: #fb7185; --green: #4ade80; --cyan: #22d3ee;
  --sans: "Figtree", -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; --display: "Orbitron", var(--sans);
  /* Spring easings in the spirit of Framer Motion */
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.06, 0.22 8%, 0.62 20%, 0.86 30%, 0.98 40%, 1.03 50%, 1.02 62%, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 14px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); }
.cap { color: var(--ink-2); font-size: 12.5px; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
  backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
  box-shadow: 0 1px 0 rgba(255,255,255,.07) inset, 0 18px 44px rgba(0,0,0,.4); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; flex: none; }
.dot.live { background: var(--green); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.mp { display: inline-flex; align-items: center; gap: 5px; font: 700 11px var(--mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--mc) 20%, transparent); color: color-mix(in srgb, var(--mc) 55%, white); border: 1px solid color-mix(in srgb, var(--mc) 40%, transparent); }
.opus { --mc: #8b6cff; } .sonnet { --mc: #3b82f6; } .haiku { --mc: #22c55e; } .fable { --mc: #f97316; } .x { --mc: #8a8799; }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
/* Shared entrance helpers looks may use: add class "in" and --i for stagger */
.in { animation: in .7s var(--spring) both; animation-delay: calc(var(--i, 0) * 35ms); }
@keyframes in { from { opacity: 0; transform: translateY(14px) scale(.96); } }
.fadein { animation: fadein .6s ease both; animation-delay: calc(var(--i, 0) * 30ms); }
@keyframes fadein { from { opacity: 0; } }
.draw { stroke-dasharray: var(--len, 1200); stroke-dashoffset: var(--len, 1200); animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; animation-delay: calc(var(--i, 0) * 40ms + 150ms); }
@keyframes draw { to { stroke-dashoffset: 0; } }

#stage { position: fixed; inset: 0; }

/* ---------- Shared drawer: a Neovim floating window (gruvbox, title in the border) ---------- */
#drawer { --g-bg:#1d2021; --g-bg1:#3c3836; --g-bg2:#504945; --g-bg3:#665c54; --g-fg:#ebdbb2; --g-fg2:#d5c4a1; --g-fg3:#bdae93; --g-fg4:#a89984; --g-gr:#928374;
  --g-ye:#fabd2f; --g-or:#fe8019; --g-aq:#8ec07c; --g-bl:#83a598; --g-pu:#d3869b; --g-gn:#b8bb26; --g-rd:#fb4934;
  position: fixed; z-index: 60; top: 22px; right: 14px; bottom: 14px; width: min(500px, calc(100vw - 28px)); display: flex; flex-direction: column;
  font: 500 12.5px/1.45 var(--mono); color: var(--g-fg2);
  background: rgba(29,32,33,.94); border: 1px solid rgba(235,219,178,.28); border-radius: 10px; backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 30px 80px rgba(0,0,0,.6); transform: translateX(calc(100% + 30px)); transition: transform .55s var(--spring); }
#drawer.open { transform: none; }
#drawer .dw-title { position: absolute; top: -9px; left: 16px; right: 56px; display: flex; gap: 6px; align-items: center; pointer-events: none; z-index: 2; }
#drawer .dw-title b { background: var(--g-ye); color: #1d2021; font-weight: 800; font-size: 11px; padding: 0 7px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#drawer .dw-title i { font-style: normal; background: var(--g-bg); color: var(--g-gr); font-size: 11px; padding: 0 6px; border-radius: 3px; white-space: nowrap; }
.dw-h { padding: 18px 18px 12px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid #32302f; }
.dw-h .cap.mono { color: var(--g-gr); display: flex; gap: 6px; align-items: center; font-size: 11.5px; }
.dw-h .cap svg.i { width: 13px; height: 13px; color: var(--g-ye); }
.dw-h h2 { margin: 4px 0 0; font: 800 15px/1.35 var(--mono); color: var(--g-or); letter-spacing: 0; }
.dw-h h2::before { content: "# "; color: #5f5752; font-weight: 600; }
.dw-h .x { margin-left: auto; width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; color: var(--g-gr); flex: none; border: 1px solid #3c3836; }
.dw-h .x:hover { color: var(--g-rd); border-color: var(--g-rd); }
.dw-h .x svg.i { width: 14px; height: 14px; }
.dw-b { flex: 1; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 16px; }
.dw-lbl { font: 600 11.5px var(--mono); color: var(--g-ye); margin-bottom: 8px; display: flex; justify-content: space-between; }
.dw-lbl span:first-child::before { content: "## "; color: #5f5752; }
.dw-lbl span:last-child { color: var(--g-gr); font-weight: 500; font-style: italic; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kpis div { padding: 4px 10px 5px; border-left: 2px solid var(--c, var(--g-bl)); background: linear-gradient(90deg, color-mix(in srgb, var(--c, #83a598) 10%, transparent), transparent); border-radius: 0 5px 5px 0; }
.kpis div:nth-child(1) { --c: #83a598; } .kpis div:nth-child(2) { --c: #d3869b; } .kpis div:nth-child(3) { --c: #8ec07c; } .kpis div:nth-child(4) { --c: #fabd2f; }
.kpis .cap { color: var(--g-fg4); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
.kpis b { display: block; font: 800 17px var(--mono); color: var(--c); }
.dw-graph { position: relative; height: 210px; border-radius: 6px; background: #191b1c; border: 1px solid #32302f; overflow: hidden; }
.dw-graph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gnode { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 96px; text-align: center; }
.gnode .orb { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #282828; border: 2px solid var(--g-pu); color: var(--g-pu); transition: transform .4s var(--spring), border-color .2s; }
.gnode .orb svg.i { width: 18px; height: 18px; }
.gnode:hover .orb, .gnode.on .orb { transform: scale(1.12); border-color: var(--g-ye); color: var(--g-ye); box-shadow: 0 0 18px rgba(250,189,47,.35); }
.gnode.main .orb { width: 48px; height: 48px; background: radial-gradient(circle at 30% 30%, #fabd2f, #fe8019); border-color: #fabd2f; color: #1d2021; box-shadow: 0 0 24px rgba(250,189,47,.3); }
.gnode b { font-size: 11px; white-space: nowrap; color: var(--g-fg); } .gnode small { font-size: 10px; color: var(--g-gr); line-height: 1.2; max-width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.agentbox { background: #191b1c; border: 1px solid var(--g-pu); border-radius: 6px; padding: 10px 12px; font-size: 12px; display: grid; gap: 6px; }
.agentbox > .row b { color: var(--g-pu); }
.agentbox .cap { color: var(--g-ye); font-size: 11.5px; }
.agentbox .txt { color: var(--g-fg3); white-space: pre-wrap; max-height: 150px; overflow: auto; border-left: 2px solid #3c3836; padding-left: 10px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font: 600 10.5px var(--mono); padding: 1px 7px; border-radius: 3px; background: #32302f; color: var(--g-fg4); }
#drawer .cap { color: var(--g-gr); }
/* Step path: connected points you can open and continue from */
.path { position: relative; display: flex; flex-direction: column; }
.path::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; background: linear-gradient(#fabd2f, #8ec07c); opacity: .45; transform-origin: top; animation: grow 1s var(--spring-soft) both; }
@keyframes grow { from { transform: scaleY(0); } }
.step { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 6px 0; text-align: left; width: 100%; border-radius: 5px; }
.step:hover { background: rgba(235,219,178,.03); }
.step .pt { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 10.5px var(--mono); background: #1d2021; border: 2px solid #665c54; color: var(--g-fg4); z-index: 1; transition: transform .35s var(--spring), background .2s; }
.step .pt svg.i { width: 13px; height: 13px; color: var(--g-pu); }
.step:hover .pt { transform: scale(1.1); border-color: var(--g-ye); }
.step.now .pt { background: var(--g-aq); color: #1d2021; border-color: #b8e08e; box-shadow: 0 0 12px rgba(142,192,124,.5); }
.step.open .pt { background: var(--g-ye); color: #1d2021; border-color: #ffd977; }
.step .tx { font-size: 12.5px; padding-top: 5px; color: var(--g-fg2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.step.open .tx { -webkit-line-clamp: unset; display: block; color: var(--g-fg); }
.step .cap.mono { font-size: 10.5px; }
.stepx { margin: 2px 0 8px 38px; display: grid; gap: 8px; animation: in .5s var(--spring) both; }
.stepx > .cap { color: var(--g-aq) !important; font-size: 11.5px; }
.bubble { border-left: 2px solid var(--g-aq); padding: 2px 0 2px 11px; font-size: 12px; color: var(--g-fg3); white-space: pre-wrap; max-height: 220px; overflow: auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; border-radius: 6px; font: 800 12.5px var(--mono); transition: transform .3s var(--spring), filter .2s; }
.btn svg.i { width: 14px; height: 14px; }
.btn:active { transform: scale(.96); }
.btn.pri { background: linear-gradient(135deg, #fabd2f, #f5a623); color: #1d2021; box-shadow: 0 6px 24px rgba(250,189,47,.18); }
.btn.pri svg.i { fill: #1d2021; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sec { background: #32302f; color: var(--g-fg2); border: 1px solid #504945; }
.dw-f { padding: 10px 14px; border-top: 1px solid #32302f; display: flex; gap: 8px; }
.dw-f .btn { flex: 1; }
#drawer .scroll { scrollbar-color: #504945 transparent; }
#drawer .mp { font-size: 10px; padding: 1px 7px; }

/* ---------- toast (fallback when the look has no notify) ---------- */
.toast { position: fixed; z-index: 120; right: 16px; top: 44px; transform: translateX(30px); opacity: 0; transition: .45s var(--spring); background: rgba(29,32,33,.94); color: #d5c4a1;
  padding: 9px 14px; border-radius: 6px 9px 9px 6px; border: 1px solid rgba(235,219,178,.2); border-left: 3px solid #8ec07c; font: 600 12px var(--mono); box-shadow: 0 20px 50px rgba(0,0,0,.5); max-width: 360px; }
.toast.show { transform: none; opacity: 1; }
.toast code { display: block; font: 11px var(--mono); color: #a89984; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<style id="lookcss"></style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4.5" y="8" width="15" height="11" rx="3.5"/><path d="M12 5v3M9.5 13v1M14.5 13v1M2.5 13v2M21.5 13v2"/><circle cx="12" cy="4" r="1.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-l" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
  <symbol id="i-r" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="5.5" r="2"/><circle cx="7" cy="18.5" r="2"/><circle cx="17" cy="8.5" r="2"/><path d="M7 7.5v9M17 10.5c0 4-10 2.5-10 6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4L8.5 19.5H4.5v-4z"/><path d="m12.5 7.5 4 4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M7 3.5h7l4.5 4.5v11a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M13.5 3.5V8.5h5M9 13h6M9 16.5h4"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3.5v4M15 3.5v4M6.5 7.5h11v3a5.5 5.5 0 0 1-11 0zM12 16v4.5"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m7.5 9.5 3 2.5-3 2.5M12.5 15h4"/></symbol>
</svg>
<div id="stage"></div>
<aside id="drawer" aria-live="polite"></aside>

<script>
// ================= Shared data model =================
let RAW = window.SESSION_DATA || { sessions: [], home: "", generatedAt: new Date().toISOString() };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const short = (p) => (p || "?").replace(RAW.home, "~");
const projName = (p) => { const s = short(p); return s === "~" ? "Home" : s.split("/").filter(Boolean).pop(); };
const rel = (ts) => { const d = (Date.now() - new Date(ts)) / 1000; if (d < 3600) return `vor ${Math.max(1, Math.round(d / 60))} Min.`; if (d < 86400) return `vor ${Math.round(d / 3600)} Std.`; if (d < 172800) return "gestern"; return `vor ${Math.round(d / 86400)} Tagen`; };
const relShort = (ts) => { const d = (Date.now() - new Date(ts)) / 1000; if (d < 3600) return `${Math.max(1, Math.round(d / 60))}m`; if (d < 86400) return `${Math.round(d / 3600)}h`; return `${Math.round(d / 86400)}d`; };
const hhmm = (ts) => new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const day = (ts) => new Date(ts).toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short" });
function modelInfo(m) {
  if (!m) return { fam: "x", name: "?" };
  const k = m.match(/opus|sonnet|haiku|fable/i), v = m.match(/-(\d+)-(\d+)(?:-\d{8})?$/);
  if (!k) return { fam: "x", name: m.replace(/^claude-/, "") };
  const fam = k[0].toLowerCase(); return { fam, name: fam[0].toUpperCase() + fam.slice(1) + (v ? ` ${v[1]}.${v[2]}` : "") };
}
const mp = (m) => { const x = modelInfo(m); return `<span class="mp ${x.fam}">${esc(x.name)}</span>`; };
const NAMES = { "general-purpose": "Allrounder", Explore: "Sucher", Plan: "Planer", "claude-code-guide": "Claude-Code-Hilfe", fork: "Abzweig" };
const aName = (t) => { const n = t.includes(":") ? t.split(":")[1] : t; return NAMES[n] || n.replace(/^impeccable-/, "").replace(/[-_]/g, " ").replace(/^./, (c) => c.toUpperCase()); };
const fmtTok = (n) => n < 1000 ? `${n}` : n < 1e6 ? `${Math.round(n / 1000)}k` : `${(n / 1e6).toFixed(1)}M`;
const fmtDur = (ms) => { const s = ms / 1000; return s < 60 ? `${Math.round(s)}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.floor(s / 3600)}h ${Math.round((s % 3600) / 60)}m`; };
const usd = (u) => u == null ? "-" : `$${u.toFixed(2)}`;
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return [262, 174, 38, 330, 200, 140, 18, 290, 52, 222, 350, 100][h % 12]; }
const initials = (label) => { const w = label.replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter((x) => x.length > 1); return ((w[0]?.[0] || "?") + (w[1]?.[0] || "")).toUpperCase(); };
const fresh = () => Date.now() - Date.parse(RAW.generatedAt) < 90e3;

// Build the view model; called again with fresh data in the desktop app (arrays are refilled in place)
const sessions = [], projects = [];
const DATA = { sessions, projects, generatedAt: "", home: "", totals: {} };
function buildData(raw) {
  RAW = raw;
  const list = raw.sessions.map((s) => {
    const nodes = s.nodes.slice().sort((a, b) => a.ts.localeCompare(b.ts));
    const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
    const last = nodes[nodes.length - 1]; const path = []; for (let c = last; c; c = byId[c.parent]) path.unshift(c);
    const label = s.title || s.aiTitle || nodes[0]?.text.slice(0, 60) || "Session";
    const project = s.cwd || s.dir;
    return { ...s, nodes, byId, last, path, onPath: new Set(path.map((n) => n.id)), label, project, projName: projName(project),
      agents: s.agents || [], modelList: Object.keys(s.models || {}), live: fresh() && Date.parse(raw.generatedAt) - (s.fileMtime || 0) < 180e3,
      hue: hue(project), initials: initials(label), about: (path[0]?.text || "").replace(/\s+/g, " ").slice(0, 180) };
  }).sort((a, b) => b.end.localeCompare(a.end));
  sessions.splice(0, sessions.length, ...list);
  const projMap = new Map();
  for (const s of sessions) { if (!projMap.has(s.project)) projMap.set(s.project, { path: s.project, name: s.projName, hue: s.hue, sessions: [] }); projMap.get(s.project).sessions.push(s); }
  projects.splice(0, projects.length, ...[...projMap.values()].map((p) => ({ ...p, last: p.sessions[0].end, steps: p.sessions.reduce((n, s) => n + s.nodes.length, 0), agents: p.sessions.reduce((n, s) => n + s.agents.length, 0) })));
  Object.assign(DATA, { generatedAt: raw.generatedAt, home: raw.home,
    totals: { sessions: sessions.length, steps: sessions.reduce((n, s) => n + s.nodes.length, 0), agents: sessions.reduce((n, s) => n + s.agents.length, 0), cost: sessions.reduce((n, s) => n + (s.cost?.usd || 0), 0) } });
}
buildData(RAW);

// ================= Actions =================
let toastT;
function toast(msg, sub) { if (window.Atlas?.notifier) return window.Atlas.notifier(msg, sub); const t = document.getElementById("toast"); t.innerHTML = `${esc(msg)}${sub ? `<code>${esc(sub)}</code>` : ""}`; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
const cmdFor = (s, fork) => `cd '${short(s.cwd || s.project)}' && claude --resume ${s.id}${fork ? " --fork-session" : ""}`;
async function resume(s, fork) { if (window.AtlasTerminal) return window.AtlasTerminal.open(s, fork); const c = cmdFor(s, fork); try { await navigator.clipboard.writeText(c); toast(fork ? "Neuer Weg ab hier: Befehl kopiert" : "Weitermachen: Befehl kopiert", c); } catch { toast("Befehl:", c); } }

// ================= Shared drawer: session -> agents -> steps =================
const dw = { s: null, step: null, agent: null };
function openSession(id, stepId) { dw.s = sessions.find((s) => s.id === id); dw.step = stepId || null; dw.agent = null; renderDrawer(); document.getElementById("drawer").classList.add("open"); LOOK?.onSelect?.(id); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); dw.s = null; LOOK?.onSelect?.(null); }
function renderDrawer() {
  const s = dw.s; if (!s) return;
  const n = s.agents.length, W = 460, H = n > 3 ? 260 : 210, cx = W / 2, cy = 46;
  // More than 3 agents: stagger on two heights so labels do not collide
  const pos = s.agents.map((_, i) => { const t = n === 1 ? .5 : i / (n - 1); return { x: 50 + t * (W - 100), y: n > 3 ? (i % 2 ? 222 : 150) : 160 }; });
  const a = s.agents.find((x) => x.id === dw.agent);
  const stepNo = (id) => { const i = s.path.findIndex((n) => n.id === id); return i >= 0 ? i + 1 : null; };
  const steps = s.nodes.map((nd) => {
    const no = stepNo(nd.id), open = dw.step === nd.id, isNow = nd.id === s.last.id, ags = s.agents.filter((x) => x.node === nd.id);
    return `<button class="step ${isNow ? "now" : ""} ${open ? "open" : ""}" data-dstep="${nd.id}" id="st-${nd.id}"><span class="pt">${no ?? ic("branch")}</span>
      <span><span class="tx">${esc(nd.text)}</span><span class="row" style="margin-top:4px"><span class="cap mono">${day(nd.ts)} ${hhmm(nd.ts)}</span>${ags.length ? `<span class="tag">${ags.length} Agents</span>` : ""}${nd.edits.length ? `<span class="tag">${nd.edits.length} Dateien</span>` : ""}</span></span></button>
      ${open ? `<div class="stepx"><div class="cap">Claude hat geantwortet${(nd.models || []).length ? " mit " + nd.models.map((m) => modelInfo(m).name).join(", ") : ""}:</div>
        <div class="bubble">${esc(nd.reply || "Keine Textantwort in diesem Schritt.")}</div>
        ${nd.edits.length ? `<div class="row">${nd.edits.slice(0, 8).map((f) => `<span class="tag">${esc(f.split("/").pop())}</span>`).join("")}</div>` : ""}
        <div class="row"><button class="btn pri" data-resume="${isNow ? "" : "fork"}">${ic("play")} ${isNow ? "Hier weitermachen" : "Ab hier weitermachen"}</button></div></div>` : ""}`;
  }).join("");
  document.getElementById("drawer").innerHTML = `
    <div class="dw-title"><b>${esc(s.projName)}/session.md</b><i>Esc schliesst</i></div>
    <div class="dw-h"><div style="min-width:0"><div class="cap mono">${ic("folder", "")} ${esc(s.projName)}${s.branch ? " / " + esc(s.branch) : ""}</div><h2>${esc(s.label)}</h2>
      <div class="row" style="margin-top:6px">${s.live ? `<span class="tag" style="color:#b8bb26">● läuft gerade</span>` : `<span class="tag">${rel(s.end)}</span>`}${s.modelList.map(mp).join("")}</div></div>
      <button class="x" data-close aria-label="Schliessen">${ic("x")}</button></div>
    <div class="dw-b scroll">
      <div class="kpis"><div><span class="cap">Schritte</span><b>${s.nodes.length}</b></div><div><span class="cap">Agents</span><b>${1 + n}</b></div><div><span class="cap">Kosten</span><b>${usd(s.cost?.usd)}</b></div><div><span class="cap">Dateien</span><b>${s.files.length}</b></div></div>
      <div><div class="dw-lbl"><span>Wer hat gearbeitet</span><span>${n ? "Agent anklicken" : "nur Claude"}</span></div>
        <div class="dw-graph" style="height:${H}px"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="gd" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fabd2f"/><stop offset="1" stop-color="#d3869b"/></linearGradient></defs>
          ${pos.map((p, i) => `<path class="draw" style="--i:${i};--len:400" id="dth${i}" d="M${cx},${cy} C${cx},${cy + 60} ${p.x},${p.y - 70} ${p.x},${p.y - 20}" fill="none" stroke="url(#gd)" stroke-width="2"/>
            <circle r="3" fill="#fff1c4"><animateMotion dur="${2 + i * .25}s" repeatCount="indefinite" begin="${1 + i * .15}s"><mpath href="#dth${i}"/></animateMotion></circle>`).join("")}</svg>
          <div class="gnode main in" style="left:50%;top:${cy / H * 100}%"><span class="orb">${ic("bot")}</span><b>${esc(s.agentName || "Claude")}</b></div>
          ${s.agents.map((x, i) => `<button class="gnode in ${x.id === dw.agent ? "on" : ""}" style="--i:${i + 3};left:${pos[i].x / W * 100}%;top:${pos[i].y / H * 100}%" data-dagent="${x.id}"><span class="orb">${ic("bot")}</span><b>${esc(aName(x.type))}</b><small>${esc(x.description || "")}</small></button>`).join("")}
          ${n ? "" : `<div class="cap" style="position:absolute;left:0;right:0;bottom:30px;text-align:center">Claude hat hier allein gearbeitet.</div>`}
        </div></div>
      ${a ? `<div class="agentbox"><div class="row"><b>${esc(aName(a.type))}</b>${Object.keys(a.models).map(mp).join("")}<span class="tag">${fmtDur(Date.parse(a.end) - Date.parse(a.start))}</span><span class="tag">${fmtTok(a.tokens)} Tokens</span>${stepNo(a.node) ? `<button class="tag" data-dstep="${a.node}">bei Schritt ${stepNo(a.node)}</button>` : ""}</div>
        ${a.task ? `<div class="cap">Auftrag</div><div class="txt">${esc(a.task)}</div>` : ""}${a.result ? `<div class="cap">Ergebnis</div><div class="txt">${esc(a.result)}</div>` : ""}</div>` : ""}
      <div><div class="dw-lbl"><span>Verlauf</span><span>Punkt anklicken</span></div><div class="path">${steps}</div></div>
    </div>
    <div class="dw-f"><button class="btn pri" data-resume>${ic("play")} Am letzten Stand weitermachen</button></div>`;
  if (dw.step) document.getElementById("st-" + dw.step)?.scrollIntoView({ block: "center", behavior: "smooth" });
}

// ================= Look registry =================
const LOOKS = []; let LOOK = null, cleanup = [];
const dataListeners = new Set();
window.Atlas = { DATA, esc, ic, short, projName, rel, relShort, hhmm, day, modelInfo, mp, aName, fmtTok, fmtDur, usd, hue, initials, fresh,
  open: openSession, close: closeDrawer, resume, toast, register: (l) => LOOKS.push(l), onCleanup: (fn) => cleanup.push(fn),
  notifier: null, // a look may set this to show toasts in its own style
  // A look that refreshes itself in place registers here; returns an unsubscribe function
  onDataChanged(cb) { dataListeners.add(cb); return () => dataListeners.delete(cb); },
  handlesLiveData: () => dataListeners.size > 0,
  // Desktop app: quiet = refresh the open drawer and let listening looks update in place; otherwise re-mount the look
  applyData(raw, { quiet } = {}) {
    buildData(raw);
    if (dw.s) { const id = dw.s.id; dw.s = sessions.find((x) => x.id === id) || dw.s; renderDrawer(); }
    if (quiet) { for (const cb of dataListeners) { try { cb(DATA); } catch (e) { console.error(e); } } }
    else { const open = dw.s?.id; mount(LOOK.key); if (open) openSession(open); }
  } };
function mount(key) {
  cleanup.forEach((fn) => { try { fn(); } catch {} }); cleanup = [];
  LOOK = LOOKS.find((l) => l.key === key) || LOOKS[0];
  const u = new URL(location); u.searchParams.set("look", LOOK.key); history.replaceState(null, "", u);
  document.getElementById("lookcss").textContent = LOOK.css || "";
  const st = document.getElementById("stage"); st.className = "lk-" + LOOK.key; st.innerHTML = "";
  closeDrawer();
  if (!sessions.length) { st.innerHTML = `<p style="padding:40px">Keine Daten. Erst <code>node scripts/extract.mjs</code> laufen lassen.</p>`; return; }
  try { LOOK.render(st, window.Atlas); } catch (e) { st.innerHTML = `<pre style="padding:40px;color:var(--rose)">${esc(e.stack)}</pre>`; console.error(e); }
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-close],[data-dstep],[data-dagent],[data-resume],[data-open]");
  if (!el) return;
  const d = el.dataset;
  if (d.close !== undefined) return closeDrawer();
  if (d.dstep) { dw.step = dw.step === d.dstep ? null : d.dstep; return renderDrawer(); }
  if (d.dagent) { dw.agent = dw.agent === d.dagent ? null : d.dagent; return renderDrawer(); }
  if (d.resume !== undefined && dw.s) return resume(dw.s, d.resume === "fork");
  if (d.open) return openSession(d.open, d.openStep);
});
document.addEventListener("keydown", (e) => {
  // The notes editor (CodeMirror + vim) needs Escape itself, so only plain inputs lose focus here
  if (e.target.matches("input,textarea,[contenteditable]")) { if (e.key === "Escape" && !e.target.closest(".cm-editor")) e.target.blur(); return; }
  if (e.key === "Escape") return closeDrawer();
});
</script>
<script src="editor.bundle.js"></script>
<script src="nvim.js"></script>
<script>
const want = new URLSearchParams(location.search).get("look");
mount(want || LOOKS[0]?.key);
// Desktop app only: load xterm and the terminal dock (the browser prototype keeps copy-to-clipboard)
if (window.atlasApp) {
  const add = (tag, attrs) => new Promise((ok) => { const el = Object.assign(document.createElement(tag), attrs); el.onload = ok; document.head.appendChild(el); });
  add("link", { rel: "stylesheet", href: "../node_modules/@xterm/xterm/css/xterm.css" });
  add("script", { src: "../node_modules/@xterm/xterm/lib/xterm.js" })
    .then(() => add("script", { src: "../node_modules/@xterm/addon-fit/lib/addon-fit.js" }))
    .then(() => add("script", { src: "terminal.js" }));
}
</script>
</body>
</html>
