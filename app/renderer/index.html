<!doctype html>
<!--
  Session Atlas desktop app UI. Shared here: data model, helpers, spring motion and the
  session/step drawer; the Neovim interface lives in nvim.js, the terminal dock in terminal.js.
  Data comes from the Electron main process (preload exposes window.SESSION_DATA and window.atlasApp).
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c11; --ink: #ece9f5; --ink-2: #a9a5ba; --ink-3: #6f6b82;
  --glass: rgba(255,255,255,.055); --glass-2: rgba(255,255,255,.1); --line: rgba(255,255,255,.12);
  --violet: #8b6cff; --teal: #2dd4bf; --amber: #e07a4f; --rose: #fb7185; --green: #4ade80; --cyan: #22d3ee;
  --sans: "Figtree", -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; --display: "Orbitron", var(--sans);
  /* Spring easings in the spirit of Framer Motion */
  --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
  --spring-soft: linear(0, 0.06, 0.22 8%, 0.62 20%, 0.86 30%, 0.98 40%, 1.03 50%, 1.02 62%, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 14px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); }
.cap { color: var(--ink-2); font-size: 12.5px; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
  backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
  box-shadow: 0 1px 0 rgba(255,255,255,.07) inset, 0 18px 44px rgba(0,0,0,.4); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; flex: none; }
.dot.live { background: var(--green); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.mp { display: inline-flex; align-items: center; gap: 5px; font: 700 11px var(--mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--mc) 20%, transparent); color: color-mix(in srgb, var(--mc) 55%, white); border: 1px solid color-mix(in srgb, var(--mc) 40%, transparent); }
.opus { --mc: #8b6cff; } .sonnet { --mc: #3b82f6; } .haiku { --mc: #22c55e; } .fable { --mc: #f97316; } .x { --mc: #8a8799; }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
/* Shared entrance helpers looks may use: add class "in" and --i for stagger */
.in { animation: in .7s var(--spring) both; animation-delay: calc(var(--i, 0) * 35ms); }
@keyframes in { from { opacity: 0; transform: translateY(14px) scale(.96); } }
.fadein { animation: fadein .6s ease both; animation-delay: calc(var(--i, 0) * 30ms); }
@keyframes fadein { from { opacity: 0; } }
.draw { stroke-dasharray: var(--len, 1200); stroke-dashoffset: var(--len, 1200); animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; animation-delay: calc(var(--i, 0) * 40ms + 150ms); }
@keyframes draw { to { stroke-dashoffset: 0; } }

#stage { position: fixed; inset: 0; }

/* ---------- Shared drawer: a Neovim floating window (gruvbox, title in the border) ---------- */
#drawer { --g-bg:#141617; --g-bg1:#2a2d2f; --g-bg2:#3a3e41; --g-bg3:#4f5458; --g-fg:#ebdbb2; --g-fg2:#d5c4a1; --g-fg3:#bdae93; --g-fg4:#a89984; --g-gr:#928374;
  --g-ye:#e07a4f; --g-or:#f0a070; --g-aq:#8ec07c; --g-bl:#83a598; --g-pu:#d3869b; --g-gn:#b8bb26; --g-rd:#fb4934;
  position: fixed; z-index: 60; top: 22px; right: 14px; bottom: 14px; width: min(500px, calc(100vw - 28px)); display: flex; flex-direction: column;
  font: 500 12.5px/1.45 var(--mono); color: var(--g-fg2);
  background: rgba(15,16,17,.96); border: 1px solid rgba(235,219,178,.28); border-radius: 10px; backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 30px 80px rgba(0,0,0,.6); transform: translateX(calc(100% + 30px)); transition: transform .55s var(--spring); }
#drawer.open { transform: none; }
#drawer .dw-title { position: absolute; top: -9px; left: 16px; right: 56px; display: flex; gap: 6px; align-items: center; pointer-events: none; z-index: 2; }
#drawer .dw-title b { background: var(--g-ye); color: #141617; font-weight: 800; font-size: 11px; padding: 0 7px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#drawer .dw-title i { font-style: normal; background: var(--g-bg); color: var(--g-gr); font-size: 11px; padding: 0 6px; border-radius: 3px; white-space: nowrap; }
.dw-h { padding: 18px 18px 12px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid #1f2223; }
.dw-h .cap.mono { color: var(--g-gr); display: flex; gap: 6px; align-items: center; font-size: 11.5px; }
.dw-h .cap svg.i { width: 13px; height: 13px; color: var(--g-ye); }
.dw-h h2 { margin: 4px 0 0; font: 800 15px/1.35 var(--mono); color: var(--g-or); letter-spacing: 0; }
.dw-h h2::before { content: "# "; color: #4a4f52; font-weight: 600; }
.dw-h .x { margin-left: auto; width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; color: var(--g-gr); flex: none; border: 1px solid #2a2d2f; }
.dw-h .x:hover { color: var(--g-rd); border-color: var(--g-rd); }
.dw-h .x svg.i { width: 14px; height: 14px; }
.dw-b { flex: 1; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 16px; }
.dw-lbl { font: 600 11.5px var(--mono); color: var(--g-ye); margin-bottom: 8px; display: flex; justify-content: space-between; }
.dw-lbl span:first-child::before { content: "## "; color: #4a4f52; }
.dw-lbl span:last-child { color: var(--g-gr); font-weight: 500; font-style: italic; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font: 600 10.5px var(--mono); padding: 1px 7px; border-radius: 3px; background: #1f2223; color: var(--g-fg4); }
#drawer .cap { color: var(--g-gr); }
/* Step path: connected points you can open and continue from */
@keyframes grow { from { transform: scaleY(0); } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; border-radius: 6px; font: 800 12.5px var(--mono); transition: transform .3s var(--spring), filter .2s; }
.btn svg.i { width: 14px; height: 14px; }
.btn:active { transform: scale(.96); }
.btn.pri { background: #e07a4f; color: #141617; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.btn.pri svg.i { fill: #141617; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sec { background: #1f2223; color: var(--g-fg2); border: 1px solid #3a3e41; }
.dw-f { padding: 10px 14px; border-top: 1px solid #1f2223; display: flex; gap: 8px; }
.dw-f .btn { flex: 1; }
#drawer .scroll { scrollbar-color: #3a3e41 transparent; }
/* Session panel: open sessions as tabs (gt / gT), the session as a compact graph like git log --graph */
#drawer { width: min(470px, calc(100vw - 28px)); }
.dw-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid #2a2d2f; background: #0f1011; border-radius: 10px 10px 0 0; overflow: hidden; }
.dw-tabs button { display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 6px 6px 0 0; color: var(--g-gr); font: 600 11px var(--mono); white-space: nowrap; min-width: 0; max-width: 150px; }
.dw-tabs button span:last-child { overflow: hidden; text-overflow: ellipsis; }
.dw-tabs button b { color: var(--g-fg4); font-size: 10px; }
.dw-tabs button.on { background: var(--g-bg); color: var(--g-fg); box-shadow: inset 0 2px 0 #e07a4f; }
.dw-tabs button.on b { color: #e07a4f; }
.dw-tabs .sp { flex: 1; }
.dw-tabs .x { color: var(--g-gr); padding: 4px 8px; }
.dw-tabs .x:hover { color: var(--g-rd); }
.sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--c, #4f5458); }
.sdot.run { --c: #a9b665; } .sdot.wait { --c: #e0a84f; } .sdot.err { --c: #ea6962; }
.dw-h2 { padding: 11px 16px 9px; border-bottom: 1px solid #2a2d2f; }
.dw-h2 .t { color: #e07a4f; font: 800 13.5px/1.35 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dw-h2 .m { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--g-gr); font-size: 11px; margin-top: 3px; }
.dw-h2 .m b { color: var(--g-fg2); }
.dw-log { flex: 1; overflow: auto; padding: 6px 0; scrollbar-width: thin; scrollbar-color: #3a3e41 transparent; }
.lg-r { display: grid; grid-template-columns: 50px minmax(0, 1fr) 42px; align-items: center; min-height: 26px; padding-right: 14px; color: var(--g-fg4); text-align: left; width: 100%; font: 500 12px var(--mono); }
.lg-r svg { width: 50px; height: 26px; display: block; }
.lg-r .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--g-fg3); }
.lg-r .x i { font-style: normal; color: var(--g-gr); font-weight: 700; margin-right: 8px; }
.lg-r .tm { color: var(--g-gr); font-size: 10.5px; text-align: right; }
.lg-r.ag .x { color: var(--g-pu); font-size: 11.5px; }
.lg-r.br .x { color: var(--g-bl); }
.lg-r:hover { background: rgba(235,219,178,.03); }
.lg-r.on { background: #1f2223; }
.lg-r.on .x { color: var(--g-fg); }
.lg-r.ag.on .x { color: var(--g-pu); }
.dw-pv { border-top: 1px solid #2a2d2f; padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 6px; max-height: 34%; overflow: auto; }
.dw-pv .q { color: var(--g-fg); font-weight: 700; font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.dw-pv .a { color: var(--g-fg4); font-size: 11.5px; white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
.dw-pv .row { gap: 5px; }
.dw-keys { display: flex; gap: 10px; flex-wrap: wrap; color: var(--g-gr); font-size: 10.5px; padding: 0 14px 10px; }
.dw-keys kbd { font: 700 10px var(--mono); color: var(--g-fg3); background: rgba(235,219,178,.07); border: 1px solid rgba(235,219,178,.16); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.btn.fork { background: #7daea3; color: #141617; }
#drawer .mp { font-size: 10px; padding: 1px 7px; }

/* ---------- toast (fallback when the look has no notify) ---------- */
.toast { position: fixed; z-index: 120; right: 16px; top: 44px; transform: translateX(30px); opacity: 0; transition: .45s var(--spring); background: rgba(20,22,23,.94); color: #d5c4a1;
  padding: 9px 14px; border-radius: 6px 9px 9px 6px; border: 1px solid rgba(235,219,178,.2); border-left: 3px solid #8ec07c; font: 600 12px var(--mono); box-shadow: 0 20px 50px rgba(0,0,0,.5); max-width: 360px; }
.toast.show { transform: none; opacity: 1; }
.toast code { display: block; font: 11px var(--mono); color: #a89984; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<style id="lookcss"></style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4.5" y="8" width="15" height="11" rx="3.5"/><path d="M12 5v3M9.5 13v1M14.5 13v1M2.5 13v2M21.5 13v2"/><circle cx="12" cy="4" r="1.2"/></symbol>

<script>
// ================= Shared data model =================
let RAW = window.SESSION_DATA || { sessions: [], home: "", generatedAt: new Date().toISOString() };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const short = (p) => (p || "?").replace(RAW.home, "~");
const projName = (p) => { const s = short(p); return s === "~" ? "Home" : s.split("/").filter(Boolean).pop(); };
const rel = (ts) => { const d = (Date.now() - new Date(ts)) / 1000; if (d < 3600) return `vor ${Math.max(1, Math.round(d / 60))} Min.`; if (d < 86400) return `vor ${Math.round(d / 3600)} Std.`; if (d < 172800) return "gestern"; return `vor ${Math.round(d / 86400)} Tagen`; };
const relShort = (ts) => { const d = (Date.now() - new Date(ts)) / 1000; if (d < 3600) return `${Math.max(1, Math.round(d / 60))}m`; if (d < 86400) return `${Math.round(d / 3600)}h`; return `${Math.round(d / 86400)}d`; };
const hhmm = (ts) => new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const day = (ts) => new Date(ts).toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short" });
function modelInfo(m) {
  if (!m) return { fam: "x", name: "?" };
  const k = m.match(/opus|sonnet|haiku|fable/i), v = m.match(/-(\d+)-(\d+)(?:-\d{8})?$/);
  if (!k) return { fam: "x", name: m.replace(/^claude-/, "") };
  const fam = k[0].toLowerCase(); return { fam, name: fam[0].toUpperCase() + fam.slice(1) + (v ? ` ${v[1]}.${v[2]}` : "") };
}
const mp = (m) => { const x = modelInfo(m); return `<span class="mp ${x.fam}">${esc(x.name)}</span>`; };
const NAMES = { "general-purpose": "Allrounder", Explore: "Sucher", Plan: "Planer", "claude-code-guide": "Claude-Code-Hilfe", fork: "Abzweig" };
const aName = (t) => { const n = t.includes(":") ? t.split(":")[1] : t; return NAMES[n] || n.replace(/^impeccable-/, "").replace(/[-_]/g, " ").replace(/^./, (c) => c.toUpperCase()); };
const fmtTok = (n) => n < 1000 ? `${n}` : n < 1e6 ? `${Math.round(n / 1000)}k` : `${(n / 1e6).toFixed(1)}M`;
const fmtDur = (ms) => { const s = ms / 1000; return s < 60 ? `${Math.round(s)}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.floor(s / 3600)}h ${Math.round((s % 3600) / 60)}m`; };
const usd = (u) => u == null ? "-" : `$${u.toFixed(2)}`;
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return [262, 174, 38, 330, 200, 140, 18, 290, 52, 222, 350, 100][h % 12]; }
const initials = (label) => { const w = label.replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter((x) => x.length > 1); return ((w[0]?.[0] || "?") + (w[1]?.[0] || "")).toUpperCase(); };
const fresh = () => Date.now() - Date.parse(RAW.generatedAt) < 90e3;

// Live state of a session, read from how its transcript ended and how long ago it was written:
// run = Claude is working, wait = Claude finished its turn (or waits for a permission) and needs you,
// err = the last tool failed, done = nothing happened for a while.
function agentState(s, now = Date.now()) {
  const a = s.activity || {}, age = now - (s.fileMtime || Date.parse(s.end));
  const lastT = a.recent?.[a.recent.length - 1];
  if (age < 90e3 && ["tool", "result", "prompt"].includes(a.last)) return { st: "run", why: "arbeitet" };
  if (a.openAgents && age < 5 * 60e3) return { st: "run", why: "Agent arbeitet" };
  if (age < 30 * 60e3) {
    if (a.last === "tool") return { st: "wait", why: "wartet auf Freigabe" };
    if (lastT?.err) return { st: "err", why: `Fehler: ${lastT.result || lastT.tool}` };
    return { st: "wait", why: "fertig, wartet auf dich" };
  }
  if (window.AtlasTerminal?.hasSession?.(s.id)) return { st: "wait", why: "im Terminal offen" };
  return { st: "done", why: "fertig" };
}
// The question Claude asked at the end of its last reply, if any
function askOf(s) {
  const t = (s.last?.reply || "").replace(/\s+/g, " ").trim(); if (!t.includes("?")) return null;
  const parts = t.split(/(?<=[.!?])\s+/); const q = [...parts].reverse().find((p) => p.endsWith("?"));
  return q && q.length < 240 ? q : null;
}
// Send a prompt: into the session's open terminal tab, by resuming it, or as a fresh claude in a folder
function sendPrompt({ session, cwd, text, label } = {}) {
  text = String(text || "").trim(); if (!text) return false;
  if (text.length > 8000) { toast("Prompt zu lang", "höchstens 8000 Zeichen"); return false; }
  const T = window.AtlasTerminal;
  if (!T) { navigator.clipboard?.writeText(text); toast("Prompt kopiert", "die Desktop-App schickt ihn direkt an Claude"); return false; }
  if (session && T.sendTo(session.id, text)) { toast(`An „${session.label}“ gesendet`); return true; }
  if (session) { T.open(session, false, { after: text }); return true; }
  T.open(null, false, { cwd, prompt: text, label: label || text.slice(0, 40) });
  return true;
}

// Build the view model; called again with fresh data in the desktop app (arrays are refilled in place)
const sessions = [], projects = [];
const DATA = { sessions, projects, generatedAt: "", home: "", totals: {} };
function buildData(raw) {
  RAW = raw;
  const list = raw.sessions.map((s) => {
    const nodes = s.nodes.slice().sort((a, b) => a.ts.localeCompare(b.ts));
    const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
    const last = nodes[nodes.length - 1]; const path = []; for (let c = last; c; c = byId[c.parent]) path.unshift(c);
    const label = s.title || s.aiTitle || nodes[0]?.text.slice(0, 60) || "Session";
    const project = s.cwd || s.dir;
    return { ...s, nodes, byId, last, path, onPath: new Set(path.map((n) => n.id)), label, project, projName: projName(project),
      agents: s.agents || [], modelList: Object.keys(s.models || {}), live: fresh() && Date.parse(raw.generatedAt) - (s.fileMtime || 0) < 180e3,
      hue: hue(project), initials: initials(label), about: (path[0]?.text || "").replace(/\s+/g, " ").slice(0, 180) };
  }).sort((a, b) => b.end.localeCompare(a.end));
  sessions.splice(0, sessions.length, ...list);
  const projMap = new Map();
  for (const s of sessions) { if (!projMap.has(s.project)) projMap.set(s.project, { path: s.project, name: s.projName, hue: s.hue, sessions: [] }); projMap.get(s.project).sessions.push(s); }
  projects.splice(0, projects.length, ...[...projMap.values()].map((p) => ({ ...p, last: p.sessions[0].end, steps: p.sessions.reduce((n, s) => n + s.nodes.length, 0), agents: p.sessions.reduce((n, s) => n + s.agents.length, 0) })));
  Object.assign(DATA, { generatedAt: raw.generatedAt, home: raw.home,
    totals: { sessions: sessions.length, steps: sessions.reduce((n, s) => n + s.nodes.length, 0), agents: sessions.reduce((n, s) => n + s.agents.length, 0), cost: sessions.reduce((n, s) => n + (s.cost?.usd || 0), 0) } });
}
buildData(RAW);

// ================= Actions =================
let toastT;
function toast(msg, sub) { if (window.Atlas?.notifier) return window.Atlas.notifier(msg, sub); const t = document.getElementById("toast"); t.innerHTML = `${esc(msg)}${sub ? `<code>${esc(sub)}</code>` : ""}`; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
const cmdFor = (s, fork) => `cd '${short(s.cwd || s.project)}' && claude --resume ${s.id}${fork ? " --fork-session" : ""}`;
async function resume(s, fork) { if (window.AtlasTerminal) return window.AtlasTerminal.open(s, fork); const c = cmdFor(s, fork); try { await navigator.clipboard.writeText(c); toast(fork ? "Neuer Weg ab hier: Befehl kopiert" : "Weitermachen: Befehl kopiert", c); } catch { toast("Befehl:", c); } }

// ================= Session panel: open sessions as tabs, each one as a compact graph =================
// tabs: sessions opened in the panel (gt / gT), sel: selected row of the active one
const dw = { s: null, tabs: [], sel: 0, g: false };
function dwRows(s) {
  const rows = [], agentsAt = new Map();
  for (const a of s.agents) { if (!agentsAt.has(a.node)) agentsAt.set(a.node, []); agentsAt.get(a.node).push(a); }
  for (const n of s.nodes) {
    const no = s.path.findIndex((x) => x.id === n.id);
    rows.push({ k: no >= 0 ? "s" : "b", n, no: no + 1, last: n.id === s.last.id });
    for (const a of agentsAt.get(n.id) || []) rows.push({ k: "a", n, a });
  }
  return rows;
}
const dwLastRow = (rows) => Math.max(0, rows.findIndex((r) => r.last));
function openSession(id, stepId) {
  const s = sessions.find((x) => x.id === id); if (!s) return;
  if (!dw.tabs.includes(id)) { dw.tabs.push(id); if (dw.tabs.length > 6) dw.tabs.shift(); }
  dw.s = s; const rows = dwRows(s);
  const at = stepId ? rows.findIndex((r) => r.k !== "a" && r.n.id === stepId) : -1;
  dw.sel = at >= 0 ? at : dwLastRow(rows);
  renderDrawer(); document.getElementById("drawer").classList.add("open"); LOOK?.onSelect?.(id);
}
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); dw.s = null; LOOK?.onSelect?.(null); }
function dwSwitch(d) {
  if (!dw.s || dw.tabs.length < 2) return;
  const i = dw.tabs.indexOf(dw.s.id), id = dw.tabs[(i + d + dw.tabs.length) % dw.tabs.length];
  dw.s = sessions.find((x) => x.id === id) || dw.s; dw.sel = dwLastRow(dwRows(dw.s)); renderDrawer(); LOOK?.onSelect?.(dw.s.id);
}
function dwCloseTab() {
  if (!dw.s) return; const i = dw.tabs.indexOf(dw.s.id); dw.tabs.splice(i, 1);
  if (!dw.tabs.length) return closeDrawer();
  dw.s = sessions.find((x) => x.id === dw.tabs[Math.min(i, dw.tabs.length - 1)]); dw.sel = dwLastRow(dwRows(dw.s)); renderDrawer(); LOOK?.onSelect?.(dw.s.id);
}
// One line of the graph: main line on the left, branches (blue) and helpers (pink) as side branches
function dwGutter(r, on, isLast) {
  const line = `<line x1="14" y1="0" x2="14" y2="${isLast ? 13 : 26}" stroke="#3a3e41" stroke-width="2"/>`;
  if (r.k === "s") return `<svg viewBox="0 0 50 26">${line}<circle cx="14" cy="13" r="${on ? 6 : 4.5}" fill="${on ? "#e07a4f" : r.last ? "#141617" : "#5a5f63"}" stroke="${r.last ? "#e07a4f" : "none"}" stroke-width="2"/></svg>`;
  const col = r.k === "a" ? "#d3869b" : "#7daea3";
  return `<svg viewBox="0 0 50 26">${line}<path d="M14,2 C14,11 31,8 31,13" stroke="${col}" stroke-width="1.5" fill="none"${r.k === "a" ? ` stroke-dasharray="3 3"` : ""}/><circle cx="31" cy="13" r="4" fill="${on ? col : "#141617"}" stroke="${col}" stroke-width="1.5"/></svg>`;
}
const dwAction = (r) => !r || r.k === "a" ? null : r.last ? { fork: false, label: "Am letzten Stand weitermachen" } : { fork: true, label: r.k === "s" ? `Ab Schritt ${r.no} abzweigen` : "Ab diesem Zweig weitermachen" };
function renderDrawer() {
  const s = dw.s; if (!s) return;
  const rows = dwRows(s); dw.sel = Math.max(0, Math.min(rows.length - 1, dw.sel));
  const r = rows[dw.sel], act = dwAction(r), n = s.agents.length;
  const tabs = dw.tabs.map((id, i) => sessions.find((x) => x.id === id)).filter(Boolean);
  const pv = !r ? "" : r.k === "a"
    ? `<div class="q">${esc(aName(r.a.type))}${r.a.description ? ": " + esc(r.a.description) : ""}</div>
       <div class="row">${Object.keys(r.a.models || {}).map(mp).join("")}<span class="tag">${fmtDur(Date.parse(r.a.end) - Date.parse(r.a.start))}</span><span class="tag">${fmtTok(r.a.tokens || 0)} Tokens</span></div>
       ${r.a.task ? `<div class="a">Auftrag: ${esc(r.a.task)}</div>` : ""}${r.a.result ? `<div class="a">Ergebnis: ${esc(r.a.result)}</div>` : ""}`
    : `<div class="q">${r.k === "s" ? `${r.no}. ` : "Zweig: "}${esc(r.n.text)}</div><div class="a">${esc(r.n.reply || "Keine Textantwort in diesem Schritt.")}</div>
       <div class="row"><span class="tag">${day(r.n.ts)} ${hhmm(r.n.ts)}</span>${(r.n.models || []).map(mp).join("")}${r.n.edits.slice(0, 5).map((f) => `<span class="tag">${esc(f.split("/").pop())}</span>`).join("")}</div>`;
  document.getElementById("drawer").innerHTML = `
    <div class="dw-tabs">${tabs.map((t, i) => `<button data-dtab="${t.id}" class="${t.id === s.id ? "on" : ""}"><b>${i + 1}</b><span class="sdot ${agentState(t).st}"></span><span>${esc(t.label)}</span></button>`).join("")}<span class="sp"></span><button class="x" data-close aria-label="Schliessen">${ic("x")}</button></div>
    <div class="dw-h2"><div class="t">${esc(s.label)}</div>
      <div class="m"><span class="sdot ${agentState(s).st}"></span>${esc(s.projName)}${s.branch ? " / " + esc(s.branch) : ""} ${s.modelList.map(mp).join("")}</div>
      <div class="m"><b>${s.path.length}</b> Schritte${s.nodes.length > s.path.length ? ` · <b>${s.nodes.length - s.path.length}</b> im Zweig` : ""} · <b>${n}</b> Helfer · <b>${usd(s.cost?.usd)}</b> · <b>${s.files.length}</b> Dateien · ${s.live ? `<span style="color:#a9b665">läuft gerade</span>` : rel(s.end)}</div></div>
    <div class="dw-log" id="dwLog">${rows.map((x, i) => `<button class="lg-r ${x.k === "a" ? "ag" : x.k === "b" ? "br" : ""} ${i === dw.sel ? "on" : ""}" data-dsel="${i}">${dwGutter(x, i === dw.sel, i === rows.length - 1)}<span class="x">${x.k === "a" ? `Helfer: ${esc(aName(x.a.type))}${x.a.description ? ", " + esc(x.a.description) : ""}` : `<i>${x.k === "s" ? x.no : "⑂"}</i>${esc(x.n.text)}`}</span><span class="tm">${x.k === "a" ? "" : hhmm(x.n.ts)}</span></button>`).join("")}</div>
    <div class="dw-pv">${pv}</div>
    <div class="dw-f">${act ? `<button class="btn ${act.fork ? "fork" : "pri"}" data-resume="${act.fork ? "fork" : ""}">${ic("play")} ${act.label}</button>` : `<button class="btn sec" data-dsel="${rows.findIndex((x) => x.n === r.n)}">Zum Schritt dieses Helfers</button>`}</div>
    <div class="dw-keys"><span><kbd>j</kbd><kbd>k</kbd> Zeile</span><span><kbd>J</kbd><kbd>K</kbd> nur Schritte</span><span><kbd>gt</kbd><kbd>gT</kbd> Session</span><span><kbd>Enter</kbd> los</span><span><kbd>x</kbd> Reiter zu</span><span><kbd>Esc</kbd> zu</span></div>`;
  document.querySelector("#dwLog .lg-r.on")?.scrollIntoView({ block: "nearest" });
}
function dwEnter() {
  const s = dw.s; if (!s) return; const rows = dwRows(s), r = rows[dw.sel], act = dwAction(r);
  if (act) return resume(s, act.fork);
  dw.sel = rows.findIndex((x) => x.n === r.n); renderDrawer();
}
// Keys while the panel is open: nothing reaches the editor underneath (Cmd shortcuts stay global)
window.addEventListener("keydown", (e) => {
  if (!dw.s || !document.getElementById("drawer").classList.contains("open")) return;
  if (document.body.classList.contains("term-open") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches?.("input,textarea,[contenteditable]")) return;
  const k = e.key, rows = dwRows(dw.s), step = (d) => { let i = dw.sel + d; while (i >= 0 && i < rows.length && rows[i].k === "a") i += d; if (i >= 0 && i < rows.length) dw.sel = i; };
  let used = true;
  if (dw.g) { dw.g = false; if (k === "t") dwSwitch(1); else if (k === "T") dwSwitch(-1); else if (k === "g") { dw.sel = 0; renderDrawer(); } else used = false; }
  else if (k === "g") dw.g = true;
  else if (k === "j" || k === "ArrowDown") { dw.sel = Math.min(rows.length - 1, dw.sel + 1); renderDrawer(); }
  else if (k === "k" || k === "ArrowUp") { dw.sel = Math.max(0, dw.sel - 1); renderDrawer(); }
  else if (k === "J") { step(1); renderDrawer(); } else if (k === "K") { step(-1); renderDrawer(); }
  else if (k === "G") { dw.sel = dwLastRow(rows); renderDrawer(); }
  else if (/^[1-6]$/.test(k) && dw.tabs[+k - 1]) { dw.s = sessions.find((x) => x.id === dw.tabs[+k - 1]) || dw.s; dw.sel = dwLastRow(dwRows(dw.s)); renderDrawer(); }
  else if (k === "x") dwCloseTab();
  else if (k === "Enter") dwEnter();
  else if (k === "Escape") closeDrawer();
  else if (k === "Shift") return;
  else used = false;
  if (used) { e.preventDefault(); e.stopPropagation(); }
}, true);

// ================= Look registry =================
const LOOKS = []; let LOOK = null, cleanup = [];
const dataListeners = new Set();
window.Atlas = { DATA, esc, ic, short, projName, rel, relShort, hhmm, day, modelInfo, mp, aName, fmtTok, fmtDur, usd, hue, initials, fresh, agentState, askOf, sendPrompt,
  open: openSession, close: closeDrawer, resume, toast, register: (l) => LOOKS.push(l), onCleanup: (fn) => cleanup.push(fn),
  notifier: null, // a look may set this to show toasts in its own style
  // A look that refreshes itself in place registers here; returns an unsubscribe function
  onDataChanged(cb) { dataListeners.add(cb); return () => dataListeners.delete(cb); },
  handlesLiveData: () => dataListeners.size > 0,
  // Desktop app: quiet = refresh the open drawer and let listening looks update in place; otherwise re-mount the look
  applyData(raw, { quiet } = {}) {
    buildData(raw);
    if (dw.s) { const id = dw.s.id; dw.s = sessions.find((x) => x.id === id) || dw.s; renderDrawer(); }
    if (quiet) { for (const cb of dataListeners) { try { cb(DATA); } catch (e) { console.error(e); } } }
    else { const open = dw.s?.id; mount(LOOK.key); if (open) openSession(open); }
  } };
function mount(key) {
  cleanup.forEach((fn) => { try { fn(); } catch {} }); cleanup = [];
  LOOK = LOOKS.find((l) => l.key === key) || LOOKS[0];
  const u = new URL(location); u.searchParams.set("look", LOOK.key); history.replaceState(null, "", u);
  document.getElementById("lookcss").textContent = LOOK.css || "";
  const st = document.getElementById("stage"); st.className = "lk-" + LOOK.key; st.innerHTML = "";
  closeDrawer();
  if (!sessions.length) { st.innerHTML = `<p style="padding:40px">Keine Daten. Erst <code>node scripts/extract.mjs</code> laufen lassen.</p>`; return; }
  try { LOOK.render(st, window.Atlas); } catch (e) { st.innerHTML = `<pre style="padding:40px;color:var(--rose)">${esc(e.stack)}</pre>`; console.error(e); }
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-close],[data-dsel],[data-dtab],[data-resume],[data-open]");
  if (!el) return;
  const d = el.dataset;
  if (d.close !== undefined) return closeDrawer();
  if (d.dsel !== undefined) { const i = +d.dsel; if (i === dw.sel) return dwEnter(); dw.sel = i; return renderDrawer(); }
  if (d.dtab) { dw.s = sessions.find((x) => x.id === d.dtab) || dw.s; dw.sel = dwLastRow(dwRows(dw.s)); renderDrawer(); return LOOK?.onSelect?.(dw.s.id); }
  if (d.resume !== undefined && dw.s) return resume(dw.s, d.resume === "fork");
  if (d.open) return openSession(d.open, d.openStep);
});
document.addEventListener("keydown", (e) => {
  // The notes editor (CodeMirror + vim) needs Escape itself, so only plain inputs lose focus here
  if (e.target.matches("input,textarea,[contenteditable]")) { if (e.key === "Escape" && !e.target.closest(".cm-editor")) e.target.blur(); return; }
  if (e.key === "Escape") return closeDrawer();
});
</script>

<script src="nvim.js"></script>
<script src="mascot.js"></script>
<script src="loops.js"></script>
<script>
const want = new URLSearchParams(location.search).get("look");
mount(want || LOOKS[0]?.key);
// Desktop app only: load xterm and the terminal dock (the browser prototype keeps copy-to-clipboard)
if (window.atlasApp) {
  const add = (tag, attrs) => new Promise((ok) => { const el = Object.assign(document.createElement(tag), attrs); el.onload = ok; document.head.appendChild(el); });
  add("link", { rel: "stylesheet", href: "../node_modules/@xterm/xterm/css/xterm.css" });
  add("script", { src: "../node_modules/@xterm/xterm/lib/xterm.js" })
    .then(() => add("script", { src: "../node_modules/@xterm/addon-fit/lib/addon-fit.js" }))
    .then(() => add("script", { src: "terminal.js" }));
}
</script>
