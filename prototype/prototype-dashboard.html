<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übersicht Entwürfe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#1d2021; --bg:#282828; --bg1:#32302f; --bg2:#3c3836; --bg3:#504945; --bg4:#665c54;
  --fg:#ebdbb2; --fg2:#d5c4a1; --fg3:#bdae93; --fg4:#a89984; --gr:#928374;
  --re:#fb4934; --gn:#b8bb26; --ye:#fabd2f; --bl:#83a598; --pu:#d3869b; --aq:#8ec07c; --or:#fe8019;
  --mono:"JetBrains Mono", Menlo, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:#111213; color:var(--fg2); font:500 12.5px/1.45 var(--mono); display:flex; flex-direction:column; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:left; }
kbd { font:700 10px var(--mono); color:var(--fg4); background:rgba(235,219,178,.06); border:1px solid rgba(235,219,178,.16); border-bottom-width:2px; border-radius:4px; padding:0 5px; }

/* switcher */
.sw { display:flex; gap:6px; align-items:center; padding:10px 16px; flex-wrap:wrap; }
.sw .lbl { color:var(--gr); margin-right:6px; }
.sw button { padding:5px 11px; border-radius:6px; color:var(--fg4); border:1px solid #2a2c2d; }
.sw button.on { color:var(--bg0); background:var(--ye); border-color:var(--ye); font-weight:700; }
.sw button:hover:not(.on) { color:var(--fg); }
.note { padding:0 16px 10px; color:var(--gr); font-style:italic; max-width:1100px; }
.note b { color:var(--fg3); font-style:normal; }

/* the mock window */
.win { flex:1; min-height:0; margin:0 16px 16px; border-radius:12px; background:var(--bg0); box-shadow:0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.5); display:flex; flex-direction:column; overflow:hidden; }
.view { flex:1; min-height:0; overflow:auto; }
.sl { height:22px; display:flex; background:var(--bg); font-size:11px; flex:none; }
.sl span { display:flex; align-items:center; padding:0 12px; }
.sl .m { background:var(--ye); color:var(--bg0); font-weight:800; }
.sl .b { background:var(--bg2); }
.sl .c { flex:1; color:var(--fg3); }
.sl .y { background:var(--bg2); }
.sl .z { background:var(--ye); color:var(--bg0); font-weight:800; }
.dim { color:var(--gr); }
.sel { background:var(--bg1); box-shadow:inset 2px 0 0 var(--ye); }

/* ===== A: Startify ===== */
.a { max-width:760px; margin:0 auto; padding:5vh 24px 24px; }
.a-top { display:flex; align-items:baseline; gap:14px; }
.a-top h1 { font-size:15px; font-weight:800; letter-spacing:.02em; color:var(--ye); }
.a-top .meta { color:var(--gr); }
.a-top .meta b { color:var(--fg3); font-weight:600; }
.a-pulse { display:flex; align-items:center; gap:10px; margin:10px 0 26px; color:var(--gr); font-size:11.5px; }
.spark { display:inline-flex; align-items:flex-end; gap:2px; height:16px; }
.spark i { width:4px; background:var(--gn); opacity:.85; border-radius:1px; }
.a-h { color:var(--gr); font-style:italic; margin:18px 0 4px; font-size:11.5px; }
.a-row { display:grid; grid-template-columns:28px 1fr auto 44px; gap:10px; align-items:center; height:28px; padding:0 10px; border-radius:5px; width:100%; }
.a-row:hover { background:rgba(235,219,178,.04); }
.a-row .k { color:var(--bl); font-weight:800; text-align:center; }
.a-row .t { color:var(--fg); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.a-row .p { font-size:11px; }
.a-row .ago { color:var(--bg4); font-size:11px; text-align:right; }
.a-keys { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:30px; padding-top:14px; border-top:1px dashed var(--bg2); color:var(--fg4); font-size:11.5px; }
.a-keys span b { color:var(--ye); margin-right:5px; }

/* ===== B: Weitermachen ===== */
.b { max-width:880px; margin:0 auto; padding:5vh 24px 24px; }
.b-greet { color:var(--gr); font-style:italic; }
.b-greet b { color:var(--fg); font-style:normal; font-size:17px; font-weight:700; display:block; margin-top:2px; }
.b-hero { margin-top:20px; display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--bg2); border-radius:10px; overflow:hidden; background:linear-gradient(180deg,#252728,#1f2122); }
.b-hero .l, .b-hero .r { padding:16px 18px; }
.b-hero .r { border-left:1px solid var(--bg2); background:rgba(0,0,0,.12); }
.b-tag { font-size:11px; color:var(--gr); display:flex; gap:8px; align-items:center; }
.b-tag .proj { color:var(--or); }
.b-title { font-size:15px; font-weight:700; color:var(--fg); margin:6px 0 12px; }
.b-q { border-left:2px solid var(--ye); padding:4px 10px; color:var(--fg2); margin-bottom:10px; }
.b-a { border-left:2px solid var(--aq); padding:4px 10px; color:var(--fg3); }
.b-lbl { font-size:10.5px; color:var(--gr); text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px; }
.b-steps { display:flex; gap:3px; margin:4px 0 14px; }
.b-steps i { flex:1; height:6px; border-radius:2px; background:var(--bg2); }
.b-steps i.d { background:var(--gn); opacity:.6; } .b-steps i.c { background:var(--ye); }
.b-files { color:var(--fg4); font-size:11.5px; }
.b-files div::before { content:"~ "; color:var(--ye); }
.b-go { margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; }
.b-go button { padding:8px 14px; border-radius:7px; font-weight:700; }
.b-go .pri { background:var(--ye); color:var(--bg0); }
.b-go .sec { border:1px solid var(--bg3); color:var(--fg3); }
.b-more { margin-top:22px; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px; }
.b-card { padding:10px 12px; border-radius:7px; border:1px solid #2c2e2f; display:grid; gap:2px; }
.b-card:hover { border-color:var(--bg3); background:#222425; }
.b-card .t { color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.b-card .s { font-size:11px; color:var(--gr); display:flex; justify-content:space-between; }
.b-foot { margin-top:20px; color:var(--gr); font-size:11px; }
.b-foot b { color:var(--fg3); }

/* ===== C: Telescope ===== */
.c { height:100%; display:grid; place-items:center; padding:24px; }
.c-box { width:min(1000px,100%); height:min(560px,100%); display:grid; grid-template-columns:1.1fr 1fr; grid-template-rows:auto 1fr; border:1px solid var(--bg3); border-radius:8px; overflow:hidden; background:var(--bg0); box-shadow:0 20px 60px rgba(0,0,0,.4); }
.c-in { grid-column:1 / -1; display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--bg2); }
.c-in .pr { color:var(--ye); font-weight:800; }
.c-in input { flex:1; background:none; border:0; outline:0; color:var(--fg); font:600 14px var(--mono); }
.c-in .cnt { color:var(--gr); font-size:11px; }
.c-list { overflow:auto; padding:6px 0; border-right:1px solid var(--bg2); }
.c-grp { padding:8px 14px 3px; color:var(--gr); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; }
.c-it { display:grid; grid-template-columns:18px 1fr auto; gap:8px; align-items:center; height:26px; padding:0 14px; width:100%; }
.c-it .ic { color:var(--c,var(--bl)); }
.c-it .t { color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.c-it .t mark { background:none; color:var(--ye); font-weight:800; }
.c-it .x { color:var(--gr); font-size:11px; }
.c-pv { padding:14px 16px; overflow:auto; }
.c-pv h3 { color:var(--or); font-size:13px; margin-bottom:4px; }
.c-pv .m { color:var(--gr); font-size:11px; margin-bottom:12px; }
.c-pv .h { color:var(--aq); margin:10px 0 4px; font-size:11.5px; }
.c-pv p { color:var(--fg3); }

/* ===== D: Heute ===== */
.d { padding:4vh 28px 24px; max-width:1180px; margin:0 auto; }
.d-head { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
.d-head h2 { color:var(--fg); font-size:15px; }
.d-head .kpi { display:flex; gap:18px; color:var(--gr); font-size:11.5px; flex-wrap:wrap; }
.d-head .kpi b { color:var(--c); font-size:13px; margin-right:4px; }
.d-tl { margin-top:18px; border:1px solid var(--bg2); border-radius:8px; padding:12px 14px 8px; }
.d-axis { display:grid; grid-template-columns:120px 1fr; font-size:10.5px; color:var(--gr); }
.d-axis .h { display:flex; justify-content:space-between; }
.d-lane { display:grid; grid-template-columns:120px 1fr; align-items:center; height:24px; }
.d-lane .n { font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.d-track { position:relative; height:12px; background:repeating-linear-gradient(90deg, transparent 0 calc(100%/12 - 1px), #2a2c2d calc(100%/12 - 1px) calc(100%/12)); }
.d-blk { position:absolute; top:0; bottom:0; border-radius:3px; background:var(--c); opacity:.85; }
.d-blk:hover { opacity:1; outline:1px solid var(--fg); }
.d-now { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--re); }
.d-cols { display:grid; grid-template-columns:1.4fr 1fr; gap:28px; margin-top:22px; }
.d-h { color:var(--gr); font-style:italic; font-size:11.5px; margin-bottom:6px; }
.d-week { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.d-week div { height:64px; border-radius:5px; background:var(--bg1); display:flex; flex-direction:column; justify-content:flex-end; padding:5px; font-size:10.5px; color:var(--gr); position:relative; overflow:hidden; }
.d-week div i { position:absolute; left:0; right:0; bottom:0; background:var(--gn); opacity:.25; }
.d-week div span { position:relative; }
.d-week div b { position:relative; color:var(--fg2); }

/* ===== E: Projekte ===== */
.e { padding:3.5vh 24px 24px; max-width:1180px; margin:0 auto; }
.e-bar { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.e-bar .f { flex:1; min-width:220px; display:flex; align-items:center; gap:8px; padding:7px 12px; border:1px solid var(--bg2); border-radius:7px; color:var(--gr); }
.e-bar .f b { color:var(--ye); }
.e-bar .st { color:var(--gr); font-size:11.5px; white-space:nowrap; }
.e-bar .st b { color:var(--fg3); }
.e-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
.e-card { border:1px solid #2c2e2f; border-radius:9px; padding:12px 14px 10px; background:#202223; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden; }
.e-card .hd .n::before { content:"● "; }
.e-card:hover { border-color:var(--bg3); }
.e-card.sel { box-shadow:0 0 0 1px var(--ye); }
.e-card .hd { display:flex; align-items:center; gap:8px; }
.e-card .hd .n { color:var(--c); font-weight:700; }
.e-card .hd .live { margin-left:auto; font-size:10.5px; color:var(--gn); }
.e-card .hd .cnt { margin-left:auto; color:var(--gr); font-size:11px; }
.e-card .ls { color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.e-card .ls small { color:var(--gr); }
.e-card .ft { display:flex; align-items:flex-end; justify-content:space-between; color:var(--gr); font-size:10.5px; }
.e-card .ft .spark i { background:var(--c); }

/* ===== F: Terminal ===== */
.f { height:100%; display:flex; flex-direction:column; background:#24273a; }
.f-tabs { height:30px; display:flex; background:#1b1d2b; flex:none; font-size:11.5px; overflow:hidden; }
.f-tab { display:flex; align-items:center; gap:7px; padding:0 12px; color:#8087a2; border-right:1px solid #11121b; white-space:nowrap; }
.f-tab.on { background:#24273a; color:#cad3f5; box-shadow:inset 0 2px 0 #a6da95; }
.f-tab .dot { width:7px; height:7px; border-radius:50%; background:#a6da95; }
.f-tab .dot.idle { background:#494d64; }
.f-tab .dot.wait { background:#eed49f; animation:blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity:.2; } }
.f-sp { flex:1; }
.f-btn { display:flex; align-items:center; gap:6px; padding:0 10px; color:#8087a2; white-space:nowrap; }
.f-body { flex:1; display:grid; grid-template-columns:1fr 240px; min-height:0; }
.f-out { padding:12px 16px; color:#cad3f5; font-size:13px; line-height:1.55; overflow:auto; white-space:pre; }
.f-out .u { color:#8aadf4; } .f-out .ok { color:#a6da95; } .f-out .g { color:#6e738d; }
.f-out .cur { display:inline-block; width:8px; height:15px; background:#f4dbd6; vertical-align:-2px; animation:blink 1s steps(2) infinite; }
.f-side { border-left:1px solid #1b1d2b; padding:12px; font-size:11.5px; color:#a5adcb; background:#1e2030; overflow:auto; }
.f-side h4 { color:#8087a2; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; margin:4px 0 6px; font-weight:600; }
.f-side .st { display:flex; gap:6px; padding:3px 0; } .f-side .st b { color:#eed49f; width:20px; flex:none; }
.f-side .fl::before { content:"~ "; color:#eed49f; }
.f-hint { height:22px; display:flex; align-items:center; gap:14px; padding:0 12px; font-size:11px; color:#8087a2; background:#1b1d2b; flex:none; }
.f-hint kbd { color:#cad3f5; border-color:#494d64; background:transparent; }

@media (max-width:760px) {
  .b-hero, .d-cols, .c-box, .f-body { grid-template-columns:1fr; }
  .b-hero .r { border-left:0; border-top:1px solid var(--bg2); }
  .c-pv, .f-side { display:none; }
}
</style>
</head>
<body>
<div class="sw" id="sw"><span class="lbl">Entwurf</span></div>
<div class="note" id="note"></div>
<div class="win"><div class="view" id="view"></div><div class="sl" id="sl"></div></div>

<script>
const PROJ = { "rezept-app":"#fabd2f", "dotfiles":"#fe8019", "game-jam-2026":"#d3869b", "haushaltsbuch":"#b8bb26", "portfolio-site":"#b16286", "ki-notizen":"#d79921", "fahrrad-tracker":"#8ec07c", "wetterstation":"#83a598" };
// [titel, projekt, vor, schritte, letzte frage, letzte antwort, dateien]
const S = [
  ["Volltextsuche für Rezepte","rezept-app","12m",14,"Zeig mir zwei Varianten für das Layout","Die README beschreibt jetzt Installation, Start und die wichtigsten Befehle.",["search.test.ts"]],
  ["Soundeffekte einbauen","game-jam-2026","3h",9,"Mach den Sprung-Sound etwas leiser","Lautstärke auf 0.6 gesetzt, Sprung und Landung getrennt.",["audio.ts","player.ts"]],
  ["Setup-Skript für neuen Mac","dotfiles","7h",22,"Füg noch Ghostty und Raycast hinzu","Beides im Brewfile ergänzt, Skript läuft idempotent.",["Brewfile","setup.sh"]],
  ["Monatsbericht als PDF","haushaltsbuch","10h",11,"Die Tabelle soll auf eine Seite passen","Schriftgröße verkleinert und Spalten zusammengelegt.",["report.ts"]],
  ["Neovim-Config aufräumen","dotfiles","14h",19,"Entfern die Plugins, die ich nicht nutze","7 Plugins entfernt, Startzeit von 92 auf 41 ms.",["init.lua"]],
  ["Zutatenliste als Einkaufszettel","rezept-app","17h",8,"Gleiche Zutaten zusammenfassen","Mengen werden jetzt pro Einheit addiert.",["list.ts"]],
  ["GPX-Dateien einlesen","fahrrad-tracker","6d",6,"","",[]],
  ["Sensor-Daten per MQTT","wetterstation","12d",5,"","",[]],
  ["Zusammenfassung pro Woche","ki-notizen","14d",10,"","",[]],
  ["Projekt-Galerie mit Filter","portfolio-site","13d",10,"","",[]],
];
const days = [3,0,5,8,2,0,0,4,9,12,6,1,0,0,7,11,4,3,0,0,2,6,9,14,8,0,0,13,27,41];
const spark = (v, h=16) => { const m = Math.max(1, ...v); return `<span class="spark" style="height:${h}px">${v.map(x=>`<i style="height:${Math.max(1,Math.round(x/m*h))}px"></i>`).join("")}</span>`; };
const c = (p) => PROJ[p] || "#a89984";
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const row = (s, n, on) => `<button class="a-row ${on?"sel":""}"><span class="k">${n}</span><span class="t">${esc(s[0])}</span><span class="p" style="color:${c(s[1])}">${s[1]}</span><span class="ago">${s[2]}</span></button>`;

const V = [
{ name:"Startify", note:"<b>Das Ruhige.</b> Das Logo schrumpft auf eine Zeile, die zuletzt genutzten Sessions sind der Hauptinhalt (gruppiert nach Heute / Diese Woche). Das Menü wird zu einer Tastenleiste unten, die Statistik zu einer einzigen Zeile mit Mini-Kurve. Nah am heutigen Look, nur ohne Ballast.",
  sl:["NORMAL","atlas","startify","26 Sessions"],
  html:() => `<div class="a">
    <div class="a-top"><h1>session atlas</h1><span class="meta"><b>8</b> Projekte · <b>26</b> Sessions · <b>$48.84</b></span></div>
    <div class="a-pulse">${spark(days)} <span>30 Tage · heute <b style="color:var(--gn)">41</b> Schritte, Rekord</span></div>
    <div class="a-h">-- Heute</div>${S.slice(0,4).map((s,i)=>row(s,i+1,!i)).join("")}
    <div class="a-h">-- Diese Woche</div>${S.slice(4,8).map((s,i)=>row(s,i+5)).join("")}
    <div class="a-keys">${[["f","suchen"],["p","Projekte"],["n","Notizen"],["a","Agents"],["m","MCP"],["c","neue Session"],["o","neues Projekt"],["s","Statistik"],["q","schliessen"]].map(([k,l])=>`<span><b>${k}</b>${l}</span>`).join("")}</div>
  </div>` },
{ name:"Weitermachen", note:"<b>„Wo war ich?“ in einem Blick.</b> Die letzte Session steht groß oben: deine letzte Frage, Claudes Antwort, Fortschritt und geänderte Dateien, mit einem Knopf zum Fortsetzen. Darunter kompakte Karten für die anderen Sessions. Statistik nur als Fußzeile.",
  sl:["NORMAL","atlas","weitermachen","Enter = fortsetzen"],
  html:() => { const s = S[0]; return `<div class="b">
    <div class="b-greet">Guten Morgen<b>Du warst zuletzt bei „${esc(s[0])}“</b></div>
    <div class="b-hero"><div class="l">
      <div class="b-tag"><span class="proj">● ${s[1]}</span><span>feat/suche</span><span>vor ${s[2]}</span></div>
      <div class="b-title">${esc(s[0])}</div>
      <div class="b-lbl">Schritt 14 von 14</div>
      <div class="b-steps">${Array.from({length:14},(_,i)=>`<i class="${i<13?"d":"c"}"></i>`).join("")}</div>
      <div class="b-files">${s[6].map(f=>`<div>${f}</div>`).join("")}</div>
      <div class="b-go"><button class="pri">▶ Weitermachen ⏎</button><button class="sec">⑂ Abzweigen</button><button class="sec">Im Editor</button></div>
    </div><div class="r">
      <div class="b-lbl">Du hast gefragt</div><div class="b-q">${esc(s[4])}</div>
      <div class="b-lbl">Claude hat geantwortet</div><div class="b-a">${esc(s[5])}</div>
    </div></div>
    <div class="b-more">${S.slice(1,7).map((x,i)=>`<button class="b-card"><span class="t">${esc(x[0])}</span><span class="s"><span style="color:${c(x[1])}">${x[1]}</span><span>${i+2} · ${x[2]}</span></span></button>`).join("")}</div>
    <div class="b-foot"><b>26</b> Sessions · <b>176</b> Schritte · <b>9</b> Agents · <b>$48.84</b> · <kbd>s</kbd> Statistik · <kbd>Space</kbd> alle Befehle</div>
  </div>`; } },
{ name:"Telescope", note:"<b>Keine Übersicht, nur eine Suche.</b> Beim Start öffnet sich ein Telescope-Picker: Tippen filtert Sessions, Projekte und Befehle gleichzeitig, rechts eine Vorschau. Am schnellsten für Tastatur-Leute, zeigt aber am wenigsten auf einen Blick. (Hier kannst du tippen.)",
  sl:["INSERT","atlas","telescope","Tab wechselt Gruppe"],
  html:() => `<div class="c"><div class="c-box">
    <div class="c-in"><span class="pr">›</span><input id="cq" value="re" autocomplete="off" spellcheck="false"><span class="cnt" id="cc"></span></div>
    <div class="c-list" id="cl"></div>
    <div class="c-pv"><h3># ${esc(S[0][0])}</h3><div class="m">rezept-app · feat/suche · Schritt 14/14 · vor 12m</div>
      <div class="h">## Du hast gefragt</div><p>${esc(S[0][4])}</p><div class="h">## Claude hat geantwortet</div><p>${esc(S[0][5])}</p>
      <div class="h">## Dateien</div><p>~ search.test.ts</p></div>
  </div></div>`,
  after: () => { const q = document.getElementById("cq"), l = document.getElementById("cl"), cc = document.getElementById("cc");

const sw = document.getElementById("sw"), view = document.getElementById("view"), note = document.getElementById("note"), sl = document.getElementById("sl");
V.forEach((v, i) => sw.insertAdjacentHTML("beforeend", `<button data-i="${i}">${i + 1} · ${v.name}</button>`));
function show(i) {
  const v = V[i];
  sw.querySelectorAll("button").forEach((b) => b.classList.toggle("on", +b.dataset.i === i));
  note.innerHTML = v.note;
  view.innerHTML = v.html(); v.after?.();
  const [m, b, cc, y] = v.sl;
  sl.innerHTML = `<span class="m">${m}</span><span class="b">${b}</span><span class="c">${cc}</span><span class="y">${y}</span><span class="z">13:42</span>`;
  try { localStorage.setItem("dash.variant", i); } catch {}
}
sw.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); });
addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return; const n = +e.key; if (n >= 1 && n <= V.length) show(n - 1); });
let start = 0; try { start = +localStorage.getItem("dash.variant") || 0; } catch {}
show(Math.min(start, V.length - 1));
</script>
