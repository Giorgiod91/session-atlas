<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal-Seiten</title>
<!-- PROTOTYPE, throwaway. Question: what is worth showing left and right of the built-in terminal?
     Pick a panel per side and compare combinations; everything works by keyboard. Loops palette. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1011; --p0:#141617; --p1:#1b1d1e; --p2:#26292a; --p3:#3a3e41; --line:#2a2d2f;
  --fg:#ebdbb2; --fg2:#d5c4a1; --fg3:#bdae93; --fg4:#a89984; --gr:#8a8278;
  --ac:#e07a4f; --gn:#a9b665; --rd:#ea6962; --wt:#e0a84f; --pu:#d3869b; --bl:#7daea3;
  --tb:#24273a; --tfg:#cad3f5; --tdim:#8087a2; --tor:#f5a97f; --tgn:#a6da95; --tbl:#8aadf4; --tmu:#6e738d; --trd:#ed8796;
  --mono:"JetBrains Mono", Menlo, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0a0b0b; color:var(--fg2); font:500 12px/1.5 var(--mono); display:flex; flex-direction:column; align-items:center; padding:14px 16px 150px; min-height:100vh; overflow-x:hidden; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
kbd { font:700 10px var(--mono); color:var(--fg3); background:rgba(235,219,178,.07); border:1px solid rgba(235,219,178,.16); border-bottom-width:2px; border-radius:4px; padding:0 4px; white-space:nowrap; }
.top { width:100%; max-width:1320px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
.top h1 { color:var(--fg); font-size:15px; }
.top p { color:var(--gr); }
.screen { width:100%; max-width:1320px; height:min(calc(min(100vw - 32px, 1320px) * .625), calc(100vh - 290px)); min-height:460px; position:relative; border-radius:12px; overflow:hidden; background:var(--p0); box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--line); display:flex; flex-direction:column; }
.why { width:100%; max-width:1320px; margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:16px; color:var(--fg4); }
.why b { color:var(--fg); }

/* tab bar + statusline (the A2 / A1 look in loops colors) */
.tbar { height:36px; flex:none; display:flex; align-items:center; gap:4px; padding-left:84px; background:var(--bg); border-bottom:1px solid #000; }
.tbar .wm { color:var(--ac); font-weight:800; letter-spacing:.14em; margin-right:12px; font-size:11px; }
.tt { display:flex; align-items:center; gap:7px; padding:4px 10px; border-radius:6px; color:var(--gr); white-space:nowrap; }
.tt.on { background:var(--tb); color:var(--fg); box-shadow:inset 0 -2px 0 var(--ac); }
.num { font:800 10px var(--mono); color:var(--bg); background:var(--fg4); border-radius:3px; padding:0 4px; }
.tt.on .num { background:var(--ac); }
.row3 { flex:1; display:flex; min-height:0; }
.side { width:290px; flex:none; background:var(--p0); display:flex; flex-direction:column; overflow:hidden; }
.side.l { border-right:1px solid #000; } .side.r { border-left:1px solid #000; }
.side .sh { display:flex; align-items:center; gap:8px; padding:10px 14px 8px; color:var(--gr); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; }
.side .sh .sp { flex:1; }
.side .sb { flex:1; overflow:hidden; padding:0 14px 12px; display:flex; flex-direction:column; gap:10px; }
.term { flex:1; min-width:0; background:var(--tb); position:relative; overflow:hidden; }
.tx { font:500 12.5px/1.55 var(--mono); color:var(--tfg); padding:14px 18px; white-space:pre; }
.tx .o { color:var(--tor); font-weight:700; } .tx .d { color:var(--tdim); } .tx .g { color:var(--tgn); } .tx .b { color:var(--tbl); } .tx .m { color:var(--tmu); } .tx .r { color:var(--trd); }
.tx .box { display:inline-block; border:1px solid #494d64; border-radius:6px; padding:6px 12px; margin:8px 0; }
.cur { display:inline-block; width:8px; height:15px; background:var(--tfg); vertical-align:-3px; animation:blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
.sl { height:24px; flex:none; display:flex; align-items:stretch; background:var(--p1); font-size:11px; white-space:nowrap; }
.sl > span { display:flex; align-items:center; gap:7px; padding:0 14px; }
.sl .m { background:var(--ac); color:#1a0f0a; font-weight:800; letter-spacing:.06em; padding-right:20px; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%); }
.sl .b { background:var(--p3); margin-left:-10px; padding-left:20px; padding-right:20px; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%); }
.sl .c { flex:1; background:var(--p2); margin-left:-10px; padding-left:20px; color:var(--fg3); }
.sl .y { background:var(--p3); }

/* panel content bits */
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; background:var(--c, var(--p3)); }
.dot.run { --c:var(--gn); animation:pulse 1.6s infinite; } .dot.wait { --c:var(--wt); } .dot.err { --c:var(--rd); }
@keyframes pulse { 50% { opacity:.4; } }
.it { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 8px; border-radius:7px; color:var(--fg4); }
.it .av { width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:10px; font-weight:800; color:var(--bg); background:var(--h, var(--fg4)); }
.it .nm { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg3); }
.it small { display:block; color:var(--gr); font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.it.on { background:var(--tb); box-shadow:inset 3px 0 0 var(--ac); } .it.on .nm { color:var(--fg); }
.sub { padding-left:30px; display:flex; flex-direction:column; gap:2px; margin:-4px 0 4px; }
.sub span { color:var(--pu); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card { border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:var(--p1); }
.card b { color:var(--fg); }
.lbl { color:var(--gr); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
.chip { font-size:10.5px; padding:0 6px; border-radius:4px; background:var(--p2); color:var(--fg3); white-space:nowrap; }
.chip.ag { background:rgba(211,134,155,.14); color:var(--pu); }
.vl { display:grid; grid-template-columns:16px minmax(0,1fr) 38px; gap:6px; align-items:center; min-height:24px; color:var(--fg4); }
.vl i { width:16px; display:flex; justify-content:center; position:relative; align-self:stretch; }
.vl i::before { content:""; position:absolute; top:0; bottom:0; width:2px; background:var(--p3); }
.vl i::after { content:""; position:relative; margin-top:8px; width:8px; height:8px; border-radius:50%; background:var(--fg4); }
.vl.h i::after { background:transparent; border:1.5px solid var(--pu); width:7px; height:7px; }
.vl.now i::after { background:var(--ac); box-shadow:0 0 0 3px rgba(224,122,79,.25); }
.vl span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vl.h span { color:var(--pu); font-size:11px; }
.vl.now span { color:var(--fg); font-weight:700; }
.vl em { font-style:normal; color:var(--gr); font-size:10.5px; text-align:right; }
.tree { display:flex; flex-direction:column; gap:1px; font-size:11.5px; }
.tree span { white-space:nowrap; color:var(--fg4); }
.tree .dir { color:var(--fg3); }
.tree .m { color:var(--wt); } .tree .a { color:var(--gn); } .tree .live { color:var(--ac); font-weight:700; }
.diff { font-size:11px; line-height:1.55; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.diff div { padding:0 8px; white-space:pre; }
.diff .h { background:var(--p2); color:var(--fg3); padding:4px 8px; }
.diff .add { background:rgba(169,182,101,.12); color:#c7d48a; } .diff .del { background:rgba(234,105,98,.12); color:#f0a29d; } .diff .ctx { color:var(--gr); }
.chk { display:flex; gap:8px; align-items:flex-start; color:var(--fg3); }
.chk b { width:14px; height:14px; border-radius:3px; border:1.5px solid var(--p3); flex:none; margin-top:2px; display:grid; place-items:center; font-size:10px; color:var(--bg); }
.chk.ok { color:var(--gr); text-decoration:line-through; } .chk.ok b { background:var(--gn); border-color:var(--gn); }
.chk.now b { border-color:var(--ac); }
.vf { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:7px; background:var(--p1); border:1px solid var(--line); }
.vf .sp { flex:1; }
.vf.r { border-color:rgba(234,105,98,.35); } .vf.g { border-color:rgba(169,182,101,.35); }
.bar2 { height:6px; border-radius:3px; background:var(--p2); overflow:hidden; } .bar2 i { display:block; height:100%; background:var(--gn); border-radius:3px; }
.q { display:flex; gap:8px; align-items:flex-start; padding:7px 9px; border-radius:7px; background:var(--p1); border:1px solid var(--line); color:var(--fg3); }
.q b { color:var(--ac); }
.mascot { width:26px; height:22px; image-rendering:pixelated; flex:none; }
.mini { position:relative; height:190px; border:1px solid var(--line); border-radius:8px; background:var(--p1); }
.mini svg { position:absolute; inset:0; width:100%; height:100%; }
.mini .n { position:absolute; transform:translate(-50%,-50%); font-size:10.5px; padding:2px 7px; border-radius:5px; background:var(--p0); border:1px solid var(--line); white-space:nowrap; display:flex; gap:5px; align-items:center; color:var(--fg3); }
.mini .n.on { border-color:var(--ac); color:var(--fg); }

/* chooser */
.pick { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:50; width:min(1320px, calc(100vw - 32px)); display:flex; flex-direction:column; gap:6px; padding:8px; border-radius:12px;
  background:rgba(20,22,23,.96); border:1px solid rgba(235,219,178,.14); box-shadow:0 14px 40px rgba(0,0,0,.55); }
.pick .ln { display:flex; align-items:center; gap:4px; overflow-x:auto; }
.pick .ln > span { color:var(--gr); width:74px; flex:none; font-weight:700; }
.pick .ln.on > span { color:var(--ac); }
.pick button { padding:4px 9px; border-radius:7px; color:var(--fg4); white-space:nowrap; }
.pick button.on { background:var(--p2); color:var(--fg); }
.pick .ln.on button.on { background:var(--ac); color:#1a0f0a; font-weight:800; }
.pick .hint { color:var(--gr); font-size:10.5px; display:flex; gap:12px; flex-wrap:wrap; padding:2px 4px 0; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<div class="top"><h1>Was gehört links und rechts neben das Terminal?</h1><p>Prototyp. Spalten frei kombinieren, alles mit der Tastatur.</p></div>
<div class="screen" id="screen"></div>
<div class="why" id="why"></div>
<div class="pick" id="pick"></div>
<script>
const MASCOT = `<svg class="mascot" viewBox="0 0 13 11" shape-rendering="crispEdges"><g fill="#e07a4f"><rect x="3" y="0" width="7" height="1"/><rect x="2" y="1" width="9" height="5"/><rect x="0" y="3" width="13" height="2"/><rect x="2" y="6" width="2" height="3"/><rect x="5" y="6" width="3" height="2"/><rect x="9" y="6" width="2" height="3"/></g><g fill="#141617"><rect x="4" y="2" width="1" height="2"/><rect x="8" y="2" width="1" height="2"/></g></svg>`;
const TABS = [
  { name: "Volltextsuche für Rezepte", pj: "rezept-app", st: "run", h: "#e07a4f", helpers: ["Allrounder: Tests für Umlaute"] },
  { name: "Soundeffekte einbauen", pj: "game-jam-2026", st: "wait", h: "#a9b665", helpers: [] },
  { name: "Monatsbericht als PDF", pj: "haushaltsbuch", st: "err", h: "#d3869b", helpers: ["Sucher: PDF-Bibliothek finden"] },
  { name: "Setup-Skript für Mac", pj: "dotfiles", st: "run", h: "#7daea3", helpers: [] },
];
const LEFT = [
  { k: "off", n: "Aus", why: "Volle Breite fürs Terminal." },
  { k: "agents", n: "Agenten", why: "Alle offenen Terminals mit Status, darunter ihre Helfer. Wie die Agenten-Übersicht, nur immer sichtbar. ⌘1 bis 9 springt hin, man sieht sofort, wer auf dich wartet." },
  { k: "verlauf", n: "Verlauf", why: "Der Verlauf genau dieser Session als kleiner Graph: Schritte, Helfer als Seitenäste. Enter auf einem älteren Schritt zweigt dort ab, wie ein eingebautes /rewind." },
  { k: "files", n: "Dateien", why: "Projektbaum mit dem, was Claude gerade anfasst: orange = gerade offen, gelb = geändert, grün = neu. So siehst du ohne git status, wo es arbeitet." },
  { k: "live", n: "Alle live", why: "Der Agenten-Graph im Kleinen: alle Projekte und Agenten, auch die ohne offenes Terminal. Für den Orca-Blick über alles." },
];
const RIGHT = [
  { k: "off", n: "Aus", why: "Volle Breite fürs Terminal." },
  { k: "now", n: "Gerade", why: "Was Claude in diesem Moment tut: Werkzeug, seit wann, welche Dateien, welche Helfer. Gut, wenn der Text im Terminal zu schnell durchläuft." },
  { k: "diff", n: "Änderung", why: "Die letzte Änderung als Diff, ohne den Editor zu öffnen. j / k blättert durch alle Änderungen dieser Session." },
  { k: "task", n: "Auftrag", why: "Die Notiz oder Anforderung, mit der die Session gestartet wurde, als Checkliste. Erledigte Punkte hakt die App ab, wenn Claude sie meldet." },
  { k: "verify", n: "Prüfungen", why: "Tests, Typecheck und Lint dieses Projekts mit Ergebnis vom letzten Lauf. Ein Tastendruck startet einen Loop bis alles grün ist." },
  { k: "queue", n: "Warteschlange", why: "Prompts, die du schon vorbereitest, während Claude noch arbeitet. Sobald es fertig ist, geht der nächste automatisch raus." },
  { k: "limits", n: "Limits", why: "5-Stunden-Fenster, Woche, Kosten dieser Session und heute. Der kleine Claude wohnt hier." },
];
const PRESETS = [["Orca-Blick", "agents", "now"], ["Fokus", "off", "off"], ["Review", "verlauf", "diff"], ["Auftrag", "files", "task"], ["Bis grün", "agents", "verify"]];
const S = { L: 1, R: 1, tab: 0, row: "L" };
const p = new URLSearchParams(location.search); if (p.get("l")) S.L = Math.max(0, LEFT.findIndex((x) => x.k === p.get("l"))); if (p.get("r")) S.R = Math.max(0, RIGHT.findIndex((x) => x.k === p.get("r")));
const $ = (id) => document.getElementById(id);

const termTxt = () => ({
  run: `<span class="o">✻</span> Welcome to <b>Claude Code</b>\n\n<span class="d">&gt;</span> Mach die Tests grün\n\n<span class="g">⏺</span> Ich schaue mir zuerst die fehlschlagenden Tests an.\n\n<span class="g">⏺</span> <b>Bash</b>(bun test search)\n  <span class="d">⎿  3 fail · 9 pass</span>\n\n<span class="g">⏺</span> Die Umlaute werden nicht normalisiert.\n\n<span class="b">⏺</span> <b>Update</b>(src/search/normalize.ts)\n  <span class="d">⎿  Updated with 4 additions</span>\n\n<span class="o">✶ Wird geprüft…</span> <span class="m">(12s · esc zum Abbrechen)</span>\n\n<span class="box"><span class="d">&gt;</span> <span class="cur"></span>                                             </span>\n<span class="m">  ⏵⏵ accept edits on (shift+tab)</span>`,
  wait: `<span class="g">⏺</span> Die Sounds liegen jetzt in assets/sfx.\n\n  Soll ich die alten Sounds in assets/old löschen?\n\n<span class="box"><span class="d">&gt;</span> <span class="cur"></span>                                             </span>`,
  err: `<span class="g">⏺</span> <b>Bash</b>(bun test)\n  <span class="d">⎿</span>  <span class="r">3 failed</span>\n\n<span class="box"><span class="d">&gt;</span> <span class="cur"></span>                                             </span>`,
})[TABS[S.tab].st] || "";

const panels = {
  agents: () => `${TABS.map((t, i) => `<div class="it ${i === S.tab ? "on" : ""}" style="--h:${t.h}"><span class="av">${i + 1}</span><span style="min-width:0"><span class="nm">${t.name}</span><small>${t.pj} · ${{ run: "arbeitet", wait: "wartet auf dich", err: "Fehler" }[t.st]}</small></span><span class="dot ${t.st}"></span></div>${t.helpers.length ? `<div class="sub">${t.helpers.map((h) => `<span>↳ ${h}</span>`).join("")}</div>` : ""}`).join("")}
    <div class="it" style="color:var(--gr)"><span class="av" style="background:var(--p2);color:var(--gr)">+</span><span>neues Terminal</span><kbd>⌘T</kbd></div>`,
  verlauf: () => [["Zeig mir zwei Layout-Varianten", "13:37"], ["Refactor in kleinere Funktionen", "13:45"], ["h", "Sucher: Aufrufe finden"], ["Übersichtlicher machen", "13:52"], ["Tests für die Suche", "14:10"], ["h", "Allrounder: Tests schreiben"], ["Mach die Tests grün", "14:18", 1]]
    .map(([a, b, now], i) => a === "h" ? `<div class="vl h"><i></i><span>${b}</span><em></em></div>` : `<div class="vl ${now ? "now" : ""}"><i></i><span>${a}</span><em>${b}</em></div>`).join("")
    + `<div class="keys" style="color:var(--gr);font-size:10.5px;margin-top:auto"><kbd>Enter</kbd> ab hier abzweigen</div>`,
  files: () => `<div class="tree"><span class="dir">▾ rezept-app</span><span class="dir">&nbsp;&nbsp;▾ src/search</span><span class="live">&nbsp;&nbsp;&nbsp;&nbsp;● normalize.ts</span><span class="m">&nbsp;&nbsp;&nbsp;&nbsp;M useRecipeSearch.ts</span><span class="a">&nbsp;&nbsp;&nbsp;&nbsp;A search.test.ts</span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;api.ts</span><span class="dir">&nbsp;&nbsp;▸ src/components</span><span class="m">&nbsp;&nbsp;&nbsp;&nbsp;M RecipeCard.tsx</span><span class="dir">&nbsp;&nbsp;▸ public</span><span>&nbsp;&nbsp;&nbsp;&nbsp;package.json</span><span>&nbsp;&nbsp;&nbsp;&nbsp;README.md</span></div>
    <div class="card" style="font-size:11px">3 geändert · 1 neu · <b>+48 −12</b></div>`,
  live: () => `<div class="mini"><svg viewBox="0 0 260 190"><path d="M70,30 C110,30 110,30 150,30 M70,80 C110,80 110,70 150,70 M70,130 C110,130 110,120 150,120 M200,70 C215,70 215,100 230,100" stroke="#3a3e41" stroke-width="1.5" fill="none"/></svg>
    <span class="n" style="left:28%;top:16%">game-jam</span><span class="n" style="left:72%;top:16%"><span class="dot wait"></span>Sounds</span>
    <span class="n" style="left:28%;top:42%">rezept-app</span><span class="n on" style="left:72%;top:37%"><span class="dot run"></span>Suche</span>
    <span class="n" style="left:28%;top:68%">haushalt</span><span class="n" style="left:72%;top:63%"><span class="dot err"></span>PDF</span>
    <span class="n" style="left:86%;top:53%;color:var(--pu)">Allr.</span><span class="n" style="left:50%;top:90%;color:var(--gr)">2 ohne Terminal</span></div>
    <div class="card" style="font-size:11px"><span class="dot run"></span> 2 arbeiten · <span class="dot wait"></span> 1 wartet · <span class="dot err"></span> 1 Fehler</div>`,
  now: () => `<div class="card"><span class="dot run"></span> <b>Bash</b> bun test search<div style="color:var(--gr);font-size:11px;margin-top:4px">seit 12 s · Schritt 14</div></div>
    <div><div class="lbl">Dateien gerade</div><div class="tree" style="margin-top:4px"><span class="live">● src/search/normalize.ts</span><span class="m">M src/search/search.test.ts</span></div></div>
    <div><div class="lbl">Helfer</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px"><span class="chip ag">● Allrounder, arbeitet</span></div></div>
    <div><div class="lbl">Zuletzt</div><div class="tree" style="margin-top:4px"><span>Update normalize.ts <em style="color:var(--gn);font-style:normal">+4</em></span><span>Bash bun test search <em style="color:var(--rd);font-style:normal">3 fail</em></span><span>Read search.test.ts</span></div></div>`,
  diff: () => `<div class="diff"><div class="h">src/search/normalize.ts · 2/5</div><div class="ctx">  export function normalize(s) {</div><div class="del">-   return s.toLowerCase();</div><div class="add">+   return s</div><div class="add">+     .normalize("NFD")</div><div class="add">+     .replace(/\\p{M}/gu, "")</div><div class="add">+     .toLowerCase();</div><div class="ctx">  }</div></div>
    <div style="color:var(--gr);font-size:10.5px"><kbd>j</kbd><kbd>k</kbd> nächste Änderung · <kbd>o</kbd> im Editor</div>`,
  task: () => `<div class="card"><div class="lbl">Notiz: suche.md</div><div style="margin-top:6px;color:var(--fg)">Suche soll Tippfehler und Umlaute verzeihen</div></div>
    <div class="chk ok"><b>✓</b>Suche findet „Musli“ bei „Müsli“</div><div class="chk ok"><b>✓</b>Zutaten werden mit durchsucht</div><div class="chk now"><b></b>Tests für Tippfehler grün</div><div class="chk"><b></b>Auf dem Handy prüfen</div>
    <div style="color:var(--gr);font-size:10.5px;margin-top:auto">2 von 4 erledigt · <kbd>a</kbd> Punkt an Claude geben</div>`,
  verify: () => `<div class="vf r"><span class="dot err"></span>bun test<span class="sp"></span><span style="color:var(--rd)">3 rot</span></div><div class="vf g"><span class="dot" style="--c:var(--gn)"></span>tsc --noEmit<span class="sp"></span><span style="color:var(--gn)">grün</span></div><div class="vf g"><span class="dot" style="--c:var(--gn)"></span>bun run lint<span class="sp"></span><span style="color:var(--gn)">grün</span></div>
    <div class="card" style="font-size:11px">✗ findet „Müsli“ bei Suche nach „musli“<br><span style="color:var(--gr)">expected 1 result, got 0</span></div>
    <button style="padding:8px;border-radius:8px;background:var(--ac);color:#1a0f0a;font-weight:800">⟳ Loop bis grün <kbd style="color:#1a0f0a">L</kbd></button>`,
  queue: () => `<div class="q"><b>1</b>Danach: Commit schreiben und kurz erklären</div><div class="q"><b>2</b>Prüf, ob das auf dem Handy gut aussieht</div><div class="q" style="border-style:dashed;color:var(--gr)"><b>+</b>neuer Prompt <kbd>i</kbd></div>
    <div style="color:var(--gr);font-size:10.5px">Geht automatisch raus, sobald Claude fertig ist und keine Frage offen hat.</div>`,
  limits: () => `<div><div style="display:flex;justify-content:space-between"><span>5-Stunden-Fenster</span><b style="color:var(--fg)">38 %</b></div><div class="bar2"><i style="width:38%"></i></div><div style="color:var(--gr);font-size:10.5px">Reset 17:15 · in 1 h 37 min</div></div>
    <div><div style="display:flex;justify-content:space-between"><span>Woche</span><b style="color:var(--fg)">61 %</b></div><div class="bar2"><i style="width:61%;background:var(--wt)"></i></div></div>
    <div class="card" style="font-size:11px;display:flex;justify-content:space-between"><span>Diese Session</span><b>$5.88</b></div><div class="card" style="font-size:11px;display:flex;justify-content:space-between"><span>Heute</span><b>$10.53</b></div>
    <div style="margin-top:auto;display:flex;align-items:flex-end;gap:8px;color:var(--fg4);font-size:11px">${MASCOT}<span>Passt. Du kannst noch locker weiterarbeiten.</span></div>`,
};
function side(cls, def) {
  if (def.k === "off") return "";
  return `<aside class="side ${cls}"><div class="sh">${def.n}<span class="sp"></span><kbd>${cls === "l" ? "⌘B" : "⌘⇧B"}</kbd></div><div class="sb">${panels[def.k]()}</div></aside>`;
}
function render() {
  const L = LEFT[S.L], R = RIGHT[S.R], t = TABS[S.tab];
  $("screen").innerHTML = `<div class="tbar"><span class="wm">ATLAS</span>${TABS.map((x, i) => `<span class="tt ${i === S.tab ? "on" : ""}"><span class="num">${i + 1}</span><span class="dot ${x.st}"></span>${x.name.length > 20 ? x.name.slice(0, 19) + "…" : x.name}</span>`).join("")}</div>
    <div class="row3">${side("l", L)}<div class="term"><div class="tx">${termTxt()}</div></div>${side("r", R)}</div>
    <div class="sl"><span class="m">TERMINAL</span><span class="b">${t.pj}</span><span class="c">Links: ${L.n} · Rechts: ${R.n}</span><span class="y">${S.tab + 1}/${TABS.length}</span></div>`;
  $("why").innerHTML = `<div><b>Links · ${L.n}:</b> ${L.why}</div><div><b>Rechts · ${R.n}:</b> ${R.why}</div>`;
  const row = (id, label, list, cur) => `<div class="ln ${S.row === id ? "on" : ""}"><span>${label}</span>${list.map((x, i) => `<button data-row="${id}" data-i="${i}" class="${i === cur ? "on" : ""}">${i} ${x.n}</button>`).join("")}</div>`;
  $("pick").innerHTML = row("L", "Links", LEFT, S.L) + row("R", "Rechts", RIGHT, S.R)
    + `<div class="ln"><span>Vorlagen</span>${PRESETS.map((x, i) => `<button data-preset="${i}" class="${LEFT[S.L].k === x[1] && RIGHT[S.R].k === x[2] ? "on" : ""}">${["q", "w", "e", "r", "t"][i]} ${x[0]}</button>`).join("")}</div>
    <div class="hint"><span><kbd>↑</kbd><kbd>↓</kbd> Links / Rechts wählen</span><span><kbd>←</kbd><kbd>→</kbd> oder <kbd>0</kbd>-<kbd>6</kbd> Spalte wechseln</span><span><kbd>q</kbd>-<kbd>t</kbd> Vorlage</span><span><kbd>⌘1</kbd>-<kbd>4</kbd> / <kbd>gt</kbd> Terminal</span></div>`;
  const u = new URL(location); u.searchParams.set("l", L.k); u.searchParams.set("r", R.k); history.replaceState(null, "", u);
}
function preset(i) { const [, l, r] = PRESETS[i]; S.L = LEFT.findIndex((x) => x.k === l); S.R = RIGHT.findIndex((x) => x.k === r); render(); }
$("pick").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.preset) return preset(+b.dataset.preset); S.row = b.dataset.row; S[S.row] = +b.dataset.i; render(); });
let g = false;
document.addEventListener("keydown", (e) => {
  const k = e.key, list = S.row === "L" ? LEFT : RIGHT;
  if (e.metaKey && /^[1-4]$/.test(k)) { e.preventDefault(); S.tab = +k - 1; return render(); }
  if (g) { g = false; if (k === "t" || k === "T") { S.tab = (S.tab + (k === "t" ? 1 : TABS.length - 1)) % TABS.length; return render(); } }
  if (k === "g") { g = true; return; }
  if (k === "ArrowUp" || k === "ArrowDown") { e.preventDefault(); S.row = S.row === "L" ? "R" : "L"; }
  else if (k === "ArrowRight" || k === "l") S[S.row] = (S[S.row] + 1) % list.length;
  else if (k === "ArrowLeft" || k === "h") S[S.row] = (S[S.row] + list.length - 1) % list.length;
  else if (/^[0-6]$/.test(k) && +k < list.length) S[S.row] = +k;
  else if ("qwert".includes(k) && k) return preset("qwert".indexOf(k));
  else return;
  render();
});
render();
</script>
</body>
