<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Atlas Mix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#1d2021; --bg:#282828; --bg1:#32302f; --bg2:#3c3836; --bg3:#504945; --bg4:#665c54;
  --fg:#ebdbb2; --fg2:#d5c4a1; --fg3:#bdae93; --fg4:#a89984; --gr:#928374;
  --re:#fb4934; --gn:#b8bb26; --ye:#fabd2f; --bl:#83a598; --pu:#d3869b; --aq:#8ec07c; --or:#fe8019;
  --run:#8ec07c; --wait:#fabd2f; --done:#83a598; --err:#fb4934;
  --mono:"JetBrains Mono", Menlo, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:#0e0f10; color:var(--fg2); font:500 12px/1.45 var(--mono); padding:14px; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:left; }
textarea { font:inherit; color:inherit; background:none; border:0; outline:0; resize:none; }
kbd { font:700 10px var(--mono); color:var(--fg4); background:rgba(235,219,178,.06); border:1px solid rgba(235,219,178,.16); border-bottom-width:2px; border-radius:4px; padding:0 4px; }
.dim { color:var(--gr); } .ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; } .sp { flex:1; }

.win { position:relative; height:100%; min-height:640px; border-radius:12px; overflow:hidden; background:var(--bg0); box-shadow:0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.55); display:flex; flex-direction:column; }
#wires { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:20; overflow:visible; }

/* top bar: views + agent chips */
.top { height:32px; display:flex; align-items:stretch; background:#161819; border-bottom:1px solid #0c0d0d; flex:none; font-size:11.5px; }
.vt { display:flex; align-items:center; gap:7px; padding:0 14px; color:var(--gr); border-right:1px solid #0c0d0d; }
.vt kbd { padding:0 4px; }
.vt.on { background:var(--bg0); color:var(--fg); }
.vt.on kbd { background:var(--ye); color:var(--bg0); border-color:var(--ye); }
.agchips { display:flex; align-items:center; gap:4px; padding:0 10px; overflow:hidden; }
.agc { display:flex; align-items:center; gap:6px; padding:2px 9px; border-radius:20px; background:#222425; color:var(--fg3); white-space:nowrap; }
.agc.wait { background:rgba(250,189,47,.12); color:var(--fg); }

.view { flex:1; min-height:0; display:none; flex-direction:column; }
.view.on { display:flex; }

/* status dot, tool tag, bars */
.st { width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; background:var(--c); }
.st.run { --c:var(--run); animation:ping 1.6s ease-out infinite; }
.st.wait { --c:var(--wait); animation:blink 1s steps(2) infinite; }
.st.done { --c:var(--done); } .st.err { --c:var(--err); }
@keyframes ping { 0% { box-shadow:0 0 0 0 rgba(142,192,124,.55); } 100% { box-shadow:0 0 0 7px rgba(142,192,124,0); } }
@keyframes blink { 50% { opacity:.25; } }
.tool { font-weight:700; padding:0 5px; border-radius:3px; font-size:10.5px; color:var(--bg0); background:var(--tc); flex:none; }
.bar { height:3px; border-radius:2px; background:var(--bg2); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--c, var(--run)); transition:width 1.4s ease; }
.feed { overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:3px; font-size:11.5px; }
.feed div { flex:none; animation:fin .35s ease both; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.feed .o { color:var(--gr); padding-left:14px; }
@keyframes fin { from { opacity:0; transform:translateY(6px); } }

/* statusline */
.sl { height:22px; display:flex; background:var(--bg); font-size:11px; flex:none; }
.sl > span { display:flex; align-items:center; padding:0 12px; white-space:nowrap; gap:6px; }
.sl .m { background:var(--ye); color:var(--bg0); font-weight:800; }
.sl .b { background:var(--bg2); }
.sl .c { flex:1; color:var(--fg3); min-width:0; overflow:hidden; }
.sl .y { background:var(--bg2); }
.sl .z { background:var(--aq); color:var(--bg0); font-weight:800; }
.cl { height:20px; display:flex; align-items:center; gap:14px; padding:0 12px; font-size:11px; color:var(--gr); flex:none; }
.cl b { color:var(--fg3); font-weight:600; }

/* composer */
.cmp { display:flex; flex-direction:column; background:#202223; border:1px solid var(--bg2); border-radius:10px; min-height:0; overflow:hidden; transition:border-color .2s, box-shadow .2s; }
.cmp:focus-within { border-color:var(--ye); box-shadow:0 0 0 3px rgba(250,189,47,.12); }
.cmp-top { display:flex; align-items:center; gap:6px; padding:8px 10px 0; flex-wrap:wrap; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:20px; background:#2a2c2d; color:var(--fg3); font-size:11px; white-space:nowrap; }
.chip.to { background:#33352a; color:var(--fg); }
.cmp textarea { flex:1; min-height:56px; padding:9px 12px; color:var(--fg); font:500 13.5px/1.55 var(--mono); }
.cmp textarea::placeholder { color:var(--bg4); }
.cmp-ft { display:flex; align-items:center; gap:12px; padding:5px 10px 8px; font-size:10.5px; color:var(--gr); flex-wrap:wrap; }
.send { background:var(--ye); color:var(--bg0); font-weight:800; border-radius:7px; padding:4px 12px; font-size:12px; }

/* ================= DASHBOARD ================= */
.dash { flex:1; min-height:0; overflow:auto; padding:18px 26px 16px; scrollbar-width:thin; scrollbar-color:var(--bg2) transparent; }
.d-head { display:flex; align-items:center; gap:22px; justify-content:center; margin-bottom:16px; position:relative; }
.logo { position:relative; font:700 clamp(5px, .5vw, 8px)/.95 var(--mono); white-space:pre; letter-spacing:-.04em; }
.logo .sh { color:#3a3836; } .logo .fg { position:absolute; inset:0; }
.logo .fg .a { color:var(--ye); } .logo .fg .b { color:var(--or); }
.d-sub { color:var(--gr); font-style:italic; }
.d-sub b { color:var(--fg); font-style:normal; display:block; font-size:13px; }
.wbtn { position:absolute; right:0; top:0; border:1px solid var(--bg2); border-radius:6px; padding:3px 9px; color:var(--fg4); font-size:11px; }
.wbtn:hover { color:var(--fg); border-color:var(--bg3); }
.wpanel { position:absolute; right:0; top:28px; z-index:30; width:260px; background:#252728; border:1px solid var(--bg3); border-radius:9px; padding:10px; box-shadow:0 20px 50px rgba(0,0,0,.55); display:none; }
.wpanel.on { display:block; }
.wpanel .pr { display:flex; gap:6px; margin-bottom:8px; }
.wpanel .pr button { flex:1; text-align:center; border:1px solid var(--bg3); border-radius:6px; padding:3px 0; font-size:11px; color:var(--fg3); }
.wpanel .pr button:hover { border-color:var(--ye); color:var(--fg); }
.wpanel label { display:flex; align-items:center; gap:8px; padding:3px 4px; border-radius:4px; color:var(--fg3); cursor:pointer; font-size:11.5px; }
.wpanel label:hover { background:var(--bg1); }
.wpanel input { accent-color:var(--ye); }
.wpanel label small { margin-left:auto; color:var(--gr); }

.d-grid { display:grid; grid-template-columns:minmax(250px,.85fr) minmax(360px,1.25fr) minmax(320px,1fr); gap:20px 28px; max-width:1500px; margin:0 auto; align-items:start; }
.d-col { display:flex; flex-direction:column; gap:16px; min-width:0; }
.w { min-width:0; animation:up .45s cubic-bezier(.2,.9,.25,1) both; }
@keyframes up { from { opacity:0; transform:translateY(8px); } }
.wh { color:var(--gr); font-style:italic; font-size:11.5px; margin-bottom:6px; display:flex; gap:8px; align-items:baseline; white-space:nowrap; }
.wh b { font-style:normal; color:var(--fg3); font-weight:600; }
.wh .r { margin-left:auto; font-style:normal; }

/* menu as key grid */
.keys { display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; }
.key { display:flex; align-items:center; gap:8px; height:26px; padding:0 8px; border-radius:5px; color:var(--fg2); }
.key:hover, .key.on { background:var(--bg1); }
.key b { color:var(--c); width:12px; font-weight:800; }
.rc { display:grid; grid-template-columns:20px minmax(0,1fr) auto 32px; gap:8px; align-items:center; height:25px; padding:0 8px; border-radius:5px; }
.rc:hover, .rc.on { background:var(--bg1); }
.rc .k { color:var(--bl); font-weight:800; text-align:center; }
.rc .t { color:var(--fg2); } .rc .p { font-size:10.5px; } .rc .a { color:var(--bg4); font-size:10.5px; text-align:right; }
.dash .cmp { min-height:150px; }
.sugg { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.sugg button { border:1px solid var(--bg2); border-radius:20px; padding:2px 10px; color:var(--fg4); font-size:11px; }
.sugg button:hover { border-color:var(--ye); color:var(--fg); }
.ask { display:flex; align-items:center; gap:10px; padding:8px 11px; border-radius:8px; background:rgba(250,189,47,.07); border:1px solid rgba(250,189,47,.3); margin-bottom:6px; }
.ask .q { flex:1; min-width:0; color:var(--fg); }
.ask .q small { display:block; color:var(--gr); font-size:10.5px; }
.ask button { border:1px solid var(--bg3); border-radius:6px; padding:2px 9px; font-size:11px; }
.ask button.y { background:var(--ye); color:var(--bg0); border-color:var(--ye); font-weight:700; }
.ask.err { background:rgba(251,73,52,.06); border-color:rgba(251,73,52,.3); }

/* mini graph */
.mg { position:relative; height:230px; border:1px solid #2a2c2d; border-radius:9px; background:radial-gradient(circle at 1px 1px, #2a2c2d 1px, transparent 0) 0 0/18px 18px; }
.nd { position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:7px; padding:5px 9px; border-radius:7px; background:#232526; border:1px solid var(--bg2); white-space:nowrap; font-size:11px; box-shadow:0 6px 18px rgba(0,0,0,.35); }
.nd.p { border-color:color-mix(in srgb, var(--c) 55%, transparent); color:var(--c); font-weight:700; }
.nd.ag { flex-direction:column; align-items:stretch; gap:3px; min-width:150px; }
.nd.ag .h { display:flex; align-items:center; gap:6px; color:var(--fg); font-weight:600; }
.nd.ag .now { display:flex; gap:6px; align-items:center; color:var(--fg4); font-size:10.5px; }
.nd.on { border-color:var(--ye); }
.nd.f { font-size:10.5px; color:var(--fg3); padding:3px 8px; }
.nd.f.hot { color:var(--ye); border-color:rgba(250,189,47,.5); }

/* stats */
.tot { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.tot div { padding:7px 9px; border-radius:7px; background:color-mix(in srgb, var(--c) 8%, #1f2122); }
.tot b { display:block; font-size:19px; font-weight:800; color:var(--c); line-height:1.1; }
.tot small { color:var(--fg4); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; }
.spk { display:flex; gap:8px; align-items:flex-end; }
.spk-g { color:var(--ye); font-size:13px; line-height:1.05; letter-spacing:-.5px; }
.spk-g span { display:block; }
.spk-y { display:flex; flex-direction:column; justify-content:space-between; height:42px; color:var(--gr); font-size:10px; }
.spk-n { color:var(--gr); font-size:11px; margin-top:4px; } .spk-n b { color:var(--ye); }
.hm { display:grid; grid-template-columns:22px 1fr; gap:4px; font-size:10px; line-height:1.15; }
.hm-d { color:var(--gr); display:flex; flex-direction:column; }
.hm-c { white-space:pre; letter-spacing:-.5px; }
.pb { display:grid; grid-template-columns:110px 1fr 30px; gap:2px 8px; align-items:center; font-size:11.5px; }
.pb .b { color:var(--c); letter-spacing:-1px; white-space:nowrap; overflow:hidden; }
.pb .v { color:var(--fg4); text-align:right; }
.mb { display:flex; height:8px; border-radius:3px; overflow:hidden; }
.ml { display:flex; gap:12px; font-size:11px; color:var(--fg4); margin-top:5px; }
.tl { display:grid; grid-template-columns:96px 1fr; gap:4px 8px; align-items:center; font-size:11px; }
.tl .trk { position:relative; height:10px; background:#232526; border-radius:3px; }
.tl .trk i { position:absolute; top:0; bottom:0; border-radius:3px; background:var(--c); opacity:.8; }
.tl .now { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--re); }
.li { display:flex; align-items:center; gap:8px; height:23px; padding:0 6px; font-size:11.5px; color:var(--fg3); border-radius:5px; }
.li:hover { background:var(--bg1); }
.li .x { margin-left:auto; color:var(--gr); font-size:10.5px; }
.d-quote { text-align:center; color:var(--gr); font-style:italic; margin-top:18px; }

/* ================= GRAPH ================= */
.gr { flex:1; min-height:0; position:relative; background:radial-gradient(circle at 1px 1px, #2a2c2d 1px, transparent 0) 0 0/22px 22px, var(--bg0); }
.gr .colh { position:absolute; top:12px; font-size:10.5px; color:var(--gr); text-transform:uppercase; letter-spacing:.1em; }
.gr .nd { font-size:11.5px; padding:7px 11px; }
.gr .nd.ag { min-width:190px; }
.gr-side { position:absolute; right:12px; top:36px; width:300px; bottom:190px; background:rgba(26,28,29,.92); border:1px solid var(--bg2); border-radius:9px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; z-index:22; }
.gr-side h4 { white-space:nowrap; overflow:hidden; color:var(--fg); font-size:12px; display:flex; gap:7px; align-items:center; }
.gr-side .feed { flex:1; }
.dock { position:absolute; left:12px; right:12px; bottom:12px; height:166px; z-index:25; display:flex; }
.dock .cmp { flex:1; background:rgba(32,34,35,.97); box-shadow:0 20px 60px rgba(0,0,0,.6); }

/* ================= EDITOR (vereinfacht) ================= */
.ed { flex:1; min-height:0; display:grid; grid-template-columns:240px minmax(0,1fr) minmax(0,1.25fr); }
.ed > div { min-width:0; min-height:0; display:flex; flex-direction:column; border-right:1px solid #121314; }
.ed > div:last-child { border-right:0; }
.ph { height:26px; display:flex; align-items:center; gap:8px; padding:0 10px; font-size:11px; color:var(--gr); flex:none; border-bottom:1px solid #161718; }
.ph .n { background:var(--bg2); color:var(--fg3); border-radius:3px; padding:0 5px; font-weight:700; }
.ph.on .n { background:var(--ye); color:var(--bg0); }
.ph b { color:var(--fg3); font-weight:600; }
.rw { display:flex; align-items:center; gap:7px; height:24px; padding:0 10px; color:var(--fg3); font-size:12px; }
.rw.on { background:var(--bg1); color:var(--fg); }
.rw.pj { color:var(--c); font-weight:600; margin-top:4px; }
.rw .ln { color:var(--bg4); width:18px; text-align:right; flex:none; }
.rw.on .ln { color:var(--ye); }
.rw .x { margin-left:auto; color:var(--gr); font-size:10.5px; flex:none; }
.pv { padding:12px 16px; overflow:hidden; flex:1; min-height:0; display:flex; flex-direction:column; }
.pv h3 { color:var(--or); font-size:13px; }
.pv .m { color:var(--gr); font-size:11px; margin:2px 0 10px; }
.pv .h { color:var(--ye); margin:10px 0 3px; font-size:11.5px; } .pv .h.a { color:var(--aq); }
.pv p { color:var(--fg2); }
.ed .cmp { margin:0 10px 10px; flex:none; height:190px; }

@media (max-width:1000px) {
  .d-grid { grid-template-columns:1fr; } .ed { grid-template-columns:1fr; } .ed > div:not(:last-child) { display:none; }
  .gr-side { display:none; } .agchips { display:none; }
}
</style>
</head>
<body>
<div class="win" id="win"><svg id="wires"></svg>
  <div class="top"><button class="vt" data-view="dash"><kbd>d</kbd> Dashboard</button><button class="vt" data-view="graph"><kbd>g</kbd> Agenten-Graph</button><button class="vt" data-view="ed"><kbd>e</kbd> Editor</button>
    <span class="sp"></span><div class="agchips" id="agchips"></div></div>
  <div class="view" id="v-dash"></div>
  <div class="view" id="v-graph"></div>
  <div class="view" id="v-ed"></div>
  <div class="sl" id="sl"></div>
  <div class="cl"><span><kbd>d</kbd> <kbd>g</kbd> <kbd>e</kbd> Ansicht</span><span><kbd>i</kbd> Prompt</span><span><kbd>Space</kbd> Befehle</span><span class="sp"></span><span>Prototyp · Daten sind Beispiele</span></div>
</div>

<script>
/* ---------------- data ---------------- */
const PROJ = { "rezept-app":"#fabd2f", "dotfiles":"#fe8019", "game-jam-2026":"#d3869b", "haushaltsbuch":"#b8bb26", "wetterstation":"#83a598", "portfolio-site":"#b16286", "ki-notizen":"#d79921", "fahrrad-tracker":"#8ec07c" };
const TC = { Read:"#83a598", Edit:"#fabd2f", Bash:"#b8bb26", Write:"#fe8019", Grep:"#d3869b", Denkt:"#928374" };
const A = [
  { id:"a1", name:"Suche-Refactor", proj:"rezept-app", br:"feat/suche", st:"run", prog:62, t:"12m", cost:"$5.88",
    tools:[["Read","src/search/trigram.ts","84 Zeilen"],["Edit","src/search/index.ts","+12 -3"],["Bash","bun test search","23 bestanden, 1 fehlgeschlagen"],["Denkt","Der Mock liefert ein leeres Array",""],["Edit","tests/fixtures.ts","+4 -1"],["Bash","bun test search","24 bestanden"]] },
  { id:"a1s", parent:"a1", name:"Tests schreiben", proj:"rezept-app", br:"feat/suche", st:"run", prog:30, t:"4m", cost:"$0.41",
    tools:[["Write","tests/search.test.ts","neu, 42 Zeilen"],["Bash","bun test","läuft …"],["Grep","\"describe(\"","6 Treffer"]] },
  { id:"a2", name:"Soundeffekte", proj:"game-jam-2026", br:"main", st:"wait", prog:80, t:"3h", cost:"$1.20", ask:"Soll ich die alten Sounds in /assets/old löschen?", tools:[["Denkt","wartet auf dich",""]] },
  { id:"a3", name:"Setup-Skript", proj:"dotfiles", br:"main", st:"run", prog:45, t:"7m", cost:"$2.10",
    tools:[["Bash","brew bundle --file Brewfile","Ghostty installiert"],["Edit","Brewfile","+2"],["Read","setup.sh","120 Zeilen"],["Bash","shellcheck setup.sh","ok"]] },
  { id:"a5", name:"MQTT Sensoren", proj:"wetterstation", br:"feat/mqtt", st:"err", prog:55, t:"20m", cost:"$0.64", tools:[["Bash","npm test","3 fehlgeschlagen"]] },
];
const SESS = [["Volltextsuche für Rezepte","rezept-app","12m"],["Soundeffekte einbauen","game-jam-2026","3h"],["Setup-Skript für neuen Mac","dotfiles","7h"],["Monatsbericht als PDF","haushaltsbuch","10h"],["Neovim-Config aufräumen","dotfiles","14h"],["Zutatenliste als Einkaufszettel","rezept-app","17h"]];
const STEPS = [["Warum schlägt der Test fehl?","Der Mock gab ein leeres Array zurück, jetzt mit echten Fixtures."],["Schreib einen Commit","Commit „Fuzzy-Suche mit Trigrammen“ angelegt."],["Das sieht noch nicht gut aus","Abstände vereinheitlicht, Trefferliste auf 8 begrenzt."],["Zeig mir zwei Varianten","Zwei Layouts angelegt und in der README verlinkt."],["Bau die Tippfehler-Suche ein","arbeitet gerade …"]];
const days = [3,0,5,8,2,0,0,4,9,12,6,1,0,0,7,11,4,3,0,0,2,6,9,14,8,0,0,13,27,41];
const c = (p) => PROJ[p] || "#a89984";
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const st = (s) => `<span class="st ${s}"></span>`;
const tool = (a, i = 0) => { const t = a.tools[i % a.tools.length]; return `<span class="tool" style="--tc:${TC[t[0]]}">${t[0]}</span><span class="ell">${esc(t[1])}</span>`; };
const nowEl = (a) => `<span class="now" data-tool="${a.id}">${tool(a)}</span>`;
const bar = (a) => `<div class="bar" style="--c:var(--${a.st})"><i data-prog="${a.id}" style="width:${a.prog}%"></i></div>`;
const composer = (o = {}) => `<div class="cmp" ${o.w ? `data-w="${o.w}"` : ""}>
  <div class="cmp-top"><span class="chip to">an ${st(o.st || "run")} ${o.to || "Suche-Refactor"} ▾</span><span class="chip">Plan</span><span class="chip">Opus 5.5</span><span class="chip">+ Notiz</span><span class="chip">@ Datei</span></div>
  <textarea placeholder="${o.ph || "Was soll der Agent als Nächstes tun?  @datei  /befehl  #notiz"}"></textarea>
  <div class="cmp-ft"><span><kbd>⌘↵</kbd> senden</span><span><kbd>⌘⇧↵</kbd> an alle</span><span><kbd>Tab</kbd> Agent wechseln</span><span class="sp"></span><button class="send">${o.btn || "Senden ↵"}</button></div></div>`;

/* ---------------- top chips ---------------- */
document.getElementById("agchips").innerHTML = A.map((a) => `<span class="agc ${a.st}">${st(a.st)}${a.name}</span>`).join("");

const FONT = {

function drawWires() {
  const Wr = win.getBoundingClientRect(); let out = "";
  for (const [a, b, col, live] of currentWires()) {
    const ea = win.querySelector(`.view.on [data-w="${a}"]`), eb = win.querySelector(`.view.on [data-w="${b}"]`); if (!ea || !eb) continue;
    const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect(); if (!ra.width || !rb.width || ra.bottom < Wr.top || ra.top > Wr.bottom) continue;
    let x1, y1, x2, y2, d;
    if (rb.left >= ra.right - 6 || rb.right <= ra.left + 6) {
      const right = rb.left >= ra.right - 6;
      x1 = (right ? ra.right : ra.left) - Wr.left; y1 = ra.top + ra.height / 2 - Wr.top; x2 = (right ? rb.left : rb.right) - Wr.left; y2 = rb.top + rb.height / 2 - Wr.top;
      const k = Math.max(24, Math.abs(x2 - x1) / 2) * (right ? 1 : -1); d = `M${x1},${y1} C${x1 + k},${y1} ${x2 - k},${y2} ${x2},${y2}`;
    } else {
      const down = rb.top > ra.top; x1 = ra.left + Math.min(ra.width / 2, 60) - Wr.left; x2 = rb.left + Math.min(rb.width / 2, 60) - Wr.left;
      y1 = (down ? ra.bottom : ra.top) - Wr.top; y2 = (down ? rb.top : rb.bottom) - Wr.top;
      const k = Math.max(18, Math.abs(y2 - y1) / 2) * (down ? 1 : -1); d = `M${x1},${y1} C${x1},${y1 + k} ${x2},${y2 - k} ${x2},${y2}`;
    }
    out += `<path d="${d}" fill="none" stroke="${col}" stroke-opacity=".5" stroke-width="1.5"/>`;
    if (live === 2) out += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2"><animate attributeName="stroke-opacity" values=".9;.1;.9" dur="1s" repeatCount="indefinite"/></path>`;
    else if (live) out += `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 9"><animate attributeName="stroke-dashoffset" from="24" to="0" dur=".9s" repeatCount="indefinite"/></path><circle r="3" fill="${col}"><animateMotion dur="2.2s" repeatCount="indefinite" path="${d}"/></circle>`;
    out += `<circle cx="${x1}" cy="${y1}" r="3" fill="#1d2021" stroke="${col}" stroke-width="1.5"/><circle cx="${x2}" cy="${y2}" r="3" fill="#1d2021" stroke="${col}" stroke-width="1.5"/>`;
  }
  svg.innerHTML = out;
}

  document.querySelectorAll("[data-tool]").forEach((el) => { const a = A.find((q) => q.id === el.dataset.tool); if (a.st === "run") el.innerHTML = tool(a, tick); });
  document.querySelectorAll(".view.on [data-feed]").forEach((f) => { const a = A.find((q) => q.id === f.dataset.feed); if (a.st !== "run") return; f.insertAdjacentHTML("beforeend", feedLine(a)); while (f.children.length > 30) f.firstChild.remove(); });
  document.querySelectorAll("[data-prog]").forEach((el) => { const a = A.find((q) => q.id === el.dataset.prog); if (a.st === "run") { a.prog = a.prog >= 96 ? 20 : a.prog + 2; el.style.width = a.prog + "%"; } });
}, 1600);

/* ---------------- view switching ---------------- */
const SL = { dash:["NORMAL","atlas","dashboard","26 Sessions"], graph:["GRAPH","atlas","Agenten-Graph · 5 Agenten","Klick wählt Agent"], ed:["NORMAL","feat/suche","rezept-app / Suche-Refactor","Opus 5.5 · $5.88"] };
function setView(v) {
  view = v;
  document.querySelectorAll(".vt").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  document.querySelectorAll(".view").forEach((el) => el.classList.toggle("on", el.id === "v-" + v));
  ({ dash:renderDash, graph:renderGraph, ed:renderEd })[v]();
  const [m, b, cc, y] = SL[v];
  document.getElementById("sl").innerHTML = `<span class="m">${m}</span><span class="b">${b}</span><span class="c">${cc}</span><span class="y">${y}</span><span class="z">${st("run")} 3 laufen · 1 wartet</span>`;
  requestAnimationFrame(() => requestAnimationFrame(drawWires));
  try { localStorage.setItem("mix.view", v); } catch {}
}
document.querySelectorAll(".vt").forEach((b) => b.onclick = () => setView(b.dataset.view));
addEventListener("keydown", (e) => {
  if (/INPUT|TEXTAREA/.test(e.target.tagName)) { if (e.key === "Escape") e.target.blur(); return; }
  const map = { d:"dash", g:"graph", e:"ed", 1:"dash", 2:"graph", 3:"ed" };
  if (map[e.key]) return setView(map[e.key]);
  if (e.key === "i") { const t = document.querySelector(".view.on textarea"); if (t) { e.preventDefault(); t.focus(); } }
});
document.fonts?.ready.then(drawWires);
let startV = "dash"; try { startV = localStorage.getItem("mix.view") || "dash"; } catch {}
setView(["dash","graph","ed"].includes(startV) ? startV : "dash");
</script>
