<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideen Session Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#1d2021; --bg:#282828; --bg1:#32302f; --bg2:#3c3836; --bg3:#504945; --bg4:#665c54;
  --fg:#ebdbb2; --fg2:#d5c4a1; --fg3:#bdae93; --fg4:#a89984; --gr:#928374;
  --re:#fb4934; --gn:#b8bb26; --ye:#fabd2f; --bl:#83a598; --pu:#d3869b; --aq:#8ec07c; --or:#fe8019;
  --mono:"JetBrains Mono", Menlo, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#111213; color:var(--fg2); font:500 12.5px/1.5 var(--mono); padding:22px 16px 40px; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
kbd { font:700 10px var(--mono); color:var(--fg4); background:rgba(235,219,178,.06); border:1px solid rgba(235,219,178,.16); border-bottom-width:2px; border-radius:4px; padding:0 4px; }
.wrap { max-width:1320px; margin:0 auto; }
h1 { color:var(--fg); font-size:17px; }
.lead { color:var(--gr); margin:4px 0 16px; max-width:820px; }
.filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
.filters button { padding:4px 11px; border-radius:20px; border:1px solid #2a2c2d; color:var(--fg4); }
.filters button.on { background:var(--ye); color:var(--bg0); border-color:var(--ye); font-weight:700; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:14px; }
.card { background:var(--bg0); border:1px solid #2a2c2d; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
.card.pick { border-color:var(--ye); box-shadow:0 0 0 3px rgba(250,189,47,.12); }
.mock { height:190px; background:#191b1c; border-bottom:1px solid #2a2c2d; position:relative; overflow:hidden; padding:14px; font-size:11.5px; }
.body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
.body h3 { color:var(--fg); font-size:13.5px; display:flex; align-items:center; gap:8px; }
.body h3 .n { color:var(--bg0); background:var(--ye); border-radius:4px; padding:0 6px; font-size:11px; }
.body p { color:var(--fg3); }
.tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:6px; }
.tag { font-size:10.5px; padding:1px 8px; border-radius:20px; background:#26282a; color:var(--fg4); }
.tag.e1 { color:var(--aq); } .tag.e2 { color:var(--ye); } .tag.e3 { color:var(--or); }
.tag.d { color:var(--bl); }
.want { margin-left:auto; border:1px solid var(--bg3); border-radius:6px; padding:2px 10px; font-size:11px; color:var(--fg3); }
.card.pick .want { background:var(--ye); color:var(--bg0); border-color:var(--ye); font-weight:700; }
.summary { position:sticky; bottom:12px; margin:22px auto 0; max-width:1320px; background:#252728; border:1px solid var(--bg3); border-radius:10px; padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; box-shadow:0 18px 50px rgba(0,0,0,.5); }
.summary[hidden] { display:none; }
.summary b { color:var(--fg); } .summary .list { color:var(--fg3); flex:1; min-width:200px; }
.summary button { background:var(--ye); color:var(--bg0); font-weight:800; border-radius:7px; padding:5px 12px; }

/* shared mock bits */
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; background:var(--c, var(--gr)); }
.run { --c:var(--aq); } .wait { --c:var(--ye); } .err { --c:var(--re); }
.row { display:flex; align-items:center; gap:8px; height:22px; }
.dim { color:var(--gr); } .ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.tg { font-weight:700; padding:0 5px; border-radius:3px; font-size:10px; color:var(--bg0); background:var(--tc); }
.btn { border:1px solid var(--bg3); border-radius:5px; padding:1px 8px; font-size:10.5px; color:var(--fg2); }
.btn.y { background:var(--ye); color:var(--bg0); border-color:var(--ye); font-weight:700; }
.bar { height:6px; border-radius:3px; background:var(--bg2); overflow:hidden; } .bar i { display:block; height:100%; background:var(--c); }
.win { background:var(--bg0); border:1px solid var(--bg2); border-radius:8px; padding:8px 10px; }
.mh { color:var(--gr); font-style:italic; margin-bottom:6px; } .mh b { color:var(--fg3); font-style:normal; }

/* 1 notification */
.notif { position:absolute; right:14px; top:14px; width:250px; background:rgba(50,48,47,.96); border-radius:12px; padding:10px 12px; box-shadow:0 12px 30px rgba(0,0,0,.5); font-family:-apple-system, system-ui, sans-serif; font-size:12px; color:#eee; animation:drop 3s ease-in-out infinite; }
.notif b { display:block; font-size:12.5px; } .notif small { color:#aaa; }
@keyframes drop { 0%,10% { transform:translateY(-130%); opacity:0; } 22%,80% { transform:none; opacity:1; } 92%,100% { transform:translateY(-130%); opacity:0; } }
.menubar { position:absolute; left:0; right:0; top:0; height:22px; background:#2a2a2a; display:flex; justify-content:flex-end; align-items:center; gap:12px; padding:0 12px; font-family:-apple-system, system-ui, sans-serif; font-size:11px; color:#ddd; }
.menubar .ic { display:flex; gap:4px; align-items:center; background:#3a3a3a; border-radius:4px; padding:1px 6px; }
.dd { position:absolute; right:60px; top:26px; width:220px; background:#2d2d2d; border-radius:8px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.5); font-family:-apple-system, system-ui, sans-serif; font-size:11.5px; color:#ddd; }
.dd div { display:flex; align-items:center; gap:7px; padding:3px 6px; border-radius:4px; } .dd div:first-child { background:#0a63d6; }
/* 2 scrubber */
.scrub { position:absolute; left:14px; right:14px; bottom:14px; }
.scrub .trk { position:relative; height:24px; display:flex; align-items:center; gap:3px; }
.scrub .trk i { flex:1; height:8px; border-radius:2px; background:var(--bg3); }
.scrub .trk i.p { background:var(--aq); opacity:.7; }
.scrub .knob { position:absolute; top:0; width:3px; height:24px; background:var(--ye); border-radius:2px; animation:slide 6s ease-in-out infinite alternate; }
@keyframes slide { from { left:10%; } to { left:85%; } }
.code div { white-space:pre; font-size:11px; } .ad { background:rgba(184,187,38,.12); color:#c7c96a; } .de { background:rgba(251,73,52,.1); color:#e3887d; }
/* 3 context */
.ctx { display:grid; grid-template-columns:150px 1fr 40px; gap:6px 10px; align-items:center; }
/* 5 treemap */
.tm { display:grid; grid-template-columns:3fr 2fr 1fr; grid-template-rows:1fr 1fr; gap:3px; height:100%; }
.tm div { border-radius:4px; padding:6px; font-size:10.5px; color:var(--bg0); font-weight:700; display:flex; flex-direction:column; justify-content:space-between; }
.tm div small { font-weight:500; opacity:.8; }
/* 6 fanout */
.fan { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
.fan .win { padding:6px 8px; font-size:10.5px; }
.fan .win.best { border-color:var(--ye); }
/* 9 palette */
.pal { position:absolute; left:50%; top:16px; transform:translateX(-50%); width:84%; background:#252728; border:1px solid var(--bg3); border-radius:9px; box-shadow:0 14px 40px rgba(0,0,0,.5); overflow:hidden; }
.pal .in { padding:7px 10px; border-bottom:1px solid var(--bg2); color:var(--fg); } .pal .in b { color:var(--ye); }
.pal .it { display:flex; gap:8px; padding:4px 10px; align-items:center; } .pal .it.on { background:var(--bg1); }
.pal .it .k { margin-left:auto; }
/* 10 recap */
.rc-h { color:var(--fg); font-weight:700; margin-bottom:6px; }
.rc li { list-style:none; display:flex; gap:7px; margin-bottom:3px; color:var(--fg3); } .rc li::before { content:"▸"; color:var(--ye); }
/* 12 git */
.gitrow { display:grid; grid-template-columns:120px 1fr auto; gap:8px; align-items:center; height:24px; }
.pill { font-size:10px; padding:0 6px; border-radius:10px; background:#2a2c2d; }
/* 14 budget */
.gauge { width:130px; height:70px; position:relative; margin:4px auto 0; }
.gauge svg { width:100%; height:100%; }
.gauge b { position:absolute; left:0; right:0; bottom:2px; text-align:center; color:var(--fg); font-size:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ideen für Session Atlas</h1>
  <p class="lead">Jede Karte zeigt eine Idee mit einer kleinen Vorschau. Klick auf <b>„will ich“</b>, um dir eine Auswahl zusammenzustellen; unten erscheint die Liste zum Kopieren. Die Schilder sagen, wie viel Arbeit es wäre und ob die Daten dafür schon da sind.</p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="summary" id="summary" hidden><b id="cnt"></b><span class="list" id="list"></span><button id="copy">Liste kopieren</button></div>

<script>
const IDEAS = [
{ cat:"Agenten", t:"Mac-Benachrichtigung + Menüleiste", p:"Sobald ein Agent auf dich wartet oder fertig ist, kommt eine macOS-Mitteilung. Oben in der Menüleiste zeigt ein kleines Symbol, wie viele Agenten laufen; Klick öffnet die Liste und springt direkt zur Session.", e:1, d:"Daten da",
  mock:`<div class="menubar"><span>Fr. 09:52</span><span class="ic"><span class="dot run"></span>2 <span class="dot wait"></span>1</span></div>
  <div class="dd"><div><span class="dot wait"></span>Soundeffekte wartet</div><div><span class="dot run"></span>Suche-Refactor · Edit</div><div><span class="dot run"></span>Setup-Skript · Bash</div></div>
  <div class="notif" style="top:auto;bottom:14px;right:auto;left:14px"><b>Soundeffekte wartet auf dich</b>„Soll ich die alten Sounds löschen?“<br><small>Session Atlas · jetzt</small></div>` },
{ cat:"Agenten", t:"Freigaben-Inbox", p:"Alle Agenten, die gerade eine Erlaubnis brauchen (Datei schreiben, Befehl ausführen), in einer Liste. Mit einem Klick erlauben oder ablehnen, ohne ins jeweilige Terminal zu wechseln.", e:3, d:"braucht Hook",
  mock:`<div class="mh">-- <b>Wartet auf Freigabe</b> · 3</div>
  ${[["Suche-Refactor","Bash","rm -rf dist && bun run build"],["Setup-Skript","Write","~/.zshrc"],["MQTT Sensoren","WebFetch","mqtt.org/docs"]].map(([n,tl,x])=>`<div class="row"><span class="dot wait"></span><span style="width:110px" class="ell">${n}</span><span class="tg" style="--tc:${tl==="Bash"?"#b8bb26":tl==="Write"?"#fe8019":"#83a598"}">${tl}</span><span class="ell dim" style="flex:1">${x}</span><button class="btn y">✓</button><button class="btn">✗</button></div>`).join("")}
  <div class="dim" style="margin-top:8px">Tasten: <kbd>y</kbd> erlauben · <kbd>n</kbd> ablehnen · <kbd>a</kbd> immer erlauben</div>` },
{ cat:"Agenten", t:"Kontext-Füllstand pro Agent", p:"Ein Balken zeigt, wie voll das Kontextfenster jedes Agenten ist. Ab 80 % wird er gelb und schlägt vor, mit /compact zusammenzufassen oder eine frische Session mit Übergabe zu starten.", e:1, d:"Daten da",
  mock:`<div class="mh">-- <b>Kontext</b> · pro Agent</div><div class="ctx">
  ${[["Suche-Refactor",38,"#8ec07c"],["Setup-Skript",64,"#8ec07c"],["Soundeffekte",86,"#fabd2f"],["Tests schreiben",12,"#8ec07c"]].map(([n,v,c])=>`<span class="ell">${n}</span><div class="bar" style="--c:${c}"><i style="width:${v}%"></i></div><span style="color:${c}">${v}%</span>`).join("")}</div>
  <div class="row" style="margin-top:10px"><span class="dot wait"></span><span class="dim">Soundeffekte fast voll</span><button class="btn y" style="margin-left:auto">/compact</button><button class="btn">frisch + Übergabe</button></div>` },
{ cat:"Agenten", t:"Ein Auftrag, mehrere Agenten", p:"Einen Prompt an 2 oder 3 Agenten parallel schicken, jeder in eigenem Git-Worktree (wie Orca). Danach die Ergebnisse nebeneinander vergleichen und den besten übernehmen.", e:3, d:"neu bauen",
  mock:`<div class="win"><span class="dim">Auftrag:</span> Baue einen CSV-Export für Rezepte</div>
  <div class="fan">${[["A · Opus","Tests grün","+84 -3",0],["B · Sonnet","Tests grün","+61 -2",1],["C · Haiku","1 Test rot","+40 -1",0]].map(([n,s,d,b])=>`<div class="win ${b?"best":""}"><b style="color:var(--fg)">${n}</b><div class="dim">${d}</div><div style="color:${s.includes("rot")?"var(--re)":"var(--aq)"}">${s}</div>${b?`<div style="color:var(--ye);margin-top:4px">★ übernehmen</div>`:""}</div>`).join("")}</div>` },
{ cat:"Verlauf", t:"Zeitreise-Regler mit Diff", p:"Ein Regler unter der Session: zieh ihn nach links und du siehst Schritt für Schritt, wie sich der Code verändert hat. Bei jedem Schritt: Datei auf diesen Stand zurücksetzen.", e:2, d:"Daten da (file-history)",
  mock:`<div class="mh">-- <b>tests/fixtures.ts</b> · Schritt 9 von 14</div><div class="code"><div> export const recipes = [</div><div class="de">-  mockSearch: () =&gt; [],</div><div class="ad">+  mockSearch: (q) =&gt; RECIPES.filter(</div><div class="ad">+    (r) =&gt; trigrams(r.title).some(...)),</div><div> ];</div></div>
  <div class="scrub"><div class="trk">${Array.from({length:14},(_,i)=>`<i class="${i<9?"p":""}"></i>`).join("")}<span class="knob"></span></div><div class="row"><span class="dim">Schritt 1</span><button class="btn" style="margin-left:auto">↺ auf diesen Stand</button><span class="dim">jetzt</span></div></div>` },
{ cat:"Verlauf", t:"Tagesrückblick", p:"Am Abend (oder auf Knopfdruck) fasst Claude zusammen, was heute in allen Sessions passiert ist: was fertig wurde, was offen ist, was morgen dran ist. Perfekt für Standups oder Zeiterfassung.", e:2, d:"Daten da",
  mock:`<div class="rc-h">Donnerstag, 13. November · 6 h 20 min aktiv</div><ul class="rc">
  <li>rezept-app: Tippfehler-Suche fertig, 24 Tests grün</li><li>dotfiles: Setup-Skript installiert Ghostty und Raycast</li><li>game-jam: Sounds leiser gemischt, Frage zu alten Sounds offen</li><li>wetterstation: MQTT-Tests schlagen noch fehl</li></ul>
  <div class="row" style="margin-top:6px"><button class="btn y">Als Notiz speichern</button><button class="btn">Für Standup kopieren</button><span class="dim" style="margin-left:auto">$6.12 heute</span></div>` },
{ cat:"Verlauf", t:"Sammlungen und Pins", p:"Wichtige Sessions anpinnen und in eigene Ordner sortieren (z. B. „Kunde X“, „Ideen“, „Bugs“), unabhängig vom Projektordner. Hashtags aus den Prompts werden automatisch zu Filtern.", e:1, d:"Daten da",
  mock:`<div class="mh">-- <b>Sammlungen</b></div>
  ${[["📌","Angepinnt","3","#fabd2f"],["▤","Kunde Bäckerei","5","#8ec07c"],["▤","Bugs","2","#fb4934"],["#","#suche","7","#83a598"],["#","#performance","4","#d3869b"]].map(([i,n,c,col])=>`<div class="row"><span style="color:${col};width:16px">${i}</span><span>${n}</span><span class="dim" style="margin-left:auto">${c}</span></div>`).join("")}` },
{ cat:"Code", t:"Datei-Hotspots", p:"Welche Dateien haben Claude und du am häufigsten angefasst? Eine Kachelkarte zeigt es: je größer, desto öfter geändert. Gut, um Problemstellen im Code zu finden.", e:1, d:"Daten da",
  mock:`<div class="tm"><div style="background:#fabd2f;grid-row:span 2">search/index.ts<small>41 Änderungen</small></div><div style="background:#8ec07c">fixtures.ts<small>18</small></div><div style="background:#83a598">README.md<small>9</small></div><div style="background:#fe8019">List.tsx<small>14</small></div><div style="background:#d3869b">app.ts<small>6</small></div></div>` },
{ cat:"Code", t:"Git-Status pro Projekt", p:"Für jedes Projekt: Branch, ungespeicherte Änderungen, wie viele Commits noch nicht gepusht sind. Ein Knopf lässt Claude einen Commit schreiben oder einen PR vorbereiten.", e:2, d:"neu lesen (git)",
  mock:`<div class="mh">-- <b>Git</b> · 4 Projekte</div>
  ${[["rezept-app","feat/suche","3 geändert · ↑2","#fabd2f"],["dotfiles","main","sauber","#fe8019"],["game-jam-2026","level-2","1 geändert","#d3869b"],["wetterstation","feat/mqtt","↑5 · Konflikt","#83a598"]].map(([p,b,s,c])=>`<div class="gitrow"><span style="color:${c}" class="ell">${p}</span><span class="dim ell">⑂ ${b} · ${s}</span><button class="btn">${s==="sauber"?"Pull":"Commit"}</button></div>`).join("")}` },
{ cat:"Code", t:"Test-Ampel", p:"Die App erkennt Testläufe in den Sessions (bun test, npm test, pytest) und zeigt pro Projekt eine Ampel mit dem letzten Ergebnis. Rot? Ein Klick schickt den Fehler an Claude.", e:1, d:"Daten da",
  mock:`<div class="mh">-- <b>Letzte Testläufe</b></div>
  ${[["rezept-app","bun test","24 bestanden","run"],["wetterstation","npm test","3 fehlgeschlagen","err"],["haushaltsbuch","pytest","12 bestanden","run"]].map(([p,c,r,s])=>`<div class="row"><span class="dot ${s}"></span><span style="width:100px">${p}</span><span class="dim" style="width:64px">${c}</span><span class="ell" style="color:${s==="err"?"var(--re)":"var(--aq)"}">${r}</span>${s==="err"?`<button class="btn y" style="margin-left:auto">an Claude</button>`:""}</div>`).join("")}` },
{ cat:"Bedienung", t:"Befehls-Palette ⌘K", p:"Überall ⌘K drücken: Sessions, Projekte, Notizen, Befehle und Agenten in einer Suche. Auch Aktionen wie „neue Session in rezept-app“ oder „alle Agenten: commit“.", e:1, d:"Daten da",
  mock:`<div class="pal"><div class="in"><b>›</b> neue se</div>${[["▶","Neue Session in rezept-app","c",1],["▶","Neue Session in dotfiles","",0],["●","Suche-Refactor (läuft)","",0],["▤","Notiz: Ideen.md","",0]].map(([i,t,k,on])=>`<div class="it ${on?"on":""}"><span style="color:var(--ye)">${i}</span>${t}${k?`<span class="k"><kbd>${k}</kbd></span>`:""}</div>`).join("")}</div>` },
{ cat:"Bedienung", t:"Prompt-Vorlagen", p:"Oft genutzte Prompts als Vorlagen mit Platzhaltern speichern, z. B. „Review {datei}“ oder „Schreib Tests für {funktion}“. Im Prompt-Feld mit / aufrufen.", e:1, d:"neu speichern",
  mock:`<div class="win" style="margin-bottom:8px"><span style="color:var(--ye)">/</span>rev<span style="background:var(--fg);width:7px;height:13px;display:inline-block;vertical-align:-2px"></span></div>
  ${[["/review","Prüf {datei} auf Fehler und Lesbarkeit"],["/tests","Schreib Tests für {funktion}, alle Randfälle"],["/commit","Commit mit kurzer deutscher Nachricht"]].map(([k,t],i)=>`<div class="row" style="${i?"":"background:var(--bg1);border-radius:4px"}"><b style="color:var(--ye);width:62px">${k}</b><span class="ell dim">${t}</span></div>`).join("")}` },
{ cat:"Kosten", t:"Budget-Wächter", p:"Ein Tages- oder Monatsbudget festlegen. Die Anzeige füllt sich, ab 80 % kommt eine Warnung, und pro Agent siehst du, wer gerade am meisten verbraucht.", e:1, d:"Daten da",
  mock:`<div class="gauge"><svg viewBox="0 0 130 70"><path d="M10,65 A55,55 0 0 1 120,65" fill="none" stroke="#3c3836" stroke-width="10" stroke-linecap="round"/><path d="M10,65 A55,55 0 0 1 103,26" fill="none" stroke="#fabd2f" stroke-width="10" stroke-linecap="round"/></svg><b>$8.10</b></div>
  <div style="text-align:center" class="dim">von $10 heute · 81 %</div>
  <div class="row" style="margin-top:8px"><span class="dim">am meisten:</span><span>Suche-Refactor $5.88</span><span class="dot wait" style="margin-left:auto"></span><span style="color:var(--ye)">Warnung</span></div>` },
{ cat:"Kosten", t:"Modell-Tipp", p:"Die App schaut, welche Aufgaben teuer mit Opus liefen, aber einfach waren (z. B. nur Dateien lesen). Sie schlägt vor, solche Helfer mit Haiku laufen zu lassen, und zeigt die Ersparnis.", e:2, d:"Daten da",
  mock:`<div class="mh">-- <b>Sparpotenzial</b> · 7 Tage</div>
  <div class="row"><span style="width:150px">Sucher-Agenten</span><span style="color:var(--pu)">Opus</span><span class="dim">→</span><span style="color:var(--gn)">Haiku</span><b style="margin-left:auto;color:var(--aq)">-$4.20</b></div>
  <div class="row"><span style="width:150px">Commit-Nachrichten</span><span style="color:var(--pu)">Opus</span><span class="dim">→</span><span style="color:var(--bl)">Sonnet</span><b style="margin-left:auto;color:var(--aq)">-$0.90</b></div>
  <div class="bar" style="--c:var(--aq);margin-top:12px"><i style="width:34%"></i></div><div class="dim" style="margin-top:4px">34 % günstiger bei gleichem Ergebnis</div>` },
];
const EFF = { 1:["klein","e1"], 2:["mittel","e2"], 3:["groß","e3"] };
let cat = "Alle", picks = new Set(); try { picks = new Set(JSON.parse(localStorage.getItem("ideas.picks") || "[]")); } catch {}
const cats = ["Alle", ...new Set(IDEAS.map((i) => i.cat))];
function render() {
  document.getElementById("filters").innerHTML = cats.map((c) => `<button class="${c === cat ? "on" : ""}" data-c="${c}">${c}${c === "Alle" ? "" : " · " + IDEAS.filter((i) => i.cat === c).length}</button>`).join("");
  document.getElementById("grid").innerHTML = IDEAS.map((x, i) => ({ x, i })).filter(({ x }) => cat === "Alle" || x.cat === cat).map(({ x, i }) => `
    <div class="card ${picks.has(i) ? "pick" : ""}"><div class="mock">${x.mock}</div><div class="body"><h3><span class="n">${i + 1}</span>${x.t}</h3><p>${x.p}</p>
      <div class="tags"><span class="tag">${x.cat}</span><span class="tag ${EFF[x.e][1]}">Aufwand: ${EFF[x.e][0]}</span><span class="tag d">${x.d}</span><button class="want" data-i="${i}">${picks.has(i) ? "✓ will ich" : "will ich"}</button></div></div></div>`).join("");
  const s = document.getElementById("summary"); s.hidden = !picks.size;
  document.getElementById("cnt").textContent = `${picks.size} gewählt:`;
  document.getElementById("list").textContent = [...picks].sort((a, b) => a - b).map((i) => `${i + 1}. ${IDEAS[i].t}`).join(" · ");
  try { localStorage.setItem("ideas.picks", JSON.stringify([...picks])); } catch {}
}
document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-c]"); if (f) { cat = f.dataset.c; render(); }
  const w = e.target.closest(".want"); if (w) { const i = +w.dataset.i; picks.has(i) ? picks.delete(i) : picks.add(i); render(); }
});
document.getElementById("copy").onclick = () => navigator.clipboard?.writeText(document.getElementById("list").textContent);
render();
</script>
</body>
</html>
