<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loops-Farben und Session-Graph</title>
<!-- PROTOTYPE, throwaway. Question: (1) does the Loops palette (near black, Claude orange) work for the whole app,
     (2) how does one session look as a graph in the right panel, keyboard only, with gt / gT between agents. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1011; --p0:#141617; --p1:#1b1d1e; --p2:#26292a; --p3:#3a3e41; --line:#2a2d2f;
  --fg:#ebdbb2; --fg2:#d5c4a1; --fg3:#bdae93; --fg4:#a89984; --gr:#8a8278;
  --ac:#e07a4f; --ac2:#f0a070; --gn:#a9b665; --rd:#ea6962; --wt:#e0a84f; --pu:#d3869b; --bl:#7daea3;
  --mono:"JetBrains Mono", Menlo, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg2); font:500 12px/1.5 var(--mono); display:flex; flex-direction:column; align-items:center; padding:14px 16px 120px; min-height:100vh; overflow-x:hidden; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
kbd { font:700 10px var(--mono); color:var(--fg3); background:rgba(235,219,178,.07); border:1px solid rgba(235,219,178,.16); border-bottom-width:2px; border-radius:4px; padding:0 4px; white-space:nowrap; }
.top { width:100%; max-width:1280px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
.top h1 { color:var(--fg); font-size:15px; }
.top p { color:var(--gr); }
.state { margin-left:auto; font-size:11px; color:var(--fg4); background:var(--p0); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
.state b { color:var(--fg); }
.screen { width:100%; max-width:1280px; aspect-ratio:1480/940; position:relative; border-radius:12px; overflow:hidden; background:var(--p0); box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--line); }
.screen img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.tag { position:absolute; left:14px; top:12px; z-index:3; font-weight:800; padding:3px 10px; border-radius:6px; background:var(--ac); color:#1a0f0a; letter-spacing:.06em; }
.tag.old { background:#fabd2f; color:#1d2021; }
.note { width:100%; max-width:1280px; margin-top:10px; color:var(--fg4); }
.note b { color:var(--fg); }
.bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:6px; padding:6px; border-radius:12px;
  background:rgba(20,22,23,.95); border:1px solid rgba(235,219,178,.14); box-shadow:0 14px 40px rgba(0,0,0,.55); max-width:calc(100vw - 32px); overflow-x:auto; }
.bar .sec { display:flex; gap:4px; padding-right:6px; border-right:1px solid var(--line); }
.bar button { padding:5px 10px; border-radius:8px; color:var(--fg4); white-space:nowrap; }
.bar button.on { background:var(--ac); color:#1a0f0a; font-weight:800; }
.bar .sec button.on { background:var(--p2); color:var(--fg); }
.bar .hint { color:var(--gr); padding:0 6px; white-space:nowrap; }

/* ---------- shared bits ---------- */
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; background:var(--c, var(--p3)); }
.dot.run { --c:var(--gn); animation:pulse 1.6s infinite; } .dot.wait { --c:var(--wt); } .dot.err { --c:var(--rd); }
@keyframes pulse { 50% { opacity:.4; } }
.mp { font-size:10px; font-weight:700; padding:0 6px; border-radius:3px; background:rgba(211,134,155,.15); color:var(--pu); }
.chip { font-size:10.5px; padding:0 6px; border-radius:4px; background:var(--p2); color:var(--fg3); white-space:nowrap; }
.go { display:flex; align-items:center; justify-content:center; gap:8px; padding:9px; border-radius:8px; background:var(--ac); color:#1a0f0a; font-weight:800; width:100%; }
.go.fork { background:var(--bl); }
.go kbd { color:#1a0f0a; background:rgba(0,0,0,.1); border-color:rgba(0,0,0,.25); }
.keys { display:flex; gap:10px; flex-wrap:wrap; color:var(--gr); font-size:10.5px; }
.bg { position:absolute; inset:0; background:url(theme-preview/nachher-dashboard.jpg) center/cover; filter:brightness(.38) saturate(.7); }
.panel { position:absolute; top:12px; right:12px; bottom:12px; width:480px; background:var(--p0); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; overflow:hidden; box-shadow:-24px 0 60px rgba(0,0,0,.5); }
.ph { padding:12px 16px 10px; border-bottom:1px solid var(--line); }
.ph .t { color:var(--ac); font-weight:800; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ph .m { color:var(--gr); font-size:11px; margin-top:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.ph .m b { color:var(--fg2); }
.pf { border-top:1px solid var(--line); padding:10px 16px; display:flex; flex-direction:column; gap:8px; }
.pv { color:var(--fg4); max-height:4.6em; overflow:hidden; }
.pv b { color:var(--fg); }
.flash { position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:5; background:var(--gn); color:#141617; font-weight:800; padding:5px 12px; border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; }
.flash.show { opacity:1; }

/* ---------- G1 agent tabs ---------- */
.tabs { display:flex; border-bottom:1px solid var(--line); background:var(--bg); overflow:hidden; }
.tabs > span { display:flex; align-items:center; gap:6px; padding:7px 12px; color:var(--gr); border-right:1px solid var(--line); white-space:nowrap; font-size:11.5px; }
.tabs > span b { font-size:10px; color:var(--fg4); }
.tabs > span.on { background:var(--p0); color:var(--fg); box-shadow:inset 0 2px 0 var(--ac); }
.tabs > span.on b { color:var(--ac); }
.lane { flex:1; overflow:hidden; padding:8px 0; }
.row { display:grid; grid-template-columns:52px minmax(0,1fr) 44px; align-items:center; min-height:27px; padding-right:14px; color:var(--fg4); }
.row svg { width:52px; height:27px; display:block; }
.row .x { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg3); }
.row .x i { font-style:normal; color:var(--gr); margin-right:8px; font-weight:700; }
.row .tm { color:var(--gr); font-size:10.5px; text-align:right; }
.row.tool .x { color:var(--fg4); font-size:11px; }
.row.tool .x em { font-style:normal; color:var(--bl); margin-right:6px; }
.row.on { background:var(--p1); }
.row.on .x { color:var(--fg); }

/* ---------- G2 swimlanes ---------- */
.g2 { position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; }
.g2 .hd { display:flex; align-items:center; gap:12px; padding:40px 24px 12px; border-bottom:1px solid var(--line); }
.g2 .hd .t { color:var(--ac); font-weight:800; font-size:15px; }
.g2 .hd .sp { flex:1; }
.g2 .lanes { flex:1; position:relative; overflow:hidden; }
.g2 .ln { position:absolute; left:0; right:0; height:96px; display:flex; align-items:center; border-bottom:1px dashed #1f2223; }
.g2 .ln .lab { width:150px; flex:none; padding-left:24px; display:flex; align-items:center; gap:8px; color:var(--fg4); white-space:nowrap; }
.g2 .ln .lab b { font-size:10px; color:var(--gr); }
.g2 .ln.on { background:linear-gradient(90deg, rgba(224,122,79,.08), transparent 70%); }
.g2 .ln.on .lab { color:var(--fg); }
.g2 .ln.on .lab b { color:var(--ac); }
.g2 svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.g2 .nd { position:absolute; transform:translate(-50%,-50%); width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:11px; background:var(--p1); border:2px solid var(--p3); color:var(--fg3); }
.g2 .nd.h { width:18px; height:18px; border-color:var(--pu); background:var(--bg); }
.g2 .nd.on { background:var(--ac); border-color:var(--ac); color:#1a0f0a; box-shadow:0 0 0 5px rgba(224,122,79,.18); }
.g2 .nd.h.on { background:var(--pu); border-color:var(--pu); box-shadow:0 0 0 5px rgba(211,134,155,.18); }
.g2 .ft { border-top:1px solid var(--line); background:var(--p0); padding:12px 24px; display:grid; grid-template-columns:1fr 300px; gap:24px; min-height:128px; }

/* ---------- G3 sessions as tabs + tree ---------- */
.g3 .stabs { display:flex; gap:4px; padding:8px 10px 0; background:var(--bg); border-bottom:1px solid var(--line); }
.g3 .stabs > span { display:flex; align-items:center; gap:7px; padding:6px 10px; border-radius:7px 7px 0 0; color:var(--gr); white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis; font-size:11.5px; }
.g3 .stabs > span b { color:var(--fg4); font-size:10px; }
.g3 .stabs > span.on { background:var(--p0); color:var(--fg); box-shadow:inset 0 2px 0 var(--ac); }
.g3 .stabs > span.on b { color:var(--ac); }
.g3 .row.br .x { color:var(--bl); }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="top"><h1>Loops-Farben und Session-Graph</h1><p>Prototyp, nur zum Anschauen. Alles mit der Tastatur.</p><div class="state" id="state"></div></div>
<div class="screen" id="screen"></div>
<div class="note" id="note"></div>
<div class="bar" id="bar"></div>
<script>
const SHOTS = [["dashboard", "Dashboard"], ["drawer", "Session-Leiste heute"], ["graph", "Agenten-Graph"], ["terminal", "Terminal"]];
const AG = [
  { id: "c", name: "Claude", model: "Opus 5.5", st: "run" },
  { id: "s", name: "Sucher", model: "Haiku 5.5", st: "done" },
  { id: "a", name: "Allrounder", model: "Sonnet 5.5", st: "run" },
  { id: "p", name: "Planer", model: "Opus 5.5", st: "done" },
];
// Main line: prompts of the session. Helpers start at a step and have their own tool calls.
const STEPS = [
  { q: "Zeig mir zwei Varianten für das Layout der Suche", a: "Zwei Layouts gebaut: Suchleiste oben mit Filter-Chips, oder Seitenleiste mit Kategorien.", t: "13:37", tools: ["Read SearchPage.tsx", "Write SearchBar.tsx", "Write Filters.tsx"] },
  { q: "Refactor das in kleinere Funktionen", a: "Suchlogik steckt jetzt in useRecipeSearch(), das Rendern in drei kleinen Komponenten.", t: "13:45", tools: ["Edit useRecipeSearch.ts"], helpers: [{ ag: "s", task: "Finde alle Stellen, die nach Rezepten suchen", res: "4 Dateien nutzen die alte Suche.", tools: ["Grep searchRecipes", "Read api/search.ts", "Read RecipeList.tsx"] }] },
  { q: "Das sieht noch nicht gut aus, mach es übersichtlicher", a: "Mehr Abstand, Zutaten als Liste, Kochzeit rechts oben.", t: "13:52", tools: ["Edit RecipeCard.tsx"], fork: true },
  { q: "Füge Tests für die Suche hinzu", a: "Zwölf Tests für Tippfehler, Umlaute und leere Suche. Drei schlagen noch fehl.", t: "14:10", tools: ["Bash bun test search"], helpers: [{ ag: "a", task: "Schreib Tests für Tippfehler und Umlaute", res: "12 Tests in search.test.ts, 3 rot.", tools: ["Write search.test.ts", "Bash bun test search"] }] },
  { q: "Mach die Tests grün", a: "Umlaute werden vor dem Vergleich normalisiert. Alle zwölf Tests laufen durch.", t: "14:18", tools: ["Edit normalize.ts", "Bash bun test search"], helpers: [{ ag: "a", task: "Prüf, ob noch andere Stellen Umlaute vergleichen", res: "Nur normalize.ts betroffen.", tools: ["Grep toLowerCase", "Read normalize.ts"] }] },
  { q: "Prüf noch, ob das auf dem Handy gut aussieht", a: "Auf schmalen Bildschirmen klappen die Filter in eine Zeile zum Wischen. Soll ich die Kochzeit dort ausblenden?", t: "14:41", tools: ["Read Filters.tsx", "Edit Filters.tsx"], helpers: [{ ag: "p", task: "Plan für mobile Darstellung", res: "3 Änderungen vorgeschlagen.", tools: ["Read Filters.tsx"] }] },
];
const OTHER = [{ name: "Volltextsuche für Rezepte", pj: "rezept-app", st: "run" }, { name: "Soundeffekte einbauen", pj: "game-jam-2026", st: "wait" }, { name: "Monatsbericht als PDF", pj: "haushaltsbuch", st: "err" }];
const VAR = {
  F: [{ key: "f1", name: "Vorher / Nachher", why: "Die echte App im Demo-Modus, einmal in den heutigen Farben und einmal in den Loops-Farben: fast schwarz, Claude-Orange als Akzent, Creme-Text. Grün, Rot und Gelb bleiben als Status-Farben." }],
  G: [
    { key: "g1", name: "Agenten-Reiter", why: "Die Leiste hat oben Reiter wie das Terminal: Claude und jeder Helfer. gt / gT wechselt den Agenten, darunter sein eigener Verlauf als Graph mit allen Werkzeug-Aufrufen. Bei Claude hängen die Helfer als Seitenäste dran." },
    { key: "g2", name: "Bahnen", why: "Die ganze Session als Bild: jede Bahn ist ein Agent, von links nach rechts die Zeit. gt / gT springt zwischen den Bahnen, h / l entlang der Zeit. Man sieht sofort, wer wann parallel gearbeitet hat." },
    { key: "g3", name: "Sessions als Reiter", why: "Mehrere Sessions offen wie Terminals: gt / gT wechselt die Session, darin ein kompakter Verlaufs-Graph wie git log --graph mit Abzweigen und Helfern. j / k geht über die Zeilen." },
  ],
};
const S = { sec: "F", v: { F: 0, G: 0 }, shot: 0, after: true, ag: 0, sel: null, lane: 0, col: STEPS.length - 1, sess: 0, flash: "" };
const p = new URLSearchParams(location.search).get("v"); if (p) { const sec = p[0].toUpperCase(), i = +p[1] - 1; if (VAR[sec]?.[i]) { S.sec = sec; S.v[sec] = i; } }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cur = () => VAR[S.sec][S.v[S.sec]];
const agOf = (id) => AG.find((a) => a.id === id);
const head = (extra = "") => `<div class="ph"><div class="t">Volltextsuche für Rezepte</div><div class="m"><span class="dot run"></span>rezept-app / feat/suche <span class="mp">Opus 5.5</span><b>${STEPS.length}</b> Schritte · <b>$5.88</b>${extra}</div></div>`;

// rows of one agent: for Claude the steps plus helper side branches, for a helper its tool calls
function rowsFor(agId) {
  const rows = [];
  if (agId === "c") STEPS.forEach((s, i) => { rows.push({ k: "s", i, s }); (s.helpers || []).forEach((h) => rows.push({ k: "h", i, h })); });
  else STEPS.forEach((s, i) => (s.helpers || []).filter((h) => h.ag === agId).forEach((h) => { rows.push({ k: "s", i, s: { q: h.task, t: s.t, a: h.res }, helperOf: i }); h.tools.forEach((t) => rows.push({ k: "t", i, t })); }));
  return rows;
}
function gutter(r, on, last) {
  const main = `<line x1="14" y1="0" x2="14" y2="${last ? 13 : 27}" stroke="#3a3e41" stroke-width="2"/>`;
  if (r.k === "s") return `<svg viewBox="0 0 52 27">${main}<circle cx="14" cy="13.5" r="${on ? 6 : 4.5}" fill="${on ? "#e07a4f" : r.i === STEPS.length - 1 ? "#141617" : "#5a5f63"}" stroke="${r.i === STEPS.length - 1 ? "#e07a4f" : "none"}" stroke-width="2"/></svg>`;
  if (r.k === "h") return `<svg viewBox="0 0 52 27">${main}<path d="M14,2 C14,12 32,8 32,13.5" stroke="#d3869b" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/><circle cx="32" cy="13.5" r="4" fill="${on ? "#d3869b" : "#141617"}" stroke="#d3869b" stroke-width="1.5"/></svg>`;
  if (r.k === "b") return `<svg viewBox="0 0 52 27">${main}<path d="M14,2 C14,12 32,8 32,13.5 L32,27" stroke="#7daea3" stroke-width="1.5" fill="none"/><circle cx="32" cy="13.5" r="4" fill="${on ? "#7daea3" : "#141617"}" stroke="#7daea3" stroke-width="1.5"/></svg>`;
  return `<svg viewBox="0 0 52 27">${main}<circle cx="14" cy="13.5" r="2.5" fill="#7daea3"/></svg>`;
}
function rowHtml(r, idx, on, last) {
  const cls = r.k === "t" ? "tool" : r.k === "b" ? "br" : "";
  const x = r.k === "s" ? `<i>${r.helperOf != null ? "↳" : r.i + 1}</i>${esc(r.s.q)}` : r.k === "h" ? `<span style="color:var(--pu)">${agOf(r.h.ag).name}: ${esc(r.h.task)}</span>` : r.k === "b" ? `Zweig ab Schritt ${r.i + 1}: „Kompakter“` : `<em>${esc(r.t.split(" ")[0])}</em>${esc(r.t.split(" ").slice(1).join(" "))}`;
  return `<div class="row ${cls} ${on ? "on" : ""}">${gutter(r, on, last)}<span class="x">${x}</span><span class="tm">${r.k === "s" ? r.s.t : ""}</span></div>`;
}
const enterTxt = (r) => !r ? "Am letzten Stand weitermachen" : r.k === "s" && r.helperOf == null ? (r.i === STEPS.length - 1 ? "Am letzten Stand weitermachen" : `Ab Schritt ${r.i + 1} abzweigen`) : r.k === "h" || r.helperOf != null ? "Helfer im Editor ansehen" : "Werkzeug-Aufruf ansehen";
const prev = (r) => !r ? "" : r.k === "s" ? `<b>${r.helperOf != null ? "Auftrag" : `${r.i + 1}.`}</b> ${esc(r.s.q)}<br>${esc(r.s.a)}` : r.k === "h" ? `<b>${agOf(r.h.ag).name}</b> bei Schritt ${r.i + 1}: ${esc(r.h.task)}<br>Ergebnis: ${esc(r.h.res)}` : r.k === "b" ? "Ein Zweig, der hier mit „Ab hier weitermachen“ entstanden ist." : `<b>${esc(r.t)}</b> bei Schritt ${r.i + 1}`;

function F1() {
  const [k, label] = SHOTS[S.shot];
  return `<img src="theme-preview/${S.after ? "nachher" : "vorher"}-${k}.jpg" alt="${label}"><span class="tag ${S.after ? "" : "old"}">${S.after ? "LOOPS-FARBEN" : "HEUTE"} · ${label}</span>`;
}
function G1() {
  const ag = AG[S.ag], rows = rowsFor(ag.id); if (S.sel == null || S.sel >= rows.length) S.sel = ag.id === "c" ? rows.findIndex((r) => r.k === "s" && r.i === STEPS.length - 1) : 0;
  const r = rows[S.sel];
  return `<div class="bg"></div><div class="panel">${head()}
    <div class="tabs">${AG.map((a, i) => `<span class="${i === S.ag ? "on" : ""}"><b>${i + 1}</b><span class="dot ${a.st}"></span>${a.name}</span>`).join("")}</div>
    <div class="lane">${rows.map((x, i) => rowHtml(x, i, i === S.sel, i === rows.length - 1)).join("")}</div>
    <div class="pf"><div class="pv">${prev(r)}</div><button class="go ${enterTxt(r).startsWith("Ab") ? "fork" : ""}">▶ ${enterTxt(r)} <kbd>Enter</kbd></button>
      <div class="keys"><span><kbd>gt</kbd><kbd>gT</kbd> Agent</span><span><kbd>j</kbd><kbd>k</kbd> Zeile</span><span><kbd>G</kbd> letzter</span><span><kbd>Esc</kbd> zu</span></div></div></div>`;
}
function G2() {
  const W = 1000, H = 560, top = 0, LH = 96, x0 = 17, xs = STEPS.map((_, i) => x0 + 4 + (i / (STEPS.length - 1)) * (93 - x0 - 4));
  const laneY = (li) => top + li * LH + LH / 2;
  const nodes = [];
  STEPS.forEach((s, i) => { nodes.push({ lane: 0, col: i, x: xs[i], y: laneY(0), label: i + 1, step: s, i }); (s.helpers || []).forEach((h) => { const li = AG.findIndex((a) => a.id === h.ag); nodes.push({ lane: li, col: i, x: xs[i] + 3.2, y: laneY(li), h, i }); }); });
  const laneNodes = nodes.filter((n) => n.lane === S.lane);
  let sel = laneNodes.find((n) => n.col === S.col) || laneNodes.reduce((b, n) => (Math.abs(n.col - S.col) < Math.abs(b.col - S.col) ? n : b), laneNodes[0]);
  const wires = nodes.filter((n) => n.h).map((n) => `<path d="M${xs[n.i] * W / 100},${laneY(0) + 14} C${xs[n.i] * W / 100},${n.y - 30} ${n.x * W / 100},${n.y - 30} ${n.x * W / 100},${n.y - 9}" stroke="#d3869b" stroke-width="1.5" fill="none" stroke-dasharray="3 4" opacity="${n === sel || (sel.lane === 0 && sel.i === n.i) ? 1 : .45}"/>`).join("");
  const r = sel.h ? { k: "h", i: sel.i, h: sel.h } : { k: "s", i: sel.i, s: sel.step };
  return `<div class="g2"><div class="hd"><span class="t">Volltextsuche für Rezepte</span><span style="color:var(--gr)">rezept-app / feat/suche · ${STEPS.length} Schritte · 3 Helfer · $5.88</span><span class="sp"></span><span class="keys"><span><kbd>gt</kbd><kbd>gT</kbd> Bahn</span><span><kbd>h</kbd><kbd>l</kbd> Zeit</span><span><kbd>Esc</kbd> zu</span></span></div>
    <div class="lanes">${AG.map((a, i) => `<div class="ln ${i === S.lane ? "on" : ""}" style="top:${i * LH}px"><span class="lab"><b>${i + 1}</b><span class="dot ${a.st}"></span>${a.name}</span></div>`).join("")}
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><line x1="${xs[0] * W / 100}" y1="${laneY(0)}" x2="${xs[xs.length - 1] * W / 100}" y2="${laneY(0)}" stroke="#3a3e41" stroke-width="2"/>${wires}</svg>
      ${nodes.map((n) => `<span class="nd ${n.h ? "h" : ""} ${n === sel ? "on" : ""}" style="left:${n.x}%;top:${n.y}px">${n.h ? "" : n.label}</span>`).join("")}
      ${STEPS.map((s, i) => `<span style="position:absolute;left:${xs[i]}%;top:${LH * AG.length + 8}px;transform:translateX(-50%);color:var(--gr);font-size:10.5px">${s.t}</span>`).join("")}</div>
    <div class="ft"><div class="pv" style="max-height:none">${prev(r)}</div><div style="display:flex;flex-direction:column;gap:8px;justify-content:flex-end"><button class="go ${enterTxt(r).startsWith("Ab") ? "fork" : ""}">▶ ${enterTxt(r)} <kbd>Enter</kbd></button></div></div></div>`;
}
function g3Rows() { const rows = []; STEPS.forEach((s, i) => { rows.push({ k: "s", i, s }); if (s.fork) rows.push({ k: "b", i }); (s.helpers || []).forEach((h) => rows.push({ k: "h", i, h })); }); return rows; }
function G3() {
  const rows = g3Rows(); if (S.sel == null || S.sel >= rows.length) S.sel = rows.findIndex((r) => r.k === "s" && r.i === STEPS.length - 1);
  const r = rows[S.sel], o = OTHER[S.sess];
  return `<div class="bg"></div><div class="panel g3">
    <div class="stabs">${OTHER.map((x, i) => `<span class="${i === S.sess ? "on" : ""}"><b>${i + 1}</b><span class="dot ${x.st}"></span>${esc(x.name)}</span>`).join("")}</div>
    <div class="ph"><div class="t">${esc(o.name)}</div><div class="m"><span class="dot ${o.st}"></span>${o.pj} <span class="mp">Opus 5.5</span><b>${STEPS.length}</b> Schritte · 1 Zweig · 3 Helfer</div></div>
    <div class="lane">${rows.map((x, i) => rowHtml(x, i, i === S.sel, i === rows.length - 1)).join("")}</div>
    <div class="pf"><div class="pv">${prev(r)}</div><button class="go ${enterTxt(r).startsWith("Ab") ? "fork" : ""}">▶ ${enterTxt(r)} <kbd>Enter</kbd></button>
      <div class="keys"><span><kbd>gt</kbd><kbd>gT</kbd> Session</span><span><kbd>j</kbd><kbd>k</kbd> Zeile</span><span><kbd>J</kbd><kbd>K</kbd> nur Schritte</span><span><kbd>Esc</kbd> zu</span></div></div></div>`;
}
const R = { f1: F1, g1: G1, g2: G2, g3: G3 };
function render() {
  const v = cur();
  $("screen").innerHTML = R[v.key]() + `<div class="flash ${S.flash ? "show" : ""}">${esc(S.flash)}</div>`;
  $("note").innerHTML = `<b>${v.name}:</b> ${v.why}`;
  $("state").innerHTML = S.sec === "F" ? `Bild <b>${SHOTS[S.shot][1]}</b> · <b>${S.after ? "Loops-Farben" : "heute"}</b> · <kbd>Space</kbd> umschalten · <kbd>j</kbd><kbd>k</kbd> Bild`
    : v.key === "g1" ? `Agent <b>${AG[S.ag].name}</b> · Zeile ${S.sel + 1}` : v.key === "g2" ? `Bahn <b>${AG[S.lane].name}</b> · Schritt ${S.col + 1}` : `Session <b>${S.sess + 1}</b> · Zeile ${S.sel + 1}`;
  $("bar").innerHTML = `<span class="sec"><button data-sec="F" class="${S.sec === "F" ? "on" : ""}">Farben</button><button data-sec="G" class="${S.sec === "G" ? "on" : ""}">Session-Graph</button></span>
    ${S.sec === "F" ? SHOTS.map((x, i) => `<button data-shot="${i}" class="${i === S.shot ? "on" : ""}">${x[1]}</button>`).join("") : VAR.G.map((x, i) => `<button data-v="${i}" class="${i === S.v.G ? "on" : ""}">${i + 1} ${x.name}</button>`).join("")}
    <span class="hint"><kbd>⇧Tab</kbd> Farben / Graph</span>`;
  const u = new URL(location); u.searchParams.set("v", v.key); history.replaceState(null, "", u);
}
function flash(m) { S.flash = m; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.flash = ""; render(); }, 1300); }
$("bar").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.sec) S.sec = b.dataset.sec; if (b.dataset.v) { S.v.G = +b.dataset.v; S.sel = null; } if (b.dataset.shot) S.shot = +b.dataset.shot; render(); });
let g = false;
document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "Tab" && e.shiftKey) { e.preventDefault(); S.sec = S.sec === "F" ? "G" : "F"; S.sel = null; return render(); }
  if (S.sec === "F") {
    if (k === " " || k === "Enter") { e.preventDefault(); S.after = !S.after; } else if (k === "j" || k === "ArrowRight" || k === "ArrowDown") S.shot = (S.shot + 1) % SHOTS.length;
    else if (k === "k" || k === "ArrowLeft" || k === "ArrowUp") S.shot = (S.shot + SHOTS.length - 1) % SHOTS.length; else if (/^[1-4]$/.test(k)) S.shot = +k - 1; else return;
    return render();
  }
  if (/^[1-3]$/.test(k) && !g) { S.v.G = +k - 1; S.sel = null; return render(); }
  const vk = cur().key;
  const tab = (d) => { if (vk === "g1") { S.ag = (S.ag + d + AG.length) % AG.length; S.sel = null; } else if (vk === "g2") S.lane = (S.lane + d + AG.length) % AG.length; else { S.sess = (S.sess + d + OTHER.length) % OTHER.length; S.sel = null; } };
  if (g) { g = false; if (k === "t") { tab(1); return render(); } if (k === "T") { tab(-1); return render(); } if (k === "g") { if (vk === "g2") S.col = 0; else S.sel = 0; return render(); } return; }
  if (k === "g") { g = true; return; }
  if (k === "Escape") return flash("Leiste geschlossen");
  if (vk === "g2") {
    if (k === "l" || k === "ArrowRight") S.col = Math.min(STEPS.length - 1, S.col + 1); else if (k === "h" || k === "ArrowLeft") S.col = Math.max(0, S.col - 1);
    else if (k === "j" || k === "ArrowDown") tab(1); else if (k === "k" || k === "ArrowUp") tab(-1); else if (k === "G") S.col = STEPS.length - 1;
    else if (k === "Enter") return flash("▶ " + $("screen").querySelector(".go").textContent.replace("Enter", "").replace("▶", "").trim()); else return;
    return render();
  }
  const rows = vk === "g1" ? rowsFor(AG[S.ag].id) : g3Rows();
  if (k === "j" || k === "ArrowDown") S.sel = Math.min(rows.length - 1, S.sel + 1); else if (k === "k" || k === "ArrowUp") S.sel = Math.max(0, S.sel - 1);
  else if (k === "J") { let i = S.sel + 1; while (i < rows.length && rows[i].k !== "s") i++; if (i < rows.length) S.sel = i; }
  else if (k === "K") { let i = S.sel - 1; while (i >= 0 && rows[i].k !== "s") i--; if (i >= 0) S.sel = i; }
  else if (k === "G") S.sel = vk === "g1" && AG[S.ag].id === "c" ? rows.findIndex((r) => r.k === "s" && r.i === STEPS.length - 1) : rows.length - 1;
  else if (k === "Enter") return flash("▶ " + enterTxt(rows[S.sel])); else return;
  render();
});
render();
</script>
</body>
