<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal und Leiste</title>
<!-- PROTOTYPE, throwaway. Question: (A) how does the built-in terminal look like Session Atlas instead of a plain terminal,
     (B) how does the session drawer before "weitermachen" get compact and fully keyboard driven, maybe as a graph. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#1d2021; --bg:#282828; --bg1:#32302f; --bg2:#3c3836; --bg3:#504945; --bg4:#665c54;
  --fg:#ebdbb2; --fg2:#d5c4a1; --fg3:#bdae93; --fg4:#a89984; --gr:#928374;
  --re:#fb4934; --gn:#b8bb26; --ye:#fabd2f; --bl:#83a598; --pu:#d3869b; --aq:#8ec07c; --or:#fe8019;
  --tb:#24273a; --tfg:#cad3f5; --tdim:#8087a2; --tor:#f5a97f; --tgn:#a6da95; --tbl:#8aadf4; --tmu:#6e738d;
  --mono:"JetBrains Mono", Menlo, monospace; --px:"Silkscreen", var(--mono);
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:#0e0f10; color:var(--fg2); font:500 12px/1.5 var(--mono); display:flex; flex-direction:column; align-items:center; padding:14px 16px 84px; overflow-x:hidden; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
kbd { font:700 10px var(--mono); color:var(--fg3); background:rgba(235,219,178,.07); border:1px solid rgba(235,219,178,.18); border-bottom-width:2px; border-radius:4px; padding:0 4px; white-space:nowrap; }
.top { width:100%; max-width:1280px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
.top h1 { color:var(--fg); font-size:15px; }
.top p { color:var(--gr); }
.screen { width:100%; max-width:1280px; aspect-ratio:16/10; position:relative; border-radius:12px; overflow:hidden; background:var(--bg0); box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px #2a2c2d; }
.note { width:100%; max-width:1280px; margin-top:10px; color:var(--fg4); display:flex; gap:18px; flex-wrap:wrap; }
.note b { color:var(--fg); }

/* ---------- bottom switcher ---------- */
.bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:6px; padding:6px; border-radius:12px;
  background:rgba(29,32,33,.94); border:1px solid rgba(235,219,178,.16); box-shadow:0 14px 40px rgba(0,0,0,.55); backdrop-filter:blur(14px); max-width:calc(100vw - 32px); overflow-x:auto; }
.bar .sec { display:flex; gap:4px; padding-right:6px; margin-right:2px; border-right:1px solid #3c3836; }
.bar button { padding:5px 10px; border-radius:8px; color:var(--fg4); white-space:nowrap; }
.bar button.on { background:var(--ye); color:var(--bg0); font-weight:800; }
.bar .sec button.on { background:var(--bg2); color:var(--fg); }
.bar .hint { color:var(--gr); padding:0 6px; white-space:nowrap; }
.state { margin-left:auto; font-size:11px; color:var(--fg4); background:rgba(29,32,33,.9); border:1px solid #2a2c2d; border-radius:8px; padding:6px 10px; max-width:340px; }
.state b { color:var(--fg); }

/* ---------- shared terminal content ---------- */
.tx { font:500 13px/1.55 var(--mono); color:var(--tfg); padding:14px 18px; white-space:pre; overflow:hidden; }
.tx .o { color:var(--tor); font-weight:700; } .tx .d { color:var(--tdim); } .tx .g { color:var(--tgn); } .tx .b { color:var(--tbl); } .tx .m { color:var(--tmu); }
.tx .box { display:inline-block; border:1px solid #494d64; border-radius:6px; padding:6px 12px; margin:8px 0; white-space:pre; }
.cur { display:inline-block; width:8px; height:16px; background:var(--tfg); vertical-align:-3px; animation:blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
.wm { font-family:var(--px); font-weight:700; letter-spacing:.04em; background:linear-gradient(90deg,#fe8019,#fabd2f 40%,#8ec07c 75%,#83a598); -webkit-background-clip:text; background-clip:text; color:transparent; }
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex:none; }
.dot.run { background:var(--gn); animation:pulse 1.6s infinite; } .dot.wait { background:var(--ye); } .dot.err { background:var(--re); } .dot.done { background:var(--bg4); }
@keyframes pulse { 50% { opacity:.45; } }
.num { font:800 10px var(--mono); color:var(--bg0); background:var(--fg4); border-radius:3px; padding:0 4px; }
.mp { font-size:10px; font-weight:700; padding:0 6px; border-radius:3px; background:rgba(211,134,155,.16); color:var(--pu); }
.mascot { width:26px; height:22px; image-rendering:pixelated; flex:none; }
.lim { display:inline-flex; align-items:center; gap:6px; }
.lim i { width:54px; height:5px; border-radius:3px; background:#3c3836; position:relative; overflow:hidden; display:inline-block; }
.lim i::after { content:""; position:absolute; inset:0 auto 0 0; width:var(--p); background:var(--gn); border-radius:3px; }

/* ---------- A1 Atlas tab bar ---------- */
.a1 { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--tb); }
.a1 .tbar { height:38px; display:flex; align-items:stretch; background:#141617; border-bottom:1px solid #0a0b0b; padding-left:78px; }
.a1 .brand { display:flex; align-items:center; gap:8px; padding:0 14px; border-right:1px solid #0a0b0b; font-size:13px; }
.a1 .tab { display:flex; align-items:center; gap:8px; padding:0 14px; color:#928374; border-right:1px solid #0a0b0b; position:relative; max-width:250px; }
.a1 .tab .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.a1 .tab .pj { font-size:10.5px; color:var(--gr); white-space:nowrap; }
.a1 .tab.on { background:var(--tb); color:var(--fg); }
.a1 .tab.on::before { content:""; position:absolute; left:0; right:0; top:0; height:2px; background:var(--h); }
.a1 .tab.on .num { background:var(--h); }
.a1 .sp { flex:1; }
.a1 .tbtn { display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--gr); }
.a1 .body { flex:1; position:relative; }
.a1 .sl { height:26px; display:flex; align-items:stretch; background:#282828; font-size:11px; white-space:nowrap; position:relative; }
.a1 .sl > span { display:flex; align-items:center; gap:7px; padding:0 14px; }
.a1 .sl .m { background:var(--gn); color:var(--bg0); font-weight:800; letter-spacing:.06em; padding-right:20px; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%); }
.a1 .sl .b { background:var(--bg3); margin-left:-10px; padding-left:20px; padding-right:20px; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%); color:var(--fg2); }
.a1 .sl .c { flex:1; background:var(--bg2); margin-left:-10px; padding-left:20px; color:var(--fg3); }
.a1 .sl .y { background:var(--bg3); color:var(--fg2); }
.a1 .sl .mascot { position:absolute; right:150px; bottom:24px; }

/* ---------- A2 side rail ---------- */
.a2 { position:absolute; inset:0; display:flex; background:#141617; }
.a2 .rail { width:232px; display:flex; flex-direction:column; border-right:1px solid #0a0b0b; padding:44px 10px 10px; gap:4px; }
.a2 .rail .brand { font-size:15px; padding:0 8px 12px; }
.a2 .rail .lbl { color:var(--gr); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; padding:6px 8px 4px; display:flex; justify-content:space-between; }
.a2 .it { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center; padding:7px 8px; border-radius:7px; color:var(--fg4); }
.a2 .it .av { width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:10px; font-weight:800; color:var(--bg0); background:var(--h); }
.a2 .it .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg3); }
.a2 .it small { display:block; color:var(--gr); font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.a2 .it.on { background:var(--tb); box-shadow:inset 3px 0 0 var(--h); }
.a2 .it.on .nm { color:var(--fg); }
.a2 .rail .foot { margin-top:auto; display:flex; align-items:flex-end; gap:8px; padding:8px; border-top:1px solid #232526; color:var(--fg4); font-size:11px; }
.a2 .main { flex:1; display:flex; flex-direction:column; background:var(--tb); min-width:0; }
.a2 .ctx { height:42px; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:1px solid #1e2030; color:var(--tdim); white-space:nowrap; overflow:hidden; }
.a2 .ctx b { color:var(--tfg); }
.a2 .ctx .sp { flex:1; }
.a2 .body { flex:1; position:relative; }
.a2 .kb { padding:6px 16px; color:var(--tmu); border-top:1px solid #1e2030; display:flex; gap:14px; font-size:11px; }

/* ---------- A3 framed card ---------- */
.a3 { position:absolute; inset:0; background:radial-gradient(1200px 500px at 20% -10%, rgba(250,189,47,.08), transparent 60%), #111213; display:flex; flex-direction:column; padding:44px 22px 14px; gap:10px; }
.a3 .head { display:flex; align-items:center; gap:10px; padding-left:60px; }
.a3 .pill { display:flex; align-items:center; gap:7px; padding:4px 11px; border-radius:20px; color:var(--fg4); border:1px solid #2a2c2d; }
.a3 .pill.on { color:var(--fg); border-color:var(--h); background:color-mix(in srgb, var(--h) 12%, transparent); }
.a3 .card { flex:1; position:relative; border-radius:12px; background:var(--tb); overflow:hidden; box-shadow:0 0 0 1px rgba(250,189,47,.35), 0 24px 60px rgba(0,0,0,.5); }
.a3 .card::before { content:""; position:absolute; inset:0 0 auto; height:2px; background:linear-gradient(90deg,#fe8019,#fabd2f,#8ec07c,#83a598); }
.a3 .water { position:absolute; right:22px; bottom:14px; font-size:44px; opacity:.07; color:#fff; font-family:var(--px); font-weight:700; pointer-events:none; }
.a3 .foot { display:flex; align-items:center; gap:14px; color:var(--fg4); font-size:11px; padding:0 4px; }
.a3 .foot .sp { flex:1; }
.a3 .mode { background:var(--gn); color:var(--bg0); font-weight:800; padding:1px 8px; border-radius:4px; letter-spacing:.06em; }

/* ---------- B: dashboard backdrop ---------- */
.dashbg { position:absolute; inset:0; padding:30px 34px; color:var(--fg4); filter:saturate(.6); }
.dashbg .big { font-family:var(--px); font-size:40px; font-weight:700; }
.dashbg .rows { margin-top:30px; display:grid; grid-template-columns:260px 1fr; gap:30px; opacity:.55; }
.dashbg .rows div { height:22px; background:#232526; border-radius:5px; margin-bottom:10px; }
.dim { position:absolute; inset:0; background:rgba(10,11,11,.55); }

/* ---------- B1 compact drawer ---------- */
.b1 { position:absolute; top:12px; right:12px; bottom:12px; width:390px; background:var(--bg0); border:1px solid #3c3836; border-radius:12px; display:flex; flex-direction:column; box-shadow:-20px 0 60px rgba(0,0,0,.5); overflow:hidden; }
.b1 .h { padding:12px 14px 10px; border-bottom:1px solid #2a2c2d; }
.b1 .h .t { color:var(--or); font-weight:800; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.b1 .h .meta { display:flex; gap:8px; align-items:center; color:var(--gr); margin-top:4px; flex-wrap:wrap; font-size:11px; }
.b1 .h .meta b { color:var(--fg2); }
.b1 .agents { display:flex; gap:6px; padding:8px 14px; border-bottom:1px solid #2a2c2d; flex-wrap:wrap; align-items:center; }
.b1 .ach { display:flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; border:1px solid #3c3836; color:var(--fg4); font-size:11px; }
.b1 .ach.on { border-color:var(--pu); color:var(--pu); background:rgba(211,134,155,.1); }
.b1 .list { flex:1; overflow:auto; padding:6px 0; scrollbar-width:thin; scrollbar-color:#504945 transparent; }
.b1 .st { display:grid; grid-template-columns:24px 1fr auto; gap:8px; padding:5px 14px; align-items:baseline; color:var(--fg4); border-left:2px solid transparent; }
.b1 .st .n { color:var(--gr); text-align:right; font-weight:700; }
.b1 .st .x { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg3); }
.b1 .st .tm { color:var(--gr); font-size:10.5px; }
.b1 .st.now .n { color:var(--ye); }
.b1 .st.on { background:#282828; border-left-color:var(--ye); }
.b1 .st.on .x { white-space:normal; color:var(--fg); }
.b1 .rep { grid-column:2 / 4; color:var(--fg4); font-size:11.5px; border-left:2px solid #3c3836; padding:4px 0 4px 10px; margin:4px 0 2px; }
.b1 .rep .chips { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
.chip { font-size:10.5px; padding:0 6px; border-radius:4px; background:#32302f; color:var(--fg3); }
.chip.ag { background:rgba(211,134,155,.14); color:var(--pu); }
.b1 .f { border-top:1px solid #2a2c2d; padding:10px 14px; display:flex; flex-direction:column; gap:8px; }
.go { display:flex; align-items:center; justify-content:center; gap:8px; padding:9px; border-radius:8px; background:var(--ye); color:var(--bg0); font-weight:800; }
.go.fork { background:var(--aq); }
.go kbd { color:var(--bg0); background:rgba(29,32,33,.12); border-color:rgba(29,32,33,.3); }
.keys { display:flex; gap:10px; flex-wrap:wrap; color:var(--gr); font-size:10.5px; }

/* ---------- B2 graph view ---------- */
.b2 { position:absolute; inset:0; background:radial-gradient(900px 400px at 50% 0%, rgba(131,165,152,.08), transparent 70%), #141617; display:flex; flex-direction:column; }
.b2 .h { display:flex; align-items:center; gap:12px; padding:44px 26px 14px; border-bottom:1px solid #232526; }
.b2 .h .t { color:var(--or); font-weight:800; font-size:15px; }
.b2 .h .meta { color:var(--gr); display:flex; gap:10px; align-items:center; }
.b2 .h .sp { flex:1; }
.b2 .canvas { position:relative; flex:1; overflow:hidden; }
.b2 svg { position:absolute; inset:0; width:100%; height:100%; }
.b2 .node { position:absolute; transform:translate(-50%,-15px); display:flex; flex-direction:column; align-items:center; gap:6px; width:120px; text-align:center; }
.b2 .node .c { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:800; background:#282828; border:2px solid #504945; color:var(--fg3); transition:.15s; }
.b2 .node small { color:var(--gr); font-size:10.5px; line-height:1.3; max-height:2.6em; overflow:hidden; }
.b2 .node.now .c { border-color:var(--ye); color:var(--ye); }
.b2 .node.on .c { background:var(--ye); border-color:var(--ye); color:var(--bg0); transform:scale(1.18); box-shadow:0 0 0 5px rgba(250,189,47,.16); }
.b2 .node.on small { color:var(--fg); }
.b2 .ag { position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:6px; padding:3px 9px; border-radius:20px; border:1px solid rgba(211,134,155,.4); color:var(--pu); background:#1d2021; font-size:11px; white-space:nowrap; }
.b2 .ag.on { background:var(--pu); color:var(--bg0); font-weight:700; }
.b2 .file { position:absolute; transform:translate(-50%,-50%); font-size:10.5px; color:var(--bl); white-space:nowrap; opacity:.85; }
.b2 .prev { border-top:1px solid #232526; background:var(--bg0); padding:14px 26px; display:grid; grid-template-columns:1fr 300px; gap:24px; min-height:150px; }
.b2 .prev .q { color:var(--fg); font-weight:700; }
.b2 .prev .a { color:var(--fg4); margin-top:6px; max-height:5.4em; overflow:hidden; }
.b2 .prev .side { display:flex; flex-direction:column; gap:8px; justify-content:flex-end; }

/* ---------- B3 quick picker ---------- */
.b3 { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:min(880px, 92%); height:min(470px, 78%); background:var(--bg0); border:1px solid #504945; border-radius:12px; display:grid; grid-template-rows:auto 1fr auto; box-shadow:0 30px 90px rgba(0,0,0,.7); overflow:hidden; }
.b3 .in { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #2a2c2d; color:var(--fg); }
.b3 .in .ttl { color:var(--ye); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.b3 .in .q { flex:1; color:var(--gr); }
.b3 .cols { display:grid; grid-template-columns:1fr 1fr; min-height:0; }
.b3 .l { border-right:1px solid #2a2c2d; overflow:auto; padding:6px 0; }
.b3 .r { padding:14px 16px; overflow:hidden; display:flex; flex-direction:column; gap:8px; }
.b3 .row { display:grid; grid-template-columns:28px 1fr auto; gap:8px; padding:4px 12px; color:var(--fg4); align-items:baseline; }
.b3 .row .x { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.b3 .row.on { background:var(--bg2); color:var(--fg); }
.b3 .row.on .n { color:var(--ye); }
.b3 .row .n { color:var(--gr); text-align:right; font-weight:700; }
.b3 .r .q { color:var(--fg); font-weight:700; }
.b3 .r .a { color:var(--fg4); flex:1; overflow:hidden; }
.b3 .ft { display:flex; gap:14px; padding:8px 14px; border-top:1px solid #2a2c2d; color:var(--gr); font-size:10.5px; flex-wrap:wrap; }
.flash { position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:5; background:var(--gn); color:var(--bg0); font-weight:800; padding:5px 12px; border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; }
.flash.show { opacity:1; }

/* ---------- A4 quiet header ---------- */
.a4 { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--tb); }
.a4 .hd { display:flex; align-items:center; gap:14px; padding:10px 18px 10px 92px; background:linear-gradient(90deg, color-mix(in srgb, var(--h) 16%, #141617), #141617 60%); border-bottom:1px solid #0a0b0b; }
.a4 .hd .ttl { color:var(--fg); font-weight:800; font-size:14px; }
.a4 .hd .sub { color:var(--fg4); font-size:11px; }
.a4 .hd .sp { flex:1; }
.a4 .dots { display:flex; gap:6px; }
.a4 .dots span { width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:10.5px; font-weight:800; color:var(--fg4); background:#232526; position:relative; }
.a4 .dots span.on { background:var(--h2); color:var(--bg0); }
.a4 .dots span i { position:absolute; right:-2px; top:-2px; width:7px; height:7px; border-radius:50%; border:1.5px solid #141617; }
.a4 .body { flex:1; position:relative; }
.a4 .sl { display:flex; gap:16px; align-items:center; padding:5px 18px; color:var(--tmu); font-size:11px; border-top:1px solid #1e2030; }
.a4 .sl .sp { flex:1; }
/* ---------- A5 split with live panel ---------- */
.a5 { position:absolute; inset:0; display:flex; flex-direction:column; background:#141617; }
.a5 .tbar { height:36px; display:flex; align-items:center; gap:4px; padding-left:88px; border-bottom:1px solid #0a0b0b; }
.a5 .tb { display:flex; align-items:center; gap:7px; padding:4px 10px; border-radius:6px; color:var(--fg4); }
.a5 .tb.on { background:var(--tb); color:var(--fg); box-shadow:inset 0 -2px 0 var(--h); }
.a5 .row { flex:1; display:grid; grid-template-columns:minmax(0,1fr) 300px; min-height:0; }
.a5 .term { background:var(--tb); position:relative; }
.a5 .live { border-left:1px solid #0a0b0b; padding:14px; display:flex; flex-direction:column; gap:14px; overflow:hidden; }
.a5 .live h4 { font-size:10.5px; color:var(--gr); letter-spacing:.08em; text-transform:uppercase; font-weight:700; margin-bottom:6px; }
.a5 .now { border:1px solid #2a2c2d; border-radius:8px; padding:10px; }
.a5 .now b { color:var(--gn); }
.a5 .fl { display:flex; flex-direction:column; gap:3px; color:var(--bl); font-size:11.5px; }
.a5 .fl span::before { content:"~ "; color:var(--gr); }
.a5 .bars { display:flex; flex-direction:column; gap:6px; }
.a5 .live .foot { margin-top:auto; display:flex; gap:8px; align-items:flex-end; color:var(--fg4); font-size:11px; }
/* ---------- A6 tiles ---------- */
.a6 { position:absolute; inset:0; background:#111213; display:flex; flex-direction:column; padding:40px 12px 10px; gap:8px; }
.a6 .grid { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; min-height:0; }
.a6 .tile { background:var(--tb); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; border:1px solid #2a2c2d; opacity:.72; }
.a6 .tile.on { opacity:1; border-color:var(--h); }
.a6 .tile .th { display:flex; align-items:center; gap:8px; padding:5px 10px; background:#181926; color:var(--tdim); font-size:11px; white-space:nowrap; overflow:hidden; }
.a6 .tile .th b { color:var(--tfg); overflow:hidden; text-overflow:ellipsis; }
.a6 .tile .tx { font-size:11px; padding:8px 12px; }
.a6 .tile.new { display:grid; place-items:center; color:var(--gr); border-style:dashed; background:transparent; }
.a6 .foot { display:flex; gap:14px; color:var(--fg4); font-size:11px; padding:0 4px; }
/* ---------- B4 bottom sheet ---------- */

      <div class="side"><button class="go ${isLast() ? "" : "fork"}">▶ ${enterLabel()} <kbd>Enter</kbd></button><div class="keys"><span><kbd>G</kbd> zum letzten</span><span><kbd>0</kbd> zum ersten</span></div></div></div></div>`;
}
function B3() {
  const list = filtered(); if (!list.some((x) => x.i === S.step) && list.length) S.step = list[list.length - 1].i;
  const s = STEPS[S.step];
  return `${backdrop()}<div class="b3"><div class="in"><span class="ttl">Volltextsuche für Rezepte</span><span style="color:var(--gr)">rezept-app</span><span class="q">${S.typing || S.q ? `/ ${esc(S.q)}<span class="cur" style="height:13px;width:6px"></span>` : "<kbd>/</kbd> filtern"}</span><span class="mp">Opus 5.5</span></div>
    <div class="cols"><div class="l">${list.map((x) => `<div class="row ${x.i === S.step ? "on" : ""}"><span class="n">${x.i + 1}</span><span class="x">${esc(x.q)}</span><span style="color:var(--gr);font-size:10.5px">${x.ag.length ? "● " : ""}${x.t}</span></div>`).join("") || `<div class="row"><span></span><span class="x">nichts gefunden</span></div>`}</div>
      <div class="r"><div class="q">${S.step + 1}. ${esc(s.q)}</div><div class="a">${esc(s.a)}</div><div style="display:flex;gap:5px;flex-wrap:wrap">${s.ag.map((a) => `<span class="chip ag">${a}</span>`).join("")}${s.files.map((f) => `<span class="chip">${f}</span>`).join("")}</div>
        <button class="go ${isLast() ? "" : "fork"}">▶ ${enterLabel()} <kbd>Enter</kbd></button></div></div>
    <div class="ft"><span><kbd>j</kbd><kbd>k</kbd> Schritt</span><span><kbd>/</kbd> filtern</span><span><kbd>Enter</kbd> los</span><span><kbd>Tab</kbd> Graph</span><span><kbd>Esc</kbd> zu</span></div></div>`;
}


function A4() {
  const t = TABS[S.tab];
  return `<div class="a4"><div class="hd" style="--h:${t.h}"><span class="dot ${t.st}"></span><span><div class="ttl">${esc(t.name)}</div><div class="sub">${t.pj} / ${t.br} · <span class="mp">${t.model}</span> · Schritt ${t.step} · ${t.cost} · ${stLabel[t.st]}</div></span><span class="sp"></span>
    <span class="dots">${TABS.map((x, i) => `<span class="${i === S.tab ? "on" : ""}" style="--h2:${x.h}">${x.n}<i class="dot ${x.st}" style="width:7px;height:7px"></i></span>`).join("")}<span>+</span></span>
    <span class="wm" style="font-size:12px;margin-left:10px">ATLAS</span></div>
    <div class="body">${termText(t)}</div>
    <div class="sl"><span>TERMINAL</span><span><kbd>⌘1</kbd>-<kbd>9</kbd> wechseln</span><span><kbd>Ctrl Esc</kbd> NORMAL</span><span class="sp"></span><span class="lim" style="--p:38%">5h <i></i> 38 %</span>${MASCOT}</div></div>`;
}
function A5() {
  const t = TABS[S.tab];
  return `<div class="a5"><div class="tbar"><span class="wm" style="font-size:12px;margin-right:10px">ATLAS</span>${TABS.map((x, i) => `<span class="tb ${i === S.tab ? "on" : ""}" style="--h:${x.h}"><span class="num" style="background:${x.h}">${x.n}</span><span class="dot ${x.st}"></span>${esc(x.name.length > 20 ? x.name.slice(0, 19) + "…" : x.name)}</span>`).join("")}</div>
    <div class="row"><div class="term">${termText(t)}</div>
    <div class="live"><div><h4>Gerade</h4><div class="now"><span class="dot ${t.st}"></span> <b>${t.st === "run" ? "Bash" : stLabel[t.st]}</b> ${t.st === "run" ? "bun test search" : ""}<div style="color:var(--gr);font-size:11px;margin-top:4px">seit 12 s · Schritt ${t.step}</div></div></div>
      <div><h4>Dateien</h4><div class="fl"><span>src/search/normalize.ts</span><span>src/search/search.test.ts</span><span>src/hooks/useRecipeSearch.ts</span></div></div>
      <div><h4>Helfer</h4><div style="display:flex;gap:5px;flex-wrap:wrap"><span class="chip ag">● Allrounder</span><span class="chip ag">● Sucher</span></div></div>
      <div><h4>Limit</h4><div class="bars"><span class="lim" style="--p:38%">5h <i style="width:150px"></i> 38 %</span><span class="lim" style="--p:61%">7T <i style="width:150px"></i> 61 %</span></div></div>
      <div class="foot">${MASCOT}<span><kbd>⌘B</kbd> Spalte aus</span></div></div></div></div>`;
}
function A6() {
  return `<div class="a6"><div class="grid">${TABS.map((x, i) => `<div class="tile ${i === S.tab ? "on" : ""}" style="--h:${x.h}"><div class="th"><span class="num" style="background:${x.h}">${x.n}</span><span class="dot ${x.st}"></span><b>${esc(x.name)}</b><span>${x.pj}</span></div>${termText(x)}</div>`).join("")}<div class="tile new"><span>+ neues Terminal <kbd>⌘T</kbd></span></div></div>
    <div class="foot"><span class="wm">ATLAS</span><span><kbd>⌘1</kbd>-<kbd>4</kbd> Fokus</span><span><kbd>Enter</kbd> groß</span><span><kbd>⌘Esc</kbd> Atlas</span></div></div>`;
}
function B4() {
  const s = STEPS[S.step], from = Math.max(0, Math.min(S.step - 3, STEPS.length - 6));
  return `${backdrop()}<div class="b4"><div class="h"><span class="dot run"></span><span class="t">Volltextsuche für Rezepte</span><span style="color:var(--gr)">rezept-app · ${STEPS.length} Schritte · $5.88</span><span class="sp"></span><span class="keys"><span><kbd>h</kbd><kbd>l</kbd> Schritt</span><span><kbd>Enter</kbd> los</span><span><kbd>Esc</kbd> zu</span></span></div>
    <div class="chain">${from ? `<span class="ln">… ${from}</span>` : ""}${STEPS.slice(from, from + 6).map((x, j) => { const i = from + j; return `${j ? `<span class="ln">─</span>` : ""}<span class="cs ${i === S.step ? "on" : ""}"><b>${i + 1}</b><span class="x">${esc(x.q)}</span>${x.ag.length ? `<span class="ag">●${x.ag.length}</span>` : ""}</span>`; }).join("")}</div>
    <div class="pv"><span class="a">${esc(s.a)}</span><button class="go ${isLast() ? "" : "fork"}">▶ ${enterLabel()} <kbd>Enter</kbd></button></div></div>`;
}
function B5() {
  const others = [["Soundeffekte einbauen", "game-jam-2026", "wait", "3h"], ["Setup-Skript für Mac", "dotfiles", "run", "7h"], ["Monatsbericht als PDF", "haushaltsbuch", "err", "10h"]];
  const last = STEPS.slice(-4).map((x, j) => ({ ...x, i: STEPS.length - 4 + j }));
  if (S.step < STEPS.length - 4) S.step = STEPS.length - 4;
  return `<div class="b5"><div class="big wm">SESSION ATLAS</div><div class="menu">${"<div></div>".repeat(7)}</div><div class="list">
    <div class="r on"><span class="num" style="background:var(--ye)">1</span><span class="dot run"></span><span class="x">Volltextsuche für Rezepte</span><span style="color:var(--ye)">rezept-app</span><span>12m</span></div>
    <div class="exp">${last.map((x) => `<div class="s ${x.i === S.step ? "on" : ""}"><b>${x.i + 1}</b><span class="x">${esc(x.q)}</span><span style="color:var(--gr)">${x.t}</span></div>`).join("")}
      <div class="acts"><button class="go ${isLast() ? "" : "fork"}">▶ ${enterLabel()} <kbd>Enter</kbd></button><span><kbd>j</kbd><kbd>k</kbd> Schritt</span><span><kbd>v</kbd> ganzer Verlauf</span><span><kbd>Esc</kbd> zuklappen</span></div></div>
    ${others.map((o, i) => `<div class="r"><span class="num">${i + 2}</span><span class="dot ${o[2]}"></span><span class="x">${o[0]}</span><span>${o[1]}</span><span>${o[3]}</span></div>`).join("")}</div></div>`;
}
// rows for the vertical graph: steps on the main line, helpers as short side branches
function b6Rows() { const rows = []; STEPS.forEach((x, i) => { rows.push({ k: "s", i, x }); x.ag.forEach((a, j) => rows.push({ k: "a", i, a, last: j === x.ag.length - 1 })); }); return rows; }
function B6() {
  const rows = b6Rows(); if (S.row == null) S.row = rows.length - 1 - (STEPS[STEPS.length - 1].ag.length);
  const r = rows[S.row]; S.step = r.i;
  const gut = (row) => {
    const main = `<line x1="16" y1="0" x2="16" y2="26" stroke="#504945" stroke-width="2"/>`;
    if (row.k === "s") { const on = rows[S.row] === row, now = row.i === STEPS.length - 1;
      return `<svg viewBox="0 0 64 26">${main}<circle cx="16" cy="13" r="${on ? 6 : 4.5}" fill="${on ? "#fabd2f" : now ? "#1d2021" : "#665c54"}" stroke="${now ? "#fabd2f" : "none"}" stroke-width="2"/></svg>`; }
    return `<svg viewBox="0 0 64 26">${main}<path d="M16,${row.first ? 0 : 0} C16,10 34,6 34,13" stroke="#d3869b" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/><circle cx="34" cy="13" r="3.5" fill="${rows[S.row] === row ? "#d3869b" : "#1d2021"}" stroke="#d3869b" stroke-width="1.5"/></svg>`;
  };
  return `${backdrop()}<div class="b6"><div class="h"><div class="t">Volltextsuche für Rezepte</div><div class="meta"><span class="dot run"></span>rezept-app / feat/suche <span class="mp">Opus 5.5</span> ${STEPS.length} Schritte · $5.88</div></div>
    <div class="log">${rows.map((row, idx) => `<div class="ln ${row.k === "a" ? "ag" : ""} ${idx === S.row ? "on" : ""}">${gut(row)}<span class="x">${row.k === "s" ? `<b style="color:var(--gr);margin-right:8px">${row.i + 1}</b>${esc(row.x.q)}` : `Helfer: ${row.a}`}</span><span class="tm">${row.k === "s" ? row.x.t : ""}</span></div>`).join("")}</div>
    <div class="pv"><div class="a">${r.k === "s" ? esc(r.x.a) : `Helfer „${r.a}“ bei Schritt ${r.i + 1}: Auftrag und Ergebnis stehen hier.`}</div>
      <button class="go ${isLast() ? "" : "fork"}">▶ ${enterLabel()} <kbd>Enter</kbd></button>
      <div class="keys"><span><kbd>j</kbd><kbd>k</kbd> Zeile</span><span><kbd>J</kbd><kbd>K</kbd> nur Schritte</span><span><kbd>G</kbd> letzter</span><span><kbd>Esc</kbd> zu</span></div></div></div>`;
}
const R = { a1: A1, a2: A2, a3: A3, a4: A4, a5: A5, a6: A6, b1: B1, b2: B2, b3: B3, b4: B4, b5: B5, b6: B6 };
function render() {
  const v = cur();
  $("screen").innerHTML = R[v.key]() + `<div class="flash ${S.flash ? "show" : ""}">${esc(S.flash)}</div>`;
  $("note").innerHTML = `<span><b>${S.sec === "A" ? "A Terminal" : "B Session-Leiste"} · ${v.name}:</b> ${v.why}</span>`;
  const sel = S.sec === "A" ? `Terminal <b>${S.tab + 1}</b> (${TABS[S.tab].pj}), Tasten: <kbd>⌘1</kbd>-<kbd>3</kbd>, <kbd>⌘]</kbd> <kbd>⌘[</kbd>`
    : `Schritt <b>${S.step + 1}</b> von ${STEPS.length}${S.agent >= 0 ? `, Helfer ${S.agent + 1}` : ""}${S.q ? `, Filter „${esc(S.q)}“` : ""}<br>Enter würde: <b>${enterLabel()}</b>`;
  $("state").innerHTML = sel;
  $("bar").innerHTML = `<span class="sec"><button data-sec="A" class="${S.sec === "A" ? "on" : ""}">A Terminal</button><button data-sec="B" class="${S.sec === "B" ? "on" : ""}">B Leiste</button></span>
    ${VARIANTS[S.sec].map((x, i) => `<button data-v="${i}" class="${i === S.v[S.sec] ? "on" : ""}">${i + 1} ${x.name}</button>`).join("")}<span class="hint"><kbd>1</kbd>-<kbd>6</kbd> <kbd>[</kbd> <kbd>]</kbd> Variante · <kbd>⇧Tab</kbd> A/B</span>`;
  const u = new URL(location); u.searchParams.set("v", v.key); history.replaceState(null, "", u);
}
function flash(msg) { S.flash = msg; render(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.flash = ""; render(); }, 1300); }
$("bar").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.sec) S.sec = b.dataset.sec; if (b.dataset.v) S.v[S.sec] = +b.dataset.v; render(); });

let pendG = false;
document.addEventListener("keydown", (e) => {
  const k = e.key, n = STEPS.length, vk = cur().key;
  if (S.typing) {
    if (k === "Escape") { S.typing = false; S.q = ""; } else if (k === "Enter") S.typing = false;
    else if (k === "Backspace") S.q = S.q.slice(0, -1); else if (k.length === 1) S.q += k; else return;
    e.preventDefault(); return render();
  }
  if (k === "Tab" && e.shiftKey) { e.preventDefault(); S.sec = S.sec === "A" ? "B" : "A"; return render(); }
  if (k === "]" && !e.metaKey) { S.v[S.sec] = (S.v[S.sec] + 1) % VARIANTS[S.sec].length; return render(); }
  if (k === "[" && !e.metaKey) { S.v[S.sec] = (S.v[S.sec] + VARIANTS[S.sec].length - 1) % VARIANTS[S.sec].length; return render(); }
  if (!e.metaKey && /^[1-6]$/.test(k) && !(cur().key === "b2")) { S.v[S.sec] = +k - 1; return render(); }
  if (S.sec === "A") {
    if (e.metaKey && /^[1-3]$/.test(k)) { e.preventDefault(); S.tab = +k - 1; return render(); }
    if (e.metaKey && (k === "]" || k === "[")) { e.preventDefault(); S.tab = (S.tab + (k === "]" ? 1 : 2)) % 3; return render(); }
    if (pendG && (k === "t" || k === "T")) { pendG = false; S.tab = (S.tab + (k === "t" ? 1 : 2)) % 3; return render(); }
    pendG = k === "g"; return;
  }
  const move = (d) => { S.step = Math.max(0, Math.min(n - 1, S.step + d)); S.agent = -1; };
  if (vk === "b3") {
    const list = filtered(), pos = list.findIndex((x) => x.i === S.step);
    if (k === "/") { e.preventDefault(); S.typing = true; }
    else if (k === "j" || k === "ArrowDown") S.step = list[Math.min(list.length - 1, pos + 1)]?.i ?? S.step;
    else if (k === "k" || k === "ArrowUp") S.step = list[Math.max(0, pos - 1)]?.i ?? S.step;
    else if (k === "Tab") { e.preventDefault(); S.v.B = 1; }
    else if (k === "Enter") return flash("▶ " + enterLabel());
    else if (k === "Escape") { S.q = ""; return flash("Leiste geschlossen"); }
    else return;
    return render();
  }
  if (vk === "b2") {
    const cnt = STEPS[S.step].ag.length;
    if (k === "l" || k === "ArrowRight") move(1); else if (k === "h" || k === "ArrowLeft") move(-1);
    else if (k === "j" || k === "ArrowDown") { if (cnt) S.agent = Math.min(cnt - 1, S.agent + 1); }
    else if (k === "k" || k === "ArrowUp") S.agent = Math.max(-1, S.agent - 1);
    else if (k === "G" || k === "$") move(n); else if (k === "0") move(-n);
    else if (k === "Enter") return flash("▶ " + enterLabel());
    else if (k === "Escape") return flash("Graph geschlossen");
    else return;
    return render();
  }
  if (vk === "b4") {
    if (k === "l" || k === "ArrowRight" || k === "j") move(1); else if (k === "h" || k === "ArrowLeft" || k === "k") move(-1);
    else if (k === "Enter") return flash("▶ " + enterLabel()); else if (k === "Escape") return flash("Leiste geschlossen"); else return;
    return render();
  }
  if (vk === "b5") {
    if (k === "j" || k === "ArrowDown") move(1); else if (k === "k" || k === "ArrowUp") { if (S.step > STEPS.length - 4) move(-1); }
    else if (k === "v") { S.v.B = 5; S.row = null; }
    else if (k === "Enter") return flash("▶ " + enterLabel()); else if (k === "Escape") return flash("zugeklappt"); else return;
    return render();
  }
  if (vk === "b6") {
    const rows = b6Rows();
    if (k === "j" || k === "ArrowDown") S.row = Math.min(rows.length - 1, S.row + 1);
    else if (k === "k" || k === "ArrowUp") S.row = Math.max(0, S.row - 1);
    else if (k === "J") { let i = S.row + 1; while (i < rows.length && rows[i].k !== "s") i++; if (i < rows.length) S.row = i; }
    else if (k === "K") { let i = S.row - 1; while (i >= 0 && rows[i].k !== "s") i--; if (i >= 0) S.row = i; }
    else if (k === "G") S.row = rows.findIndex((r) => r.k === "s" && r.i === STEPS.length - 1);
    else if (k === "Enter") return flash("▶ " + enterLabel()); else if (k === "Escape") return flash("Leiste geschlossen"); else return;
    return render();
  }
  // b1
  const allAg = [...new Set(STEPS.flatMap((x) => x.ag))];
  if (k === "j" || k === "ArrowDown") move(1); else if (k === "k" || k === "ArrowUp") move(-1);
  else if (k === "G") move(n); else if (k === "l" || k === " ") S.expand = !S.expand;
  else if (k === "a") { S.agent = S.agent + 1 >= allAg.length ? -1 : S.agent + 1; if (S.agent >= 0) { const i = STEPS.findIndex((x) => x.ag.includes(allAg[S.agent])); if (i >= 0) S.step = i; } }
  else if (k === "g") { S.v.B = 1; }
  else if (k === "Enter") return flash("▶ " + enterLabel());
  else if (k === "Escape") return flash("Leiste geschlossen");
  else return;
  render();
});
render();
</script>
